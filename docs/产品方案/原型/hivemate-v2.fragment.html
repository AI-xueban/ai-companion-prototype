function mayReview(w){const r=reviewerIdentity();return w.classId===r.classId&&(r.homeroom||(w.subjects||[]).some(x=>r.subjects.includes(x)))}

function modal(title,body,actions='',wide=false){layer.innerHTML=`<div class="n-overlay"><section class="n-dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="n-close" data-action="close" aria-label="关闭弹窗">×</button><h2>${esc(title)}</h2>${body}${actions?`<div class="n-dialogactions">${actions}</div>`:''}</section></div>`;layer.querySelector('button')?.focus()}
function heading(eyebrow,title,sub,actions=''){return `<div class="n-heading"><div><div class="n-eyebrow">${eyebrow}</div><h1>${title}</h1><p class="n-sub">${sub}</p></div>${actions}</div>`}
function section(t,link='',page=''){return `<div class="n-section"><h2>${t}</h2>${link?`<button class="n-btn ghost" data-page="${page}">${link} →</button>`:''}</div>`}
function art(type){return `<span class="n-cover-art ${type}" aria-hidden="true">${type==='atom'?'<i></i><b></b>':type==='math'?'ƒ':''}</span>`}
function cover(r){return `<div class="n-cover ${r.color||'lavender'}"><span class="n-coverkicker">${r.type==='互动课件'?'INTERACTIVE LEARNING':r.type==='题目讲解'||r.type==='作业讲解'?'SHARE YOUR THINKING':'IDEAS INTO LEARNING'}</span><h3>${esc(r.cover||r.title).replace(/\n/g,'<br>')}</h3>${art(r.art||'book')}<span class="n-format">${esc(r.format||r.type)}</span></div>`}
function card(r,student=false){return `<article class="n-resource"><button class="n-coverbtn" data-${student?'work':'resource'}="${r.id}" aria-label="预览${esc(r.title)}">${cover(r)}</button><div class="n-resourcebody"><div class="n-resmeta"><span>${r.subject} · ${r.grade}</span><span>／</span><span>${esc(r.chapter||'主题创作')}</span></div><h3><button class="n-titlebtn" data-${student?'work':'resource'}="${r.id}">${esc(r.title)}</button></h3><span class="n-badge ${student?'green':'violet'}">${student?esc(r.tag):esc(r.tag||'私人资源')}</span><div class="n-resfoot"><span class="n-author"><span class="n-avatar">${esc(r.author?.slice(0,1)||'我')}</span>${esc(r.author||'张老师')}</span><span>${student?'分享让学习发生':`复用 ${r.used||0} · v${r.version||'1.0'}`}</span></div></div></article>`}
function heroArt(){return `<div class="n-hero-art" aria-hidden="true"><div class="n-art-orbit"></div><div class="n-art-sheet">IDEA<br>${S.role==='teacher'?'变成一堂好课':'记录我的想法'}<div class="n-artline"></div><div class="n-artline" style="width:60%"></div></div><span class="n-art-bubble">✳</span><span class="n-art-dot"></span> </div>`}
function sim(key){return `<div class="n-sim"><p class="n-simlabel">TRY IT / 可交互演示</p><h3>排开的水越多，浮力越大吗？</h3><p class="n-sub">先猜一猜，再拖动参数验证。</p><div class="n-experiment"><div class="n-tank" aria-label="完全浸入水中的物体示意"><div class="n-water"></div><div class="n-block">物体</div></div><div><div class="n-small">受到的浮力</div><div class="n-forcenum" data-force="${key}">4.0 <span style="font-size:15px">N</span></div><div class="n-small">F浮 = ρ水 × g × V排</div></div></div><label class="n-simcontrols" for="hn-volume-${key}"><span>排开水的体积</span><b data-volume="${key}">400 cm³</b></label><input id="hn-volume-${key}" type="range" min="100" max="800" step="50" value="400" data-sim="${key}" aria-label="排开水的体积"><div class="n-simfooter">示例取水的密度 1000 kg/m³，g = 10 N/kg。图形为示意，不代表测量数据。</div></div>`}
function teacherHome(){return heading('YOUR TEACHING, REIMAGINED','好课，从一个好想法开始。','张老师，欢迎回来。备课、创作、复用，让教学灵感有处安放。',`<span class="n-badge violet">教师专属空间</span>`)+`<section class="n-hero"><div><div class="n-eyebrow">CREATE WITH AI</div><h2>把你的教学想法，<br>变成能互动的课堂。</h2><p>描述一节课，上传一份资料，或从其他老师的好作品开始。</p><div class="n-row"><button class="n-btn dark" data-page="studio">✳ 开始 AI 创作</button><button class="n-btn" data-action="upload">上传已有资源 ↗</button></div></div>${heroArt()}</section><div class="n-toolgrid"><button class="n-tool" data-page="discover"><span class="n-toolicon">▦</span><div><strong>按教材找资源</strong><p>版本、章节，精准找到这节课</p></div></button><button class="n-tool" data-page="space"><span class="n-toolicon">▣</span><div><strong>我的教学空间</strong><p>创作、收藏与副本，一起整理</p></div></button><button class="n-tool" data-action="assign"><span class="n-toolicon">＋</span><div><strong>布置一个任务</strong><p>将好资源用进日常教学</p></div></button></div>${section('值得带进课堂的好资源','探索教学广场','discover')}<div class="n-grid">${resources.filter(r=>r.public).slice(0,3).map(r=>card(r)).join('')}</div>${section('今天的教学安排','班级与作业','tasks')}<div class="n-panel" style="padding-top:0;padding-bottom:0">${tasks.slice(0,2).map(t=>taskRow(t,true)).join('')}</div>`}
function filters(){return `<div class="n-filters"><label class="n-field">学科<select data-filter="subject" aria-label="筛选学科">${['全部学科','物理','数学','语文','英语'].map(x=>`<option ${S.subject===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="n-field">年级<select data-filter="grade" aria-label="筛选年级">${['全部年级','八年级','七年级'].map(x=>`<option ${S.grade===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="n-field">教材版本<select data-filter="book" aria-label="筛选教材版本">${['全部版本','人教版','统编版'].map(x=>`<option ${S.book===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="n-field">章节<select data-filter="chapter" aria-label="筛选章节">${['全部章节','浮力','一次函数','桃花源记','声现象','校园生活'].map(x=>`<option ${S.chapter===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`}
function teacherDiscover(){const list=resources.filter(r=>r.public&&(S.kind==='全部资源'||r.type===S.kind)&&(S.subject==='全部学科'||r.subject===S.subject)&&(S.grade==='全部年级'||r.grade===S.grade)&&(S.book==='全部版本'||r.book===S.book)&&(S.chapter==='全部章节'||r.chapter===S.chapter)&&(!S.q||[r.title,r.chapter,r.author,r.subject].join(' ').includes(S.q)));return heading('TEACHER RESOURCE GALLERY','每一份好资源，都值得被复用。','来自教师的真实创作。按教材找灵感，预览后带进自己的课堂。',`<button class="n-btn primary" data-action="upload">＋ 分享教学资源</button>`)+filters()+`<div class="n-searchrow"><div class="n-chips" style="margin:0">${['全部资源','互动课件','教学课件','教案文档','练习试卷'].map(x=>`<button class="n-chip ${S.kind===x?'active':''}" data-kind="${x}">${x}</button>`).join('')}</div></div><div class="n-searchrow"><div class="n-search"><span aria-hidden="true">⌕</span><input id="hn-search" aria-label="搜索教学资源" placeholder="搜索课题、资源或作者" value="${esc(S.q)}"><button class="n-btn ghost" data-action="search">搜索</button></div><span class="n-small">找到 ${list.length} 份适用资源</span></div><div class="n-grid">${list.map(r=>card(r)).join('')||'<div class="n-empty"><h3>这个组合暂时没有资源</h3><p class="n-small">换一个章节，或清除筛选后看看。</p><button class="n-btn" style="margin-top:15px" data-action="clear-filter">清除筛选</button></div>'}</div>`}
function teacherSpace(){let rows=resources.filter(r=>S.own.includes(r.id)||S.collections.includes(r.id));if(S.space==='我创作的')rows=rows.filter(r=>S.own.includes(r.id)&&!r.file&&!r.origin);if(S.space==='我上传的')rows=rows.filter(r=>S.own.includes(r.id)&&r.file);if(S.space==='已收藏')rows=rows.filter(r=>S.collections.includes(r.id));if(S.space==='另存副本')rows=rows.filter(r=>r.origin);return heading('MY TEACHING SPACE','把好想法，存进自己的教学空间。','你的创作、已有文件、收藏与独立副本。按需修改，随时用于教学。',`<div class="n-row"><button class="n-btn" data-action="upload">上传文件</button><button class="n-btn primary" data-page="studio">✳ AI 创作</button></div>`)+`<div class="n-chips">${['全部','我创作的','我上传的','已收藏','另存副本'].map(x=>`<button class="n-chip ${S.space===x?'active':''}" data-space="${x}">${x}</button>`).join('')}</div><div class="n-grid">${rows.map(r=>card(r)).join('')||'<div class="n-empty"><h3>从第一份教学资源开始</h3><p class="n-small">上传已有文件，或到教师广场另存一份可修改的资源。</p><div class="n-row" style="justify-content:center;margin-top:18px"><button class="n-btn" data-page="discover">去广场找资源</button><button class="n-btn primary" data-page="studio">开始创作</button></div></div>'}</div>`}
function studio(){return heading('AI CREATIVE STUDIO','让想法成为一件可用的作品。','描述目标 → 预览试用 → 调整完善 → 保存或发布。',`<div class="n-row"><button class="n-btn" data-action="save-studio">保存到教学空间</button><button class="n-btn primary" data-action="publish-studio">发布到教师广场</button></div>`)+`<div class="n-studio"><aside class="n-panel n-studioprompt"><h3>✳ 这次想做什么？</h3><div class="n-chips" style="gap:2px">${['互动课件','教案文档','练习试卷'].map(x=>`<button class="n-chip ${S.studioType===x?'active':''}" style="padding:5px 7px;font-size:11px" data-studiotype="${x}">${x}</button>`).join('')}</div><label class="n-formlabel" for="hn-prompt">教学目标与想法</label><textarea id="hn-prompt">${esc(S.prompt)}</textarea><label class="n-formlabel" for="hn-studio-title">作品名称</label><input id="hn-studio-title" value="${esc(S.draftTitle)}"><div class="n-row" style="margin-top:13px"><span class="n-badge">人教版</span><span class="n-badge">八年级物理</span><span class="n-badge">浮力</span></div><button class="n-btn primary" style="width:100%;margin-top:18px" data-action="generate">${S.generated?'更新作品预览':'生成作品预览'} ↗</button><p class="n-small" style="margin-top:10px">当前为示例生成，可直接操作右侧预览。未连接真实 AI。</p></aside><section class="n-panel n-studiopreview"><div class="n-previewbar"><span class="n-row"><span class="n-badge violet">${S.generated?'已生成草稿':'示例作品'}</span><b style="font-size:12px">${esc(S.draftTitle)}</b></span><span class="n-small">${esc(S.studioType)} · 私人草稿</span></div><div class="n-previewbody">${S.studioType==='互动课件'?sim('studio'):`<div class="n-previewtext"><h2>${esc(S.draftTitle)}</h2>\n${S.studioType==='教案文档'?'学习目标：理解浮力与排开液体的关系。\n\n教学步骤：提出猜想 → 观察现象 → 对比讨论 → 形成解释。\n\n评价重点：能否用证据解释现象。':'1. 物体静止漂浮时，浮力与重力是什么关系？\n\n2. 同种液体中，排开液体体积增大时浮力如何变化？\n\n3. 请用一个生活实例说明你的理解。'}</div>`}<label class="n-formlabel" for="hn-studio-notes">教学说明 · 可以直接修改</label><textarea id="hn-studio-notes" style="min-height:90px">${esc(S.studioNotes)}</textarea><div class="n-note" style="margin-top:13px">教师备注与参考答案只保留在教学空间；下发学生时单独选择可见内容。</div></div></section></div>`}
function taskRow(t,teacher=false){return `<div class="n-task"><span class="n-taskicon">${t.stage==='课前'?'⌕':t.stage==='课中'?'✳':'▤'}</span><div class="n-tasktext"><div class="n-row"><h3>${esc(t.title)}</h3><span class="n-badge ${t.submitted?'green':'violet'}">${teacher?t.stage:t.submitted?'已提交':'待完成'}</span></div><p>${t.subject} · 八年级 2 班 · ${t.deadline}</p></div><button class="n-btn" data-task="${t.id}">${teacher?'查看任务':t.submitted?'查看反馈':'打开作业'} →</button></div>`}
function teacherTasks(){return heading('CLASS & ASSIGNMENTS','把资源，用进每一次教学。','八年级 2 班 · 课前、课中、课后，共用同一条任务记录。',`<button class="n-btn primary" data-action="assign">＋ 布置作业</button>`)+`<div class="n-two"><section class="n-panel"><div class="n-row" style="margin-bottom:8px"><span class="n-badge violet">本班任务</span><span class="n-small">${tasks.length} 项教学安排</span></div>${tasks.map(t=>taskRow(t,true)).join('')}</section><aside class="n-panel"><h3>从资源到任务</h3><p class="n-sub">找到好课件后，可以直接关联到班级任务。学生只看到老师选择下发的内容。</p><div class="n-note" style="margin:14px 0">学生也可浏览教学资源广场中的学习资源；教案备注和参考答案不随学习版公开。</div><button class="n-btn" data-page="discover">选择教学资源 →</button></aside></div>`}
function feedback(){const pending=works.filter(w=>w.status==='pending'&&mayReview(w));const r=reviewerIdentity();return heading('CLASSROOM REVIEW','本班作品，由有权限的老师把关。','学生先选科目再创作；本班任一所选科目任课老师或班主任可审核。',`<select id="hn-reviewer" class="n-review-select" aria-label="审核教师身份">${[['homeroom','本班班主任'],['数学','本班数学老师'],['语文','本班语文老师'],['英语','本班英语老师'],['物理','本班物理老师'],['美术','本班美术老师'],['other-class','其他班级数学老师']].map(([v,t])=>`<option value="${v}" ${S.reviewer===v?'selected':''}>${t}</option>`).join('')}</select>`)+`<div class="n-notice n-note">当前：${r.name} · ${r.classId===S.studentProfile.classId?S.studentProfile.className:'其他班级'}。多科目默认由任一关联科目老师或班主任审核；不要求所有科目老师逐一会签。</div><section class="n-panel" style="margin-top:18px"><h2>学生投稿 · ${pending.length} 份</h2>${pending.length?pending.map(w=>`<div class="n-feed"><span class="n-avatar">${esc(w.author?.slice(0,1)||'学')}</span><div class="n-feedmain"><h3>${esc(w.title)}</h3><p>${esc(w.author)} · ${esc(w.className||'')} · ${(w.subjects||[]).map(esc).join('、')} · ${esc(w.type)}</p><p>${esc(w.desc)}</p>${w.sourceTitle?`<p>已完成来源：${esc(w.sourceTitle)}</p>`:''}<div class="n-row" style="margin-top:12px">${mayReview(w)?`<button class="n-btn" data-review="${w.id}" data-decision="return">退回修改</button><button class="n-btn primary" data-review="${w.id}" data-decision="approve">审核通过</button>`:'<span class="n-badge orange">无审核权限：需要本班所选科目老师或班主任</span>'}</div></div></div>`).join(''):'<div class="n-empty" style="margin-top:16px"><h3>暂无待审核作品</h3><p class="n-small">切换学生，在真实平板中投稿后可回到这里审核。</p></div>'}</section>`}

function syncStudio(){const p=root.querySelector('#hn-prompt'),t=root.querySelector('#hn-studio-title'),n=root.querySelector('#hn-studio-notes');if(p)S.prompt=p.value;if(t)S.draftTitle=t.value.trim()||'未命名教学资源';if(n)S.studioNotes=n.value}
function go(page){syncStudio();S.page=page;S.pages[S.role]=page;layer.innerHTML='';render();remember()}
function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{role:S.role,page:S.page},privateContent:null}).catch(()=>{})}
function render(){
persistPlatform();root.classList.toggle('tablet-mode',S.role==='student');root.querySelectorAll('[data-role]').forEach(b=>{b.classList.toggle('active',b.dataset.role===S.role);b.setAttribute('aria-pressed',String(b.dataset.role===S.role))});
root.querySelector('#hn-topavatar').textContent=S.role==='teacher'?'张':'李';
if(S.role==='student'){persistPlatform();window.location.assign('/tablet/?hivemateEmbed=1');return}
const nav=teacherNav;if(!nav.some(n=>n[0]===S.page))S.page='home';root.querySelector('#hn-nav').innerHTML=nav.map(([p,i,t])=>`<button class="${S.page===p?'active':''}" data-page="${p}"><i class="n-ico" aria-hidden="true">${i}</i>${t}</button>`).join('');root.querySelector('#hn-navlabel').textContent='TEACHING SPACE';root.querySelector('#hn-create').textContent='＋ 新建教学资源';root.querySelector('#hn-create').dataset.action='new-resource';root.querySelector('#hn-side-note').innerHTML='<b>资源与作品，各有开放范围。</b>教师资源需开放学习版，学生才可在广场查看。学生投稿由本班有权限的老师审核。';root.querySelector('#hn-user').innerHTML='<span class="n-avatar">张</span><div><h3 style="font-size:12px">张老师</h3><p class="n-small">教学工作空间</p></div>';root.querySelector('#hn-breadcrumb').innerHTML='教师空间 / '+(nav.find(n=>n[0]===S.page)?.[2]||'');content.innerHTML=({home:teacherHome,discover:teacherDiscover,space:teacherSpace,studio,tasks:teacherTasks,feedback}[S.page]||teacherHome)();}

function detail(id){const r=resources.find(x=>x.id===id);if(!r)return;S.detail=id;const copied=Boolean(r.origin);modal(r.title,`<p class="n-sub">${r.author} · ${r.subject} · ${r.grade} · ${r.book} · ${r.chapter}</p><label class="n-check"><input type="checkbox" data-student-visible="${r.id}" ${r.studentVisible?'checked':''}><span>向学生学习广场开放学习版（不包括教案备注和教师答案）</span></label><div class="n-detailgrid"><div>${r.id==='r1'||(r.type==='互动课件'&&(r.chapter==='浮力'||r.origin==='r1'))?sim('detail'):cover(r)}<div class="n-note" style="margin-top:13px">${esc(r.desc)}${r.file?'<br>文件：'+esc(r.file)+'。当前原型仅记录文件，不执行上传文件中的代码。':''}</div></div><aside class="n-detailinfo"><p><b>资源格式</b><br>${r.format}</p><p><b>适用环节</b><br>${r.use}</p><p><b>使用版本</b><br>v${r.version}</p><p><b>复用方式</b><br>${r.type==='练习试卷'?'可预览与用于任务':'可收藏、另存副本'}</p><p><b>来源说明</b><br>${copied?'另存自 '+esc(r.originAuthor)+'，保留来源版本':esc(r.author)+'的原创／授权教学资源'}</p></aside></div>`,`<button class="n-btn" data-action="collect">${S.collections.includes(id)?'已收藏':'收藏资源'}</button><button class="n-btn" data-action="copy">另存到教学空间</button>${S.own.includes(id)?'<button class="n-btn" data-action="edit-resource">编辑我的副本</button>':''}${S.own.includes(id)&&!r.public?'<button class="n-btn" data-action="publish-resource">发布到教师广场</button>':''}<button class="n-btn primary" data-action="use-resource">用于班级任务 →</button>`,true)}
function upload(existing=null){S.uploadFile=null;S.editWorkId=existing?.id||null;const teacher=S.role==='teacher';modal(teacher?'上传教学资源':'分享我的讲解与作品',`<p class="n-sub">${teacher?'已有文件，也能成为教学资产。先存入自己的空间，再决定是否分享。':'选一份已经完成的内容。无需额外写报告，也不强制使用 AI。'}</p><label class="n-formlabel" for="hn-upload-title">${teacher?'资源':'作品'}名称</label><input id="hn-upload-title" placeholder="${teacher?'例如：浮力互动演示课件':'例如：这道题，我找到了一个更简单的方法'}" value="${esc(existing?.title||'')}"><label class="n-formlabel" for="hn-upload-type">内容类型</label><select id="hn-upload-type">${(teacher?['互动课件','教学课件','教案文档','练习试卷']:['题目讲解','作业讲解','自定义作品']).map(x=>`<option ${existing?.type===x?'selected':''}>${x}</option>`).join('')}</select>${teacher?`<div class="n-row" style="margin-top:14px"><label class="n-field">学科<select id="hn-upload-subject"><option>物理</option><option>数学</option><option>语文</option><option>英语</option></select></label><label class="n-field">年级<select id="hn-upload-grade"><option>八年级</option><option>七年级</option></select></label><label class="n-field">教材版本<select id="hn-upload-book"><option>人教版</option><option>统编版</option></select></label><label class="n-field">章节<select id="hn-upload-chapter"><option>浮力</option><option>一次函数</option><option>桃花源记</option><option>声现象</option><option>校园生活</option></select></label></div>`:''}<div class="n-drop"><span style="font-size:25px;color:var(--n-accent)" aria-hidden="true">↥</span><b>选择已有文件，或录好后再上传</b><p class="n-small">${teacher?'课件、文档、图片、视频或 HTML 资源包':'题目图片、讲解录音、短视频或原创作品'}</p><input id="hn-file" type="file" aria-label="选择上传文件" accept="${teacher?'.pdf,.ppt,.pptx,.doc,.docx,.html,.zip,image/*,video/*,audio/*':'image/*,video/*,audio/*,.pdf'}"><p class="n-filechosen" id="hn-filechosen"></p></div><label class="n-formlabel" for="hn-upload-desc">${teacher?'教材与用途说明':'补充说明（选填）'}</label><input id="hn-upload-desc" placeholder="${teacher?'例如：人教版八年级物理 · 浮力 · 课堂演示':'比如：我想讲清楚容易出错的这一步'}"><label class="n-check"><input type="checkbox" id="hn-upload-consent"><span>我确认拥有分享权限，保留本人贡献和引用来源，不包含私人信息。</span></label><div class="n-note" style="margin-top:12px">${teacher?'保存后默认私人可见。文件只在本次演示中记录，不会上传到服务器。':'作品审核通过后才进入广场。示例奖励 +10 金币，同一作品不重复结算；正式金额待确认。'}</div>`,`<button class="n-btn" data-action="save-upload-draft">${teacher?'暂存草稿':'先存本地草稿'}</button><button class="n-btn primary" data-action="submit-upload">${teacher?'保存到我的教学空间':'提交投稿审核'} →</button>`)}
function assign(resourceId=null){S.taskResource=resourceId;const selected=resources.find(r=>r.id===resourceId);modal('布置班级任务',`<p class="n-sub">学生接收同一份任务；只下发教学内容，教案备注和答案保留在教师端。</p><label class="n-formlabel" for="hn-task-title">任务名称</label><input id="hn-task-title" placeholder="例如：完成浮力练习并订正" value="${selected?esc(selected.title)+' · 学习任务':''}"><div class="n-row"><label class="n-field" style="margin-top:14px">使用环节<select id="hn-task-stage"><option>课前</option><option>课中</option><option selected>课后</option></select></label><label class="n-field" style="margin-top:14px">班级<select id="hn-task-class"><option>八年级 2 班</option></select></label></div><label class="n-formlabel" for="hn-task-desc">要求与提交方式</label><textarea id="hn-task-desc" placeholder="可线下完成，拍照、录音或上传文件；不强制创作。">${selected?'先查看老师选用的资源，完成练习后拍照提交；愿意分享的同学可以另外上传自己的讲解。':''}</textarea><div class="n-note" style="margin-top:12px">${selected?'已关联：'+esc(selected.title)+' · 固定版本 v'+selected.version:'本次不关联教学资源。可在资源详情中选择“用于班级任务”。'}</div>`,`<button class="n-btn primary" data-action="publish-task">发布任务 →</button>`)}
function openTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;S.openTaskId=id;const r=t.resourceSnapshot||resources.find(r=>r.id===t.resource);if(S.role==='teacher'){modal(t.title,`<span class="n-badge violet" style="margin-top:12px">${t.stage} · 八年级 2 班</span><p class="n-sub">${esc(t.desc)}</p><div class="n-note" style="margin-top:15px">${r?'关联资源：'+esc(r.title)+' · v'+(t.resourceVersion||r.version):'无关联资源'}<br>林同学：${t.submitted?'已提交':'待完成'}</div><label class="n-formlabel" for="hn-task-feedback">给学生一条具体反馈</label><textarea id="hn-task-feedback">${esc(t.feedback||'')}</textarea>`,`<button class="n-btn primary" data-action="send-task-feedback">保存并发送反馈</button>`)}else{modal(t.title,`<span class="n-badge violet" style="margin-top:12px">${t.stage} · ${t.subject}</span><p class="n-sub">${esc(t.desc)}</p>${r?`<div class="n-note" style="margin-top:14px"><b>老师选用的学习材料</b><br>${esc(r.title)} · v${t.resourceVersion||r.version}<br>可在教学资源广场浏览学习内容。${r.type==='互动课件'?'<div style="margin-top:12px">'+sim('task')+'</div>':''}</div>`:''}<label class="n-formlabel" for="hn-task-file">提交作业文件</label><input id="hn-task-file" type="file" accept="image/*,audio/*,video/*,.pdf"><label class="n-formlabel" for="hn-task-answer">补充作答或订正</label><textarea id="hn-task-answer" placeholder="也可以直接写下你的解释……">${esc(t.answer||'')}</textarea>${t.submitted?`<div class="n-note" style="margin-top:13px">老师反馈：${esc(t.feedback||'已收到，等待老师反馈。')}</div>`:''}`,`<button class="n-btn" data-action="task-hint">AI 提示</button><button class="n-btn primary" data-action="submit-task">${t.submitted?'提交订正':'提交作业'}</button>`)} }
function saveStudio(publish=false){syncStudio();let r=resources.find(r=>r.id===S.currentStudioId);if(!r){r={id:'r'+Date.now(),title:S.draftTitle,cover:S.draftTitle,type:S.studioType,subject:'物理',grade:'八年级',book:'人教版',chapter:'浮力',author:'张老师',color:'lavender',art:'atom',format:S.studioType==='互动课件'?'HTML · 可互动':'文档 · 可编辑',tag:'我的创作',use:'课堂演示',used:0,public:false,version:'1.0',desc:S.studioNotes,file:''};resources.unshift(r);S.own.push(r.id);S.currentStudioId=r.id}else{r.title=S.draftTitle;r.cover=S.draftTitle;r.type=S.studioType;r.desc=S.studioNotes}if(publish)r.public=true;persistPlatform();return r}
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML)layer.innerHTML='';if(e.key==='Enter'&&e.target.id==='hn-search'){S.q=e.target.value.trim();render()}});
root.addEventListener('input',e=>{if(e.target.dataset.sim){const k=e.target.dataset.sim,v=Number(e.target.value);root.querySelector(`[data-force="${k}"]`).innerHTML=(v*.01).toFixed(1)+' <span style="font-size:15px">N</span>';root.querySelector(`[data-volume="${k}"]`).textContent=v+' cm³'}if(e.target.id==='hn-search')S.q=e.target.value});
root.addEventListener('change',e=>{if(e.target.id==='hn-reviewer'){S.reviewer=e.target.value;render();return}if(e.target.dataset.studentVisible){const r=resources.find(r=>r.id===e.target.dataset.studentVisible);if(r){r.studentVisible=e.target.checked;r.studentDescription='学习资源：'+r.title+'。'+(r.type==='互动课件'?'观察示例并尝试解释变化。':'阅读老师选择的材料，完成自己的思考。');persistPlatform();toast(e.target.checked?'已开放学习版，教师私有资料不下发':'已关闭学生学习版')}return}if(e.target.dataset.filter){S[e.target.dataset.filter]=e.target.value;render()}if(e.target.id==='hn-file'){S.uploadFile=e.target.files?.[0]||null;root.querySelector('#hn-filechosen').textContent=S.uploadFile?S.uploadFile.name+' · '+Math.ceil(S.uploadFile.size/1024)+' KB':''}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.role){syncStudio();S.pages[S.role]=S.page;S.role=b.dataset.role;S.page=S.pages[S.role]||'home';layer.innerHTML='';render();remember();return}if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.kind){S.kind=b.dataset.kind;render();return}if(b.dataset.space){S.space=b.dataset.space;render();return}if(b.dataset.studentfilter){S.studentFilter=b.dataset.studentfilter;render();return}if(b.dataset.studiotype){syncStudio();S.studioType=b.dataset.studiotype;render();return}if(b.dataset.resource){if(S.role==='teacher')detail(b.dataset.resource);return}if(b.dataset.task){openTask(b.dataset.task);return}if(b.dataset.work){const w=works.find(w=>w.id===b.dataset.work);if(!w)return;modal(w.title,`<p class="n-sub">${esc(w.author)} · ${w.type} · ${w.subject}</p><div style="margin-top:16px;border-radius:12px;overflow:hidden">${cover(w)}</div><p class="n-sub">${esc(w.desc)}</p><div class="n-note" style="margin-top:12px">展示学生选定的作品，不公开原始私人作业、AI对话或教师私密批注。${w.file?'<br>本次上传文件：'+esc(w.file):''}</div>`,`<button class="n-btn" data-action="collect-work">收藏学习</button><button class="n-btn primary" data-action="upload">我也来分享 →</button>`);return}if(b.dataset.resubmit){const w=works.find(w=>w.id===b.dataset.resubmit);upload(w);return}if(b.dataset.review){if(S.role!=='teacher')return;const w=works.find(w=>w.id===b.dataset.review);if(!w||w.status!=='pending'||!mayReview(w)){toast('当前身份没有这份作品的审核权限');return}w.reviewedBy=reviewerIdentity().name;if(b.dataset.decision==='approve'){w.status='approved';w.tag='本班教师审核通过';w.review='内容已通过本班老师审核，可以展示。'}else{w.status='returned';w.review='请补充本人的关键解释后再次提交。'}render();toast(w.status==='approved'?'审核通过：学生下次进入平板时按既有奖励规则结算':'已退回，未发布');return}
const a=b.dataset.action;if(!a)return;syncStudio();
if(a==='close'){layer.innerHTML='';return}if(a==='new-resource'){S.currentStudioId=null;S.generated=false;S.draftTitle='我的新教学作品';go('studio');return}if(a==='upload'){upload();return}if(a==='search'){render();return}if(a==='clear-filter'){S.q='';S.kind='全部资源';S.subject='全部学科';S.grade='全部年级';S.book='全部版本';S.chapter='全部章节';render();return}
if(a==='generate'){if(!S.prompt.trim()){toast('先描述一下教学目标');return}S.generated=true;render();toast('示例预览已更新，可拖动参数并修改教学说明');return}
if(a==='save-studio'){saveStudio();toast('作品已保存，可在“我的教学空间”查看');return}
if(a==='publish-studio'){const r=saveStudio(true);go('discover');toast('演示：已发布到教学资源广场，可开放学习版供学生浏览');return}
if(a==='collect'){if(S.role!=='teacher')return;if(!S.collections.includes(S.detail))S.collections.push(S.detail);persistPlatform();toast('已收藏原作，可在教学空间查看');return}
if(a==='copy'){if(S.role!=='teacher')return;const r=resources.find(r=>r.id===S.detail);if(!r)return;const copy={...r,id:'copy'+Date.now(),title:r.title+' · 我的副本',public:false,author:'张老师',origin:r.id,originAuthor:r.author,originVersion:r.version,tag:'独立副本',used:0};resources.unshift(copy);S.own.push(copy.id);S.copies.push(copy.id);go('space');toast('已另存独立副本，保留原作者和版本');return}
if(a==='edit-resource'){const r=resources.find(r=>r.id===S.detail);if(!r||!S.own.includes(r.id))return;S.currentStudioId=r.id;S.draftTitle=r.title;S.studioType=['互动课件','教案文档','练习试卷'].includes(r.type)?r.type:'教案文档';S.studioNotes=r.desc;S.generated=true;go('studio');return}
if(a==='publish-resource'){const r=resources.find(r=>r.id===S.detail);if(!r||!S.own.includes(r.id))return;r.public=true;go('discover');toast('演示：资源已发布到教学资源广场');return}if(a==='use-resource'){assign(S.detail);return}if(a==='assign'){if(S.role==='teacher')assign();return}
if(a==='publish-task'){const title=root.querySelector('#hn-task-title').value.trim(),desc=root.querySelector('#hn-task-desc').value.trim();if(!title||!desc){toast('请填写任务名称和要求');return}const r=resources.find(r=>r.id===S.taskResource);tasks.unshift({id:'t'+Date.now(),title,subject:r?.subject||'物理',stage:root.querySelector('#hn-task-stage').value,desc,resource:S.taskResource,resourceVersion:r?.version,resourceSnapshot:r?{title:r.title,version:r.version,type:r.type,desc:r.desc}:null,submitted:false,feedback:'',deadline:'本周完成'});go('tasks');toast('演示：已布置，切换学生身份即可看到同一任务');return}
if(a==='send-task-feedback'){const t=tasks.find(t=>t.id===S.openTaskId);const v=root.querySelector('#hn-task-feedback').value.trim();if(!v){toast('请写一条具体反馈');return}t.feedback=v;layer.innerHTML='';toast('演示：反馈已保存，学生和家长摘要可查看');return}
if(a==='submit-task'){const t=tasks.find(t=>t.id===S.openTaskId),answer=root.querySelector('#hn-task-answer').value.trim(),file=root.querySelector('#hn-task-file').files?.[0];if(!answer&&!file){toast('请上传作业，或补充你的作答');return}t.submitted=true;t.answer=answer;t.file=file?.name||'';layer.innerHTML='';render();toast('作业已提交并归档，不会自动发布到广场');return}
if(a==='task-hint'){toast('AI 提示示例：先判断物体处于什么状态，再分析竖直方向的受力。');return}
if(a==='submit-upload'||a==='save-upload-draft'){const title=root.querySelector('#hn-upload-title').value.trim(),type=root.querySelector('#hn-upload-type').value,desc=root.querySelector('#hn-upload-desc').value.trim();if(!title){toast('先给内容写一个名称');return}if(a==='submit-upload'&&!S.uploadFile){toast('请选择要上传的文件');return}if(a==='submit-upload'&&!root.querySelector('#hn-upload-consent').checked){toast('请确认分享权限与来源说明');return}if(S.role==='teacher'){const r={id:'upload'+Date.now(),title,cover:title,type,subject:root.querySelector('#hn-upload-subject').value,grade:root.querySelector('#hn-upload-grade').value,book:root.querySelector('#hn-upload-book').value,chapter:root.querySelector('#hn-upload-chapter').value,author:'张老师',color:'mint',art:'book',format:(S.uploadFile?.name.split('.').pop()||'文件').toUpperCase()+' · 已导入',tag:'我的上传',use:'教学资料',used:0,public:false,version:'1.0',file:S.uploadFile?.name||'待补充文件',desc:desc||'教师上传的教学资源。'};resources.unshift(r);S.own.push(r.id);go('space');toast('资源已存入私人教学空间，未向学生公开')}else{let w=works.find(w=>w.id===S.editWorkId);const data={title,cover:title,type,subject:type==='自定义作品'?'兴趣创作':'物理',grade:'八年级',chapter:type==='自定义作品'?'我的创作':'浮力',author:'林同学',color:'lavender',art:type==='自定义作品'?'blocks':'waves',format:type,file:S.uploadFile?.name||w?.file||'待上传',tag:'自主投稿',status:a==='save-upload-draft'?'draft':'pending',own:true,desc:desc||'我想分享自己的一次尝试和理解。'};if(w)Object.assign(w,data);else works.unshift({id:'w'+Date.now(),...data});go('works');toast(a==='save-upload-draft'?'草稿已暂存本次页面，尚未上传或发布':'投稿已进入审核，切换教师身份可查看')}return}
if(a==='collect-work'){toast('已保存为学习参考，不计为本人作品或掌握记录');return}
if(a==='parent'){modal('家长端联动摘要',`<p class="n-sub">${esc(S.studentProfile.name)} · ${esc(S.studentProfile.className)}</p><div class="n-note">作业提交 ${tasks.filter(t=>t.submitted).length} 项<br>本人已发布作品 ${works.filter(w=>w.studentId===S.studentProfile.studentId&&w.status==='approved').length} 份<br>本次投稿奖励 ${S.ledger.reduce((n,x)=>n+x.amount,0)} 金币</div><p class="n-small" style="margin-top:13px">只演示数据关系，未改现有微信小程序。</p>`);return}

});
const saved=window.openai?.widgetState?.modelContent;if(saved&&['teacher','student'].includes(saved.role)){S.role=saved.role;S.page=saved.page||'home'}render();
if(globalThis.Tweak){const d={accent:'#6b5ce7'};const t=new Tweak({container:root,onChange:()=>root.style.setProperty('--n-accent',d.accent)});t.addColorPicker(d,'accent',{label:'品牌主色',reference:'--n-accent'})}
})();
</script>
</div>
