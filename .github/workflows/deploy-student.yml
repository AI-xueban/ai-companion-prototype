name: Deploy AI Companion to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install student dependencies
        run: npm --prefix apps/student install

      - name: Install admin dependencies
        run: npm --prefix apps/admin install

      - name: Build student prototype
        run: npm --prefix apps/student run build -- --base=/ai-companion-prototype/
        env:
          VITE_ENABLE_DEMO_CONTROLS: "true"

      - name: Build admin prototype
        run: npm --prefix apps/admin run build -- --base=/ai-companion-prototype/admin/

      - name: Build cabinet prototype
        run: npm --prefix apps/cabinet run build

      - name: Combine websites
        run: |
          mkdir -p apps/student/dist/admin
          cp -R apps/admin/dist/. apps/student/dist/admin/
          mkdir -p apps/student/dist/cabinet
          cp apps/cabinet/index.html apps/cabinet/styles.css apps/cabinet/app.js apps/student/dist/cabinet/
          cp -R apps/cabinet/assets apps/student/dist/cabinet/assets

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/student/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
