name: Deploy student prototype to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install student dependencies
        run: npm --prefix apps/student install

      - name: Build student prototype
        run: npm --prefix apps/student run build -- --base=/ai-companion-prototype/
        env:
          VITE_ENABLE_DEMO_CONTROLS: "true"

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/student/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
