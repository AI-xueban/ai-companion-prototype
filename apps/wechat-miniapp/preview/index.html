    function teacherPhoneLogin(){const field=teacherLoginMode==='sms'?`<span class="teacher-field-label">短信验证码</span><div class="teacher-auth-code"><input id="teacher-code" class="teacher-field-input" inputmode="numeric" maxlength="6" placeholder="请输入验证码" oninput="clearTeacherError()"><button id="teacher-send-code" class="teacher-send-code" type="button" onclick="sendTeacherCode()">获取验证码</button></div><p class="teacher-demo-credential">演示验证码：123456</p>`:`<div class="teacher-password-wrap"><label for="teacher-password" class="teacher-field-label">登录密码</label><input id="teacher-password" class="teacher-field-input" type="password" placeholder="请输入登录密码" oninput="clearTeacherError()"><button type="button" class="teacher-password-toggle" aria-controls="teacher-password" aria-label="显示密码" aria-pressed="false" onclick="toggleTeacherPassword(this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 21 21 3"/></svg></button></div><p class="teacher-demo-credential">演示密码：123456</p>`;const hint=teacherPhoneFromWechat&&teacherLoginMode==='sms'?'已填入微信绑定的手机号，请获取短信验证码。':'使用教师账号的手机号登录。';app.innerHTML=`<main class="screen teacher-screen">${header('教师登录',true,true)}<section class="teacher-main"><div class="teacher-hero"><img class="teacher-art" src="assets/teacher-login-illustration.png" alt=""><div class="teacher-mark">师</div><h1>验证教师账号</h1><p>${hint}</p></div><div class="teacher-auth-card"><div class="teacher-auth-modes"><button class="teacher-auth-mode ${teacherLoginMode==='sms'?'active':''}" onclick="switchTeacherLoginMode('sms')">短信验证码</button><button class="teacher-auth-mode ${teacherLoginMode==='password'?'active':''}" onclick="switchTeacherLoginMode('password')">账号密码</button></div><label><span class="teacher-field-label">登录手机号</span><input id="teacher-phone" class="teacher-field-input" inputmode="numeric" maxlength="11" value="${teacherPhoneDraft}" placeholder="请输入     function showTeacherModule(name){alert(`${name}页面待接入。`)}    function go(next){if(['auth','code','confirm','pending','approved'].includes(next))next='parent';stage=next;history.replaceState(null,'',location.pathname+(params.get('review')==='1'?'?review=1&page=':'?page=')+next);({home,parent:parentPrototype.render,teacherLaunch,teacherLogin,teacherPhone:teacherPhoneLogin,teacherBind,teacherDeviceConfirm,teacherDeviceKicked,teacherDesk,teacherSecurity}[next]||home)()}

    function setExpiredDemoTeacherSession(){localStorage.setItem(teacherDemoSessionKey,JSON.stringify({userId:'teacher-demo-001',expiresAt:Date.now()-1000}))}
    const teacherFlowSteps={first:['验证教师账号与手机号','确认微信绑定','教师工作台'],returning:['打开小程序','确认登录状态','教师工作台'],otherDevice:['新设备打开小程序','发现原设备已有登录','确认继续登录','新设备进入，原设备退出','原设备看到下线提示'],expired:['打开小程序','登录状态已过期','尝试用微信恢复登录','进入工作台或重新登录'],replace:['验证教师账号','验证并确认换绑','教师工作台']};
    const teacherFlowTitles={first:'首次登录并绑定微信',returning:'有效会话再次进入',otherDevice:'同一微信在另一设备登录',expired:'token 过期后恢复',replace:'同账号更换微信'};
    let teacherScenario='';
    function teacherReviewProgress(){return {steps:teacherFlowSteps[teacherFlow]||[],current:teacherFlowStep}}
    const teacherBranchMessages={accountMissing:'未找到该手机号对应的教师账号',codeExpired:'验证码错误或已过期',passwordWrong:'账号或密码错误',network:'网络异常，请稍后重试',recoverFail:'当前微信无法恢复登录，请使用教师账号登录',accountDisabled:'教师账号不可用，请联系学校管理员',conflict:'当前微信已绑定其他教师账号，不能直接绑定',bindFailed:'绑定失败，请稍后重试',secondFactorFailed:'二次验证失败，请检查登录密码',revoked:'账号权限已撤销，无法继续查看教学数据'};
    function teacherLaunch(){const messages=teacherFlow==='returning'?['正在打开小程序','正在确认登录状态','即将进入教师工作台']:['正在打开小程序','正在确认登录状态','正在恢复登录','请稍候'];const error=teacherBranchMessages[teacherBranch];app.innerHTML=`<main class="screen teacher-screen">${header('教师登录',false,true)}<section class="teacher-main"><div class="teacher-launch ${error?'teacher-state-error':''}"><div class="teacher-mark">师</div><h1>${error?'登录遇到问题':messages[teacherFlowStep]}</h1><p>${error||'请稍候，正在确认你的教师账号。'}</p></div></section></main>`;syncReview()}
    function startTeacherFlow(name){if(!teacherFlowSteps[name])return;resetTeacherCodeCountdown();teacherScenario=name;teacherFlow=name;teacherFlowStep=0;teacherBranch='normal';teacherFlowOutcome='';teacherReplacePending=name==='replace';teacherSecurityNotice='';teacherCodeSent=false;teacherPhoneDraft='';teacherPhoneFromWechat=false;teacherFirstSmsVerified=false;teacherOtherDeviceConfirmed=false;teacherOriginalDeviceKicked=false;teacherLoginMode='sms';teacherPhoneSheetOpen=false;teacherQuickNotice='';localStorage.removeItem(teacherDemoSessionKey);localStorage.removeItem(teacherManualLogoutKey);demoTeacherWechatBound=name==='returning'||name==='otherDevice'||name==='expired';if(demoTeacherWechatBound)localStorage.setItem('ai_companion_demo_teacher_wechat_binding','teacher-demo-001');else localStorage.removeItem('ai_companion_demo_teacher_wechat_binding');if(name==='returning')saveDemoTeacherSession();if(name==='expired')setExpiredDemoTeacherSession();go(['returning','otherDevice','expired'].includes(name)?'teacherLaunch':'teacherLogin')}
    function advanceTeacherSystemStep(){if(stage!=='teacherLaunch')return;if(teacherFlow==='otherDevice'){teacherFlowStep++;if(teacherFlowStep>=2)go('teacherDeviceConfirm');else teacherLaunch()}else if(teacherFlow==='returning'){teacherFlowStep++;if(teacherFlowStep>=2){saveDemoTeacherSession();go('teacherDesk')}else teacherLaunch()}else if(teacherFlow==='expired'){if(teacherFlowStep===2&&teacherBranch!=='normal'){teacherFlowOutcome=teacherBranchMessages[teacherBranch];teacherBranch='normal';teacherFlowStep=3;localStorage.removeItem(teacherDemoSessionKey);go('teacherLogin');return}teacherFlowStep++;if(teacherFlowStep>=3){saveDemoTeacherSession();go('teacherDesk')}else teacherLaunch()}}
    function setTeacherBranch(branch){teacherBranch=branch;teacherFlowOutcome='';({teacherLaunch,teacherPhone:teacherPhoneLogin,teacherBind,teacherDesk}[stage]||syncReview)()}
    function currentTeacherBranchOptions(){if(stage==='teacherPhone')return [['normal','正常'],['accountMissing','账号不存在'],[teacherLoginMode==='sms'?'codeExpired':'passwordWrong',teacherLoginMode==='sms'?'验证码过期':'密码错误'],['network','网络异常']];if(stage==='teacherBind')return [['normal','正常'],['conflict','当前微信已绑定其他账号'],['bindFailed','绑定失败'],...(teacherReplacePending?[['secondFactorFailed','二次验证失败']]:[])];if(stage==='teacherLaunch'&&teacherFlow==='expired'&&teacherFlowStep===2)return [['normal','恢复成功'],['recoverFail','恢复失败'],['accountDisabled','账号不可用']];return []}
    let pendingLogoutAction=null;
    function showLogoutConfirm(onConfirm){if(document.querySelector('.logout-confirm-shade'))return;pendingLogoutAction=onConfirm;const screen=app.querySelector('.screen');if(!screen)return;screen.insertAdjacentHTML('beforeend','<div class="logout-confirm-shade" onclick="cancelLogoutConfirm(event)"><section class="logout-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="logout-confirm-title" onclick="event.stopPropagation()"><h2 id="logout-confirm-title">确认退出登录？</h2><p>退出后需要重新登录。</p><div class="logout-confirm-actions"><button type="button" onclick="cancelLogoutConfirm()">取消</button><button type="button" class="logout-confirm-accept" onclick="confirmLogoutAction()">退出登录</button></div></section></div>');screen.querySelector('.logout-confirm-actions button')?.focus()}
    function cancelLogoutConfirm(event){if(event&&event.target!==event.currentTarget)return;document.querySelector('.logout-confirm-shade')?.remove();pendingLogoutAction=null}
    function confirmLogoutAction(){const action=pendingLogoutAction;pendingLogoutAction=null;document.querySelector('.logout-confirm-shade')?.remove();action?.()}
    function logoutTeacher(){showLogoutConfirm(()=>{localStorage.removeItem(teacherDemoSessionKey);localStorage.setItem(teacherManualLogoutKey,'1');teacherFirstSmsVerified=false;teacherPhoneFromWechat=false;go('teacherLogin')})}
    function restoreDemoTeacherOnLaunch(){if(stage!=='home')return;if(localStorage.getItem(teacherManualLogoutKey)==='1'){stage='teacherLogin';history.replaceState(null,'',location.pathname+'?page='+stage);return}let session;try{session=JSON.parse(localStorage.getItem(teacherDemoSessionKey)||'null')}catch{session=null}if(session?.userId==='teacher-demo-001'&&session.expiresAt>Date.now()){stage='teacherDesk'}else if(demoTeacherWechatBound){saveDemoTeacherSession();stage='teacherDesk'}else if(session){localStorage.removeItem(teacherDemoSessionKey);stage='teacherLogin'}if(stage!=='home')history.replaceState(null,'',location.pathname+'?page='+stage)}
    function verify(){const input=document.getElementById('code'),error=document.getElementById('error');enteredCode=input.value.trim();if(!enteredCode){error.textContent='请输入学生编号';return}if(!/^\d{6,20}$/.test(enteredCode)){error.textContent='学生编号应为 6–20 位数字';return}go('confirm')}
    function clearError(){document.getElementById('error').textContent=''}
    function toggleTeacherExceptionMenu(){const menu=document.getElementById('teacher-page-exception-menu');if(menu)menu.hidden=!menu.hidden}
    function injectTeacherExceptionPanel(){if(params.get('review')!=='1'||stage==='parent')return;const screen=app.querySelector('.screen');if(!screen||screen.querySelector('.demo-exception-panel'))return;const options=currentTeacherBranchOptions().filter(([key])=>key!=='normal');if(!options.length)return;const panel=document.createElement('div');panel.className='demo-exception-panel';panel.innerHTML='<button class="demo-exception-trigger" onclick="toggleTeacherExceptionMenu()">异常场景 ▾</button><div class="demo-exception-menu" id="teacher-page-exception-menu" hidden><strong>当前页面异常</strong><button onclick="setTeacherBranch(\'normal\')">恢复正常</button>'+options.map(([key,label])=>'<button onclick="setTeacherBranch(\''+key+'\')">'+label+'</button>').join('')+'</div>';screen.appendChild(panel)}
    function syncReview(){
      const domain=stage==='parent'?'parent':'teacher';
      document.body.classList.toggle('demo-domain-parent',domain==='parent');
      document.body.classList.toggle('demo-domain-teacher',domain==='teacher');
      document.querySelectorAll('[data-demo-domain]').forEach(b=>b.classList.toggle('active',b.dataset.demoDomain===domain));
      document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.classList.toggle('active',b.dataset.teacherFlow===teacherScenario));
      const steps=document.getElementById('teacher-review-steps'),action=document.getElementById('teacher-review-action'),detail=document.getElementById('teacher-review-detail');
      if(!steps||!action||!detail)return;
      const progress=teacherReviewProgress();
      steps.innerHTML=progress.steps.map((label,i)=>'<li class="'+(i===progress.current?'current':i<progress.current?'done':'')+'">'+(i+1)+'. '+label+'</li>').join('');
      action.innerHTML=stage==='teacherLaunch'?'<button class="review-next" onclick="advanceTeacherSystemStep()">'+(teacherFlow==='expired'&&teacherFlowStep===2?'查看恢复结果':'推进系统判断')+' →</button>':teacherScenario==='otherDevice'&&stage==='teacherDesk'?'<button class="review-next" onclick="showTeacherOriginalDevice()">查看原设备的下线提示 →</button>':'';
      const pageName={teacherLaunch:'启动与会话校验',teacherLogin:'快捷登录',teacherPhone:'教师账号登录',teacherBind:'微信绑定',teacherDeviceConfirm:'确认登录',teacherDeviceKicked:'原设备下线提示',teacherDesk:'教师工作台',teacherSecurity:'账号与安全'}[stage]||'身份选择';
      detail.innerHTML=teacherScenario?'<strong>'+teacherFlowTitles[teacherScenario]+'</strong> · '+pageName+(teacherScenario==='otherDevice'?'<br>同一微信登录新设备后，原设备会话失效。':''):'选择一条完整流程，从入口开始。';
      injectTeacherExceptionPanel();
    }
    function toggleDemoConsole(){const open=document.body.classList.toggle('demo-console-open');const button=document.getElementById('demo-console-toggle');button.setAttribute('aria-expanded',String(open));button.querySelector('.demo-console-toggle-label').textContent=open?'收起控制台':'演示控制台'}
    function chooseDemoDomain(domain){if(domain==='parent')startParentScenario('first');else if(domain==='teacher')startTeacherFlow('first')}
    function startParentScenario(name){parentPrototype.scenario(name)}
    function restartTeacherScenario(){startTeacherFlow(teacherScenario||'first')}
    function clearDemoCacheAndRestart(){['ai_companion_demo_parent_v2',teacherDemoSessionKey,teacherManualLogoutKey,'ai_companion_demo_teacher_wechat_binding'].forEach(key=>localStorage.removeItem(key));if(stage==='parent')parentPrototype.restart();else restartTeacherScenario()}
    document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.addEventListener('click',()=>startTeacherFlow(b.dataset.teacherFlow)));if(['auth','code','confirm','pending','approved'].includes(stage))stage='parent';restoreDemoTeacherOnLaunch();if(stage==='teacherLaunch'&&!teacherScenario)startTeacherFlow('first');else ({home,parent:parentPrototype.render,teacherLaunch,teacherLogin,teacherPhone:teacherPhoneLogin,teacherBind,teacherDeviceConfirm,teacherDeviceKicked,teacherDesk,teacherSecurity}[stage]||home)();
  </script>
