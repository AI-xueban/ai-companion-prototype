<body>
  <aside class="review"><h2>家长绑定 · 演示控制</h2><p>用于产品讲解，不属于用户界面。</p><button data-stage="home">首页</button><button data-stage="auth">1. 微信授权</button><button data-stage="code">2. 输入学生编号</button><button data-stage="confirm">3. 确认学生信息</button><button data-stage="pending">4. 等待学校审核</button><button data-stage="approved">5. 审核通过后</button><div class="data">演示数据：林小满 · 罗湖实验学校 · 五年级 2 班<br>学生编号：1001055（演示样例）</div></aside>
  <main class="device"><div id="app" class="app"></div></main>
  <script>
    const student={name:'林小满',initial:'林',school:'罗湖实验学校',className:'五年级 2 班',code:'1001055'};
    const params=new URLSearchParams(location.search);let stage=params.get('page')||'home';let enteredCode=student.code;const app=document.getElementById('app');if(params.get('review')==='1')document.body.classList.add('review-mode');const previous={auth:'home',code:'auth',confirm:'code',pending:'confirm',approved:'pending',teacherLogin:'home',teacherBind:'teacherLogin',teacherDesk:'teacherLogin',teacherSecurity:'teacherDesk'};let teacherCodeSent=false;let teacherLoginMode='sms';let teacherPhoneDraft='';let selectedTeacherClass='五年级 2 班';let demoTeacherWechatBound=localStorage.getItem('ai_companion_demo_teacher_wechat_binding')==='teacher-demo-001';let teacherSecurityNotice='';
    function header(title,back=false,home=false){return `<header class="wx-header${home?' wx-header--home':''}"><div class="wx-status"><span>9:41</span><span class="wx-status-icons"><span class="wx-signal"><i></i><i></i><i></i><i></i></span><span class="wx-wifi"></span><span class="wx-battery"></span></span></div><div class="wx-nav">${back?`<button class="wx-back" onclick="go('${previous[stage]||'home'}')"><i></i><span>返回</span></button>`:'<span></span>'}<h2 class="wx-title">${title}</h2><span class="wx-menu"><span class="wx-dots">•••</span><span class="wx-divider"></span><span class="wx-circle"></span></span></div></header>`}
    function shell(title,desc,content,actions=''){app.innerHTML=`<main class="screen">${header(stage==='teacherLogin'?'教师登录':'绑定学生',true)}<section class="content"><div class="page-heading"><h1>${title}</h1><p>${desc}</p></div>${content}</section>${actions}</main>`;syncReview()}
    function home(){app.innerHTML=`<main class="screen">${header('AI 学伴',false,true)}<section class="home-content"><div class="home-hero"><h1>选择使用身份</h1><p>让每一次陪伴，恰到好处</p></div><button class="role-card role-parent" onclick="go('auth')"><span class="role-line"><span class="role-icon">♟</span><strong class="role-name">我是家长</strong><span class="role-arrow">›</span></span><span class="role-sub">关注进展 · 陪伴成长</span></button><button class="role-card role-teacher" onclick="go('teacherLogin')"><span class="role-line"><span class="role-icon">⌑</span><strong class="role-name">我是老师</strong><span class="role-arrow">›</span></span><span class="role-sub">掌握学情 · 高效教学</span></button><p class="home-footer">选择身份后，即可进入对应服务</p></section></main>`;syncReview()}
    function auth(){shell('微信授权','用于确认当前家长身份。学生学习数据将在绑定申请审核通过后才会展示。',`<span class="group-label">授权说明</span><section class="cells"><div class="cell"><span class="check">✓</span><div class="cell-main"><div class="cell-title">身份确认</div><div class="cell-desc">仅用于登录和家长身份校验</div></div></div><div class="cell"><span class="check">✓</span><div class="cell-main"><div class="cell-title">学生数据保护</div><div class="cell-desc">审核通过前不会读取或展示学习数据</div></div></div></section><p class="note">继续即表示你已阅读并同意《隐私政策》与《家长监护说明》</p>`,`<footer class="bottom-actions"><button class="primary" onclick="go('code')">微信授权登录</button></footer>`)}
    function code(){shell('输入学生编号','学生编号是提交绑定申请的必填凭证，学校、班级和姓名不能单独查找学生。',`<span class="group-label">学生信息</span><section class="cells"><label class="cell"><span class="cell-title">学生编号</span><input id="code" class="form-input" inputmode="numeric" maxlength="20" value="${enteredCode}" placeholder="请输入" oninput="clearError()"></label><div id="error" class="error"></div></section><p class="note">编号校验通过后，仅展示学生的基础身份信息供你确认。</p>`,`<footer class="bottom-actions"><button class="primary" onclick="verify()">下一步</button></footer>`)}
    function confirm(){shell('确认学生信息','请确认学生基础信息。提交后由学校审核，审核通过前无法查看学习数据。',`<span class="group-label">待绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div><div class="cell"><span class="cell-title">学生编号</span><span class="cell-extra">${enteredCode.slice(0,3)}****${enteredCode.slice(-2)}</span></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('pending')">确认并提交申请</button><button class="secondary" onclick="go('code')">返回修改</button></footer>`)}
    function pending(){shell('绑定申请','学校审核通过后，将为当前微信建立与该学生的家长绑定关系。',`<section class="result"><div class="result-icon">✓</div><h1>绑定申请已提交</h1><p>请等待学校审核。审核通过后，<br>你可查看该学生的学习情况。</p></section><span class="group-label">申请信息</span><section class="cells"><div class="cell"><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('home')">完成</button></footer>`)}
    function approved(){shell('孩子学习','当前页面仅在绑定审核通过后展示。',`<span class="group-label">已绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div><span class="arrow">›</span></div></section><span class="group-label">学习情况</span><section class="cells"><div class="cell"><span class="cell-title">今日任务</span><span class="cell-extra">2 项待完成</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">本周学习</span><span class="cell-extra">4.6 小时</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">知识掌握</span><span class="cell-extra">82%</span><span class="arrow">›</span></div></section>`,`<footer class="bottom-actions"><button class="secondary" onclick="go('home')">返回身份选择</button></footer>`)}
    function teacherLogin(){const field=teacherLoginMode==='sms'?`<span class="teacher-field-label">短信验证码</span><div class="teacher-auth-code"><input id="teacher-code" class="teacher-field-input" inputmode="numeric" maxlength="6" placeholder="请输入验证码" oninput="clearTeacherError()"><button class="teacher-send-code" onclick="sendTeacherCode()">获取验证码</button></div>`:`<label><span class="teacher-field-label">登录密码</span><input id="teacher-password" class="teacher-field-input" type="password" placeholder="请输入登录密码" oninput="clearTeacherError()"></label>`;const hint=teacherLoginMode==='sms'?'演示账号 13800138000 · 验证码 123456，不发送短信':'演示账号 13800138000 · 密码 Demo@123456';app.innerHTML=`<main class="screen teacher-screen">${header('教师登录',true,true)}<section class="teacher-main"><div class="teacher-hero"><img class="teacher-art" src="/assets/teacher-login-illustration.png" alt=""><div class="teacher-mark">师</div><h1>教师登录</h1><p>使用教师账号登录，继续查看你的班级与教学工作。</p></div><div class="teacher-auth-card"><div class="teacher-auth-modes"><button class="teacher-auth-mode ${teacherLoginMode==='sms'?'active':''}" onclick="switchTeacherLoginMode('sms')">短信验证码</button><button class="teacher-auth-mode ${teacherLoginMode==='password'?'active':''}" onclick="switchTeacherLoginMode('password')">账号密码</button></div><label><span class="teacher-field-label">登录手机号</span><input id="teacher-phone" class="teacher-field-input" inputmode="numeric" maxlength="11" value="${teacherPhoneDraft}" placeholder="请输入教师账号手机号" oninput="teacherCodeSent=false;clearTeacherError()"></label>${field}<div id="teacher-error" class="teacher-auth-error"></div><div class="teacher-demo">${hint}</div></div><div class="teacher-actions"><button class="teacher-primary" onclick="verifyTeacher()">登录教师账号</button><button class="teacher-wechat-entry" onclick="teacherWechatQuickLogin()">微信一键登录</button></div></section></main>`;syncReview()}
    function switchTeacherLoginMode(mode){if(mode===teacherLoginMode)return;teacherPhoneDraft=(document.getElementById('teacher-phone')?.value||'').replace(/\D/g,'').slice(0,11);teacherLoginMode=mode;teacherCodeSent=false;teacherLogin()}
    function clearTeacherError(){const error=document.getElementById('teacher-error');if(error)error.textContent=''}
    function sendTeacherCode(){const phone=document.getElementById('teacher-phone').value.trim(),error=document.getElementById('teacher-error');if(!/^1\d{10}$/.test(phone)){error.textContent='请输入有效的 11 位手机号';return}if(phone!=='13800138000'){error.textContent='未找到该手机号对应的教师账号';return}teacherCodeSent=true;error.textContent='演示验证码：123456（未发送短信）';error.style.color='#328865'}
    function verifyTeacher(){const phone=document.getElementById('teacher-phone').value.trim(),error=document.getElementById('teacher-error');error.style.color='#fa5151';if(!/^1\d{10}$/.test(phone)){error.textContent='请输入有效的 11 位手机号';return}if(phone!=='13800138000'){error.textContent='未找到该手机号对应的教师账号';return}if(teacherLoginMode==='sms'){if(!teacherCodeSent){error.textContent='请先获取验证码';return}if(document.getElementById('teacher-code').value.trim()!=='123456'){error.textContent='验证码错误或已过期';return}}else if(document.getElementById('teacher-password').value!=='Demo@123456'){error.textContent='账号或密码错误';return}go(demoTeacherWechatBound?'teacherDesk':'teacherBind')}
    function teacherWechatQuickLogin(){const error=document.getElementById('teacher-error');if(!demoTeacherWechatBound){error.textContent='当前微信尚未绑定，请先使用教师账号登录，登录后可绑定微信。';return}go('teacherDesk')}

    function saveHomeworkTask(status){const requirement=document.getElementById('hw-requirement').value.trim(),error=document.getElementById('hw-error');if(!homeworkDraftClasses.size)return error.textContent='请至少选择一个班级';if(!requirement)return error.textContent='请输入作业要求';const subject=document.getElementById('hw-subject').value,method=document.getElementById('hw-method').value,deadline=document.getElementById('hw-deadline').value;if(!deadline)return error.textContent='请选择截止时间';if(status==='active'&&new Date(deadline).getTime()<=Date.now())return error.textContent='截止时间必须晚于当前时间';const classes=[...homeworkDraftClasses],now=new Date(),title=(now.getMonth()+1)+'月'+now.getDate()+'日'+(classes.length>1?'两个班':classes[0])+subject+'任务';const existing=homeworkTasks.find(t=>t.id===window.editingHomeworkId&&t.status==='draft');const attachmentText=document.getElementById('hw-attachment-name').textContent;const task={id:existing?existing.id:Date.now(),startInput:new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16),deadlineInput:deadline,title,subject,classes,requirement,method,deadline:homeworkDateLabel(deadline),status,done:0,total:classes.includes('五年级 2 班')&&classes.includes('五年级 3 班')?82:classes.includes('五年级 2 班')?42:40,attachments:attachmentText.startsWith('已添加：')?attachmentText.slice(4).split('、'):[],fresh:true,allowLate:document.getElementById('hw-create-late').getAttribute('aria-checked')==='true',remindAllDone:document.getElementById('hw-create-reminder').getAttribute('aria-checked')==='true'};if(existing)Object.assign(existing,task);else homeworkTasks.unshift(task);window.editingHomeworkId=null;renderTeacherHomework();controlToast(status==='draft'?'已保存草稿':'作业已发布')}

    function simulateParentPhotos(){document.getElementById('parent-photo-grid').innerHTML='<div class="hw-photo">作业照片 1</div><div class="hw-photo">作业照片 2</div>'}
    function submitParentHomework(id){const t=homeworkTask(id),grid=document.getElementById('parent-photo-grid');if(homeworkSubmissionState(t)!=='todo'){controlToast(t.parentSubmitted?'这份作业已提交':'已超过作业提交时间');return}if(!grid||!grid.children.length){controlToast('请先上传完成材料');return}t.parentSubmitted=true;t.done=Math.min(t.total,t.done+1);closeControlOverlay();parentHomeworkFilter='done';renderParentHomework();controlToast('作业已提交'+(t.remindAllDone&&t.done===t.total?' · 老师将收到全部完成提醒':''))}
    function renderHomeworkDrafts(){const drafts=homeworkTasks.filter(t=>t.status==='draft'),top=header('作业草稿',false).replace('<span></span><h2','<button class="wx-back" aria-label="返回作业首页" onclick="renderTeacherHomework()"><i></i></button><h2');app.innerHTML='<main class="screen hw-screen">'+top+'<section class="hw-content">'+(drafts.length?drafts.map(t=>'<article class="hw-draft-card"><button type="button" class="hw-draft-main" onclick="openHomeworkCreator('+t.id+')"><div class="hw-card-head"><h3>'+t.title+'</h3><span class="hw-badge draft">草稿</span></div><p class="hw-meta">'+t.classes.join('、')+' · '+t.subject+' · '+t.method+'<br>计划截止：'+t.deadline+'</p></button><div class="hw-draft-actions"><button type="button" class="hw-draft-delete" onclick="confirmDeleteHomeworkDraft('+t.id+')">删除</button><button type="button" class="hw-draft-edit" onclick="openHomeworkCreator('+t.id+')">继续编辑</button></div></article>').join(''):'<div class="control-empty">暂无作业草稿</div>')+'</section><div id="control-overlay"></div><div id="control-toast" role="status"></div></main>';syncReview()}
    function confirmDeleteHomeworkDraft(id){const draft=homeworkTasks.find(t=>t.id===id&&t.status==='draft');if(!draft)return;controlOverlay('删除草稿？','<p class="control-scope">'+draft.title+'</p><p class="control-confirm-copy">删除后将无法继续编辑这份草稿。</p>','<button class="control-secondary" onclick="closeControlOverlay()">取消</button><button class="control-primary" style="background:#db6065" onclick="deleteHomeworkDraft('+id+')">确认删除</button>')}
    function deleteHomeworkDraft(id){homeworkTasks=homeworkTasks.filter(t=>t.id!==id);renderHomeworkDrafts();controlToast('草稿已删除')}
    function selectTeacherClass(name){selectedTeacherClass=name;teacherDesk()}
    function showTeacherModule(name){alert(`${name}页面待接入；当前仅演示教师登录和工作台入口。`)}    function go(next){stage=next;history.replaceState(null,'',location.pathname+(params.get('review')==='1'?'?review=1&page=':'?page=')+next);({home,auth,code,confirm,pending,approved,teacherLogin,teacherBind,teacherDesk,teacherSecurity}[next]||home)()}
    function verify(){const input=document.getElementById('code'),error=document.getElementById('error');enteredCode=input.value.trim();if(!enteredCode){error.textContent='请输入学生编号';return}if(!/^\d{6,20}$/.test(enteredCode)){error.textContent='学生编号应为 6–20 位数字';return}go('confirm')}function clearError(){document.getElementById('error').textContent=''}function syncReview(){document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',b.dataset.stage===stage))}document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.stage)));({home,auth,code,confirm,pending,approved,teacherLogin,teacherBind,teacherDesk,teacherSecurity}[stage]||home)();
  </script>
</body>
