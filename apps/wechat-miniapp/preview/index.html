<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 学伴 · 家长绑定演示</title>
  <style>
    :root{--green:#07c160;--blue:#576b95;--ink:#171717;--sub:#767676;--line:#e7e7e7;--page:#f7f7f7}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#15254d;color:var(--ink);font:15px/1.48 "HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-synthesis:none}.device{width:390px;height:min(844px,calc(100vh - 40px));max-width:calc(100vw - 32px);overflow:hidden;border-radius:30px;background:var(--page);box-shadow:0 24px 64px rgba(5,15,38,.48),0 0 0 1px rgba(255,255,255,.2)}button,input{font:inherit}.app,.screen{height:100%}.screen{display:flex;flex-direction:column;background:var(--page)}
    /* 所有页面共用同一套小程序系统栏与导航栏。 */
    .wx-header{flex:0 0 auto;background:#fff}.wx-status{height:42px;padding:11px 18px 0 22px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700;letter-spacing:-.2px}.wx-status-icons{display:flex;align-items:center;gap:7px}.wx-signal{display:flex;align-items:flex-end;gap:2px;height:14px}.wx-signal i{display:block;width:3px;background:currentColor;border-radius:1px}.wx-signal i:nth-child(1){height:5px}.wx-signal i:nth-child(2){height:8px}.wx-signal i:nth-child(3){height:11px}.wx-signal i:nth-child(4){height:14px}.wx-wifi{position:relative;width:16px;height:12px;border:2px solid currentColor;border-color:currentColor transparent transparent;border-radius:50%}.wx-wifi:after{content:"";position:absolute;left:4px;top:4px;width:4px;height:4px;border-radius:50%;background:currentColor}.wx-battery{position:relative;width:23px;height:12px;border:1.5px solid currentColor;border-radius:3px}.wx-battery:before{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor}.wx-battery:after{content:"";position:absolute;inset:2px;border-radius:1px;background:currentColor}.wx-nav{height:48px;padding:0 15px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}.wx-back{justify-self:start;display:flex;align-items:center;gap:6px;min-height:44px;padding:0;border:0;background:none;color:var(--ink);font-size:15px;font-weight:500;cursor:pointer}.wx-back i{width:11px;height:11px;border-left:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg)}.wx-title{margin:0;font-size:17px;font-weight:700;line-height:48px}.wx-menu{justify-self:end;display:flex;align-items:center;width:69px;height:31px;padding:0 8px;border:1px solid #e5e5e5;border-radius:17px;background:#fff}.wx-dots{font-size:16px;font-weight:800;letter-spacing:1px;line-height:1}.wx-divider{width:1px;height:15px;margin:0 8px;background:#ededed}.wx-circle{position:relative;width:15px;height:15px;border:2px solid #191919;border-radius:50%}.wx-circle:after{content:"";position:absolute;left:3.5px;top:3.5px;width:4px;height:4px;border-radius:50%;background:#191919}.wx-header--home{background:linear-gradient(180deg,#edf6ff,#fff)}.wx-header--home .wx-nav{border-bottom:0}.wx-header--home .wx-menu{background:rgba(255,255,255,.75)}
    .content{flex:1;min-height:0;overflow:auto}.page-heading{padding:28px 16px 21px;background:#fff}.page-heading h1{margin:0;font-size:23px;font-weight:700;line-height:1.35;letter-spacing:-.5px}.page-heading p{margin:8px 0 0;color:var(--sub);font-size:14px;font-weight:500;line-height:1.68}.group-label{display:block;padding:22px 16px 8px;color:#7d7d7d;font-size:13px;font-weight:500}.cells{background:#fff}.cell{min-height:57px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.cell:last-child{border-bottom:0}.cell-main{min-width:0;flex:1}.cell-title{font-size:16px;font-weight:600}.cell-desc{margin-top:3px;color:#818181;font-size:13px;font-weight:500}.cell-extra{margin-left:12px;color:#7c7c7c;font-size:14px}.arrow{margin-left:11px;color:#bfbfbf;font-size:25px;font-weight:300}.note{margin:0;padding:12px 16px 0;color:#8d8d8d;font-size:12px;font-weight:500;line-height:1.65}.form-input{flex:1;width:100%;height:56px;padding:0;border:0;outline:0;color:var(--ink);text-align:right;font-size:16px;font-weight:600}.form-input::placeholder{color:#b1b1b1}.error{min-height:20px;padding:5px 16px 0;background:#fff;color:#fa5151;font-size:13px}.bottom-actions{flex:0 0 auto;padding:16px 16px 25px;border-top:1px solid #ededed;background:#fff}.primary,.secondary{display:block;width:100%;height:48px;border:0;border-radius:5px;cursor:pointer;font-size:17px;font-weight:700}.primary{background:var(--green);color:#fff}.secondary{margin-top:12px;background:#f2f2f2;color:#303030}.check{margin-right:10px;color:var(--green);font-size:18px;font-weight:700}.student{width:44px;height:44px;margin-right:12px;display:grid;place-items:center;border-radius:50%;background:#e9f3ff;color:#3979bf;font-size:16px;font-weight:700}.result{padding:46px 28px 30px;background:#fff;text-align:center}.result-icon{width:58px;height:58px;margin:0 auto 16px;display:grid;place-items:center;border-radius:50%;background:#e8f8ee;color:var(--green);font-size:30px;font-weight:700}.result h1{margin:0;font-size:20px;font-weight:700}.result p{margin:9px 0 0;color:#818181;font-size:14px;font-weight:500;line-height:1.7}
    .home-content{flex:1;overflow:auto;padding:17px 16px 26px;background:linear-gradient(180deg,#eff7ff 0,#f7f7f7 230px)}.home-hero{padding:16px 4px 27px;text-align:center}.home-hero h1{margin:0;color:#193b70;font-size:25px;font-weight:700;letter-spacing:.3px}.home-hero p{margin:8px 0 0;color:#6080ad;font-size:14px;font-weight:500}.role-card{position:relative;width:100%;min-height:142px;margin:0 0 14px;padding:24px 20px;border:0;border-radius:14px;overflow:hidden;text-align:left;cursor:pointer;box-shadow:0 7px 18px rgba(78,117,167,.1)}.role-card:after{content:"";position:absolute;right:-28px;bottom:-50px;width:165px;height:165px;border-radius:50%;opacity:.7}.role-parent{background:linear-gradient(135deg,#fff 0%,#fff8f8 54%,#ffe9e7 100%)}.role-parent:after{background:radial-gradient(circle at 35% 35%,#fff 0 16%,#ffd2cd 17% 38%,transparent 39%)}.role-teacher{background:linear-gradient(135deg,#fff 0%,#f6fbff 55%,#e3f2ff 100%)}.role-teacher:after{background:radial-gradient(circle at 35% 35%,#fff 0 16%,#cde8ff 17% 38%,transparent 39%)}.role-line{position:relative;z-index:1;display:flex;align-items:center;gap:11px}.role-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:#fff;font-size:20px;font-weight:700}.role-parent .role-icon{background:#ff7d73}.role-teacher .role-icon{background:#579df0}.role-name{color:#183768;font-size:20px;font-weight:700}.role-arrow{font-size:25px;font-weight:300;line-height:1}.role-sub{position:relative;z-index:1;display:block;margin:17px 0 0;color:#5c7cad;font-size:14px;font-weight:500}.role-sub:before{content:"";display:block;width:18px;height:3px;margin-bottom:10px;border-radius:2px;background:currentColor;opacity:.7}.home-footer{margin:14px 0 0;color:#8898ae;text-align:center;font-size:12px;font-weight:500}
    .review{display:none;position:fixed;left:calc(50% + 235px);top:50%;width:248px;transform:translateY(-50%);padding:18px;border:1px solid #375183;border-radius:14px;background:#20335e;color:#edf3ff}.review h2{margin:0;font-size:15px}.review p{margin:8px 0 14px;color:#b8c7e7;font-size:12px;line-height:1.55}.review button{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #49628e;border-radius:8px;background:#2c4273;color:#fff;text-align:left;font:13px inherit;cursor:pointer}.review button.active{border-color:#73e1ac;background:#24634c}.review .data{margin-top:16px;padding-top:14px;border-top:1px solid #385080;color:#b8c7e7;font-size:12px;line-height:1.6}body.review-mode .review{display:block}@media(max-width:760px){body{display:block}.device{width:100%;max-width:none;height:100vh;border-radius:0;box-shadow:none}.review{display:none!important}}
    /* 避免右上角胶囊在窄屏被内部元素挤出。 */
    .wx-menu{display:grid;grid-template-columns:30px 1px 15px;column-gap:5px;width:74px;padding:0 7px;overflow:hidden}.wx-dots{display:flex;align-items:center;width:30px;font-size:0;letter-spacing:0}.wx-dots:before{content:"";width:4px;height:4px;border-radius:50%;background:#191919;box-shadow:9px 0 #191919,18px 0 #191919}.wx-divider{margin:0}.wx-circle{flex:0 0 15px}
  </style>
</head>
<body>
  <aside class="review"><h2>家长绑定 · 演示控制</h2><p>用于产品讲解，不属于用户界面。</p><button data-stage="home">首页</button><button data-stage="auth">1. 微信授权</button><button data-stage="code">2. 输入学生编号</button><button data-stage="confirm">3. 确认学生信息</button><button data-stage="pending">4. 等待学校审核</button><button data-stage="approved">5. 审核通过后</button><div class="data">演示数据：林小满 · 罗湖实验学校 · 五年级 2 班<br>学生编号：1001055（演示样例）</div></aside>
  <main class="device"><div id="app" class="app"></div></main>
  <script>
    const student={name:'林小满',initial:'林',school:'罗湖实验学校',className:'五年级 2 班',code:'1001055'};
    const params=new URLSearchParams(location.search);let stage=params.get('page')||'home';let enteredCode=student.code;const app=document.getElementById('app');if(params.get('review')==='1')document.body.classList.add('review-mode');const previous={auth:'home',code:'auth',confirm:'code',pending:'confirm',approved:'pending'};
    function header(title,back=false,home=false){return `<header class="wx-header${home?' wx-header--home':''}"><div class="wx-status"><span>9:41</span><span class="wx-status-icons"><span class="wx-signal"><i></i><i></i><i></i><i></i></span><span class="wx-wifi"></span><span class="wx-battery"></span></span></div><div class="wx-nav">${back?`<button class="wx-back" onclick="go('${previous[stage]||'home'}')"><i></i><span>返回</span></button>`:'<span></span>'}<h2 class="wx-title">${title}</h2><span class="wx-menu"><span class="wx-dots">•••</span><span class="wx-divider"></span><span class="wx-circle"></span></span></div></header>`}
    function shell(title,desc,content,actions=''){app.innerHTML=`<main class="screen">${header('绑定学生',true)}<section class="content"><div class="page-heading"><h1>${title}</h1><p>${desc}</p></div>${content}</section>${actions}</main>`;syncReview()}
    function home(){app.innerHTML=`<main class="screen">${header('AI 学伴',false,true)}<section class="home-content"><div class="home-hero"><h1>选择使用身份</h1><p>让每一次陪伴，恰到好处</p></div><button class="role-card role-parent" onclick="go('auth')"><span class="role-line"><span class="role-icon">♟</span><strong class="role-name">我是家长</strong><span class="role-arrow">›</span></span><span class="role-sub">关注进展 · 陪伴成长</span></button><button class="role-card role-teacher" onclick="alert('教师端流程待配置')"><span class="role-line"><span class="role-icon">⌑</span><strong class="role-name">我是老师</strong><span class="role-arrow">›</span></span><span class="role-sub">掌握学情 · 高效教学</span></button><p class="home-footer">选择身份后，即可进入对应服务</p></section></main>`;syncReview()}
    function auth(){shell('微信授权','用于确认当前家长身份。学生学习数据将在绑定申请审核通过后才会展示。',`<span class="group-label">授权说明</span><section class="cells"><div class="cell"><span class="check">✓</span><div class="cell-main"><div class="cell-title">身份确认</div><div class="cell-desc">仅用于登录和家长身份校验</div></div></div><div class="cell"><span class="check">✓</span><div class="cell-main"><div class="cell-title">学生数据保护</div><div class="cell-desc">审核通过前不会读取或展示学习数据</div></div></div></section><p class="note">继续即表示你已阅读并同意《隐私政策》与《家长监护说明》</p>`,`<footer class="bottom-actions"><button class="primary" onclick="go('code')">微信授权登录</button></footer>`)}
    function code(){shell('输入学生编号','学生编号是提交绑定申请的必填凭证，学校、班级和姓名不能单独查找学生。',`<span class="group-label">学生信息</span><section class="cells"><label class="cell"><span class="cell-title">学生编号</span><input id="code" class="form-input" inputmode="numeric" maxlength="20" value="${enteredCode}" placeholder="请输入" oninput="clearError()"></label><div id="error" class="error"></div></section><p class="note">编号校验通过后，仅展示学生的基础身份信息供你确认。</p>`,`<footer class="bottom-actions"><button class="primary" onclick="verify()">下一步</button></footer>`)}
    function confirm(){shell('确认学生信息','请确认学生基础信息。提交后由学校审核，审核通过前无法查看学习数据。',`<span class="group-label">待绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div><div class="cell"><span class="cell-title">学生编号</span><span class="cell-extra">${enteredCode.slice(0,3)}****${enteredCode.slice(-2)}</span></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('pending')">确认并提交申请</button><button class="secondary" onclick="go('code')">返回修改</button></footer>`)}
    function pending(){shell('绑定申请','学校审核通过后，将为当前微信建立与该学生的家长绑定关系。',`<section class="result"><div class="result-icon">✓</div><h1>绑定申请已提交</h1><p>请等待学校审核。审核通过后，<br>你可查看该学生的学习情况。</p></section><span class="group-label">申请信息</span><section class="cells"><div class="cell"><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('home')">完成</button></footer>`)}
    function approved(){shell('孩子学习','当前页面仅在绑定审核通过后展示。',`<span class="group-label">已绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div><span class="arrow">›</span></div></section><span class="group-label">学习情况</span><section class="cells"><div class="cell"><span class="cell-title">今日任务</span><span class="cell-extra">2 项待完成</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">本周学习</span><span class="cell-extra">4.6 小时</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">知识掌握</span><span class="cell-extra">82%</span><span class="arrow">›</span></div></section>`,`<footer class="bottom-actions"><button class="secondary" onclick="go('home')">返回身份选择</button></footer>`)}
    function go(next){stage=next;history.replaceState(null,'',location.pathname+(params.get('review')==='1'?'?review=1&page=':'?page=')+next);({home,auth,code,confirm,pending,approved}[next]||home)()}
    function verify(){const input=document.getElementById('code'),error=document.getElementById('error');enteredCode=input.value.trim();if(!enteredCode){error.textContent='请输入学生编号';return}if(!/^\d{6,20}$/.test(enteredCode)){error.textContent='学生编号应为 6–20 位数字';return}go('confirm')}function clearError(){document.getElementById('error').textContent=''}function syncReview(){document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('active',b.dataset.stage===stage))}document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.stage)));({home,auth,code,confirm,pending,approved}[stage]||home)();
  </script>
</body>
</html>
