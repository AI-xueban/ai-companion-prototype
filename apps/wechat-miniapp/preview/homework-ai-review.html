<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 解题 · 交互评审</title><link rel="stylesheet" href="/homework-prototype.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f7;color:#293147;font-family:"Microsoft YaHei",sans-serif}main{display:flex;gap:44px;max-width:1120px;margin:30px auto;align-items:start;padding:0 20px}aside{width:420px;padding-top:16px}h1{font-size:26px;margin:0 0 12px}aside>p{font-size:13px;line-height:1.9;color:#83808e}select{width:100%;font:14px inherit;padding:12px;margin:10px 0;border:1px solid #ded5ea;background:white;border-radius:10px}.review-controls{display:flex;gap:10px;margin:10px 0}aside h2{font-size:17px;margin-top:24px}#notes{font-size:14px;line-height:2;white-space:pre-wrap}#speech{background:#ede9f4;padding:16px;border-radius:12px;font-size:14px;line-height:1.9}.device{width:390px;height:844px;flex:none;background:#fff;border:1px solid #e5dfec;border-radius:32px;overflow:hidden;box-shadow:0 15px 45px #483b5820;display:flex;flex-direction:column}.phone-status{height:36px;flex:none;display:flex;justify-content:space-between;padding:12px 24px 5px;font-size:12px;font-weight:600}.phone-nav{height:43px;padding:4px 17px 10px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}.phone-nav span:first-child{font-size:22px;font-weight:400}.phone-nav span:last-child{font-size:13px;letter-spacing:3px;border:1px solid #eee;border-radius:18px;padding:4px 10px}#surface{flex:1;min-height:0;display:flex;flex-direction:column}.phone-home{height:18px;flex:none;display:grid;place-items:center}.phone-home:after{content:'';width:112px;height:4px;border-radius:4px;background:#1d2030}.review-badge{color:#a58cbf;font-size:11px;margin:12px 0}.tv-root{border-radius:0}body.capture{background:white}body.capture main{margin:0;padding:0;max-width:none}body.capture aside{display:none}body.capture .device{border:0;box-shadow:none;border-radius:0;width:min(390px,100vw);height:min(844px,100dvh)}.tv-button:focus-visible,textarea:focus-visible{outline:2px solid #ad93d3;outline-offset:2px}@media(max-width:800px){main{gap:24px;flex-direction:column;margin:16px auto;align-items:center}aside{width:min(100%,390px)}}
</style><main><div class="device"><div class="phone-status"><span>9:41</span><span>▰ ▰ ▬</span></div><div class="phone-nav"><span role="button" tabindex="0" aria-label="返回原题" onclick="homeworkTutorUI.close()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();homeworkTutorUI.close()}">‹</span><b>AI 解题</b><span>··· ◉</span></div><div id="surface"></div><div class="phone-home"></div></div><aside><div class="review-badge">V0.4 · 评审操作区，非学生端界面</div><h1>AI 解题交互状态</h1><p>同一套界面用于作业入口与本页评审。样例对话、语音和跨端保存为状态演示，不代表模型或平板服务已接入。</p><select aria-label="评审状态" id="scenario"></select><div class="review-controls"><button class="tv-button" id="advance">完成本段播报</button><button class="tv-button" id="new">重新进入</button></div><div class="review-controls"><button class="tv-button" id="cue-correct">试听正确反馈</button><button class="tv-button" id="cue-incorrect">试听错误反馈</button></div><h2 id="stateTitle"></h2><p id="notes"></p><h2>对应语音／问题</h2><div id="speech"></div><p>讲题控制只保留暂停／继续，录音或键盘输入用于打断；不设置重讲、结束、提示、跳过或更多菜单按钮。D03 已确认：追问答完后等学生主动继续，正常作答反馈后自然推进。D04 已确认支持预设／自定义错因，自定义最多10字，空格不计；D05 已确认通过再次打断补充或更正，不撤回或编辑已发送文字。</p></aside></main><script src="/learning-data.js"></script><script src="/homework-tutor.js"></script><script>
const cases={
boardStructured:['结构化板书 · 方案①','已知与所求独立成组，按步骤组织问答与公式；当前步骤轻突出。这个示例不依赖图示。'],boardVisual:['自适应表达 · 图示辅助','同一套页面结构，在已求出每袋8个后补等份图，帮助建立数量关系。不提前显示卖出或剩余的答案；不按年龄固定配图。'],boardText:['自适应表达 · 文字与公式','方程题优先以等式和推导组织板书；不强制配图。学段、题目及学生反馈共同影响正式模型的表示选择，本页只演示确定状态。'],
captionsOff:['讲解文字关闭','输入行最左侧字幕图标仅隐藏语音对应解释，语音及板书继续；问题、作答反馈和小结保留。开关不暂停、重播、发送或丢失草稿。'],captionsQuestion:['关闭后仍显示当前问题','讲解文字关闭时，当前教学问题仍显示在输入区上方，可语音或键盘回答；不让学生失去作答目标。'],
reason:['D04 选择错因','添加错题支持选择预设错因或自定义错因。取消不保存。'],reasonCustom:['D04 自定义错因','自定义最多10字，汉字、数字、字母、标点各计1字，空格不计；输入显示计数。'],reasonSaveFailure:['D04 错因保存失败','保存失败保留自定义错因，不误报已加入；可重试或取消。'],reasonOver:['D04 超过10字','超限保留文本并明确提示，不自动截断、不允许确认保存。'],
asideWaiting:['D03 答疑后等待继续','答疑结束后等待学生主动继续。原来等待作答时，点击继续返回原问题，不跳过，不计为答对。'],asideLecture:['D03 从被打断处衔接','原来讲解中被打断，答疑后点击继续，从对应的完整语义单元衔接，保留已有板书，不整题重讲。'],asideAgain:['D03 连续追问','答疑可再次打断并追问，优先回应最新疑问；最终回到未完成教学目标，不逐层重放答疑。'],
reading:['01 梳理题意','进入后直接1对1，从已知信息和所求开始。红圈／红线指向当前条件，圈内字形不变，不提前展示答案。'],
waiting:['02 提问等待','默认语音输入，可点键盘图标切换；按住说话开始录音，松开后有效识别文字直接发送。固定问题位于回答区上方，板书独立滚动。等待没有自动越过检查点的超时。'],recording:['录音回答中','按住录音时，仅在输入框内显示声浪动效，不显示正在录音、松开发送或轮到你了等状态文案；当前板书与问题保留。松开后有效识别文字直接发送一次。评审声浪为模拟动效，不代表真实音量采集；无有效内容或失败按异常处理。'],typing:['03 学生输入','从默认语音切换到键盘输入；输入期间保留当前板书与问题，不继续写后续答案。'],submitting:['04 已发送回答','每次发送只提交一次，处理中暂不显示重复发送入口。'],correct:['05 答对后反馈','明确答对时播放一次短促上扬音效，反馈区域淡绿底与对勾轻微浮现；边讲边补每袋48÷6＝8。完成反馈后进入下一段并再次提问，不立即结束。'],wrong:['06 答错后引导','明确答错时播放一次柔和提示音，反馈区域浅橙底与叉号轻微浮现；针对个数与袋数混淆，重新指向已有条件，不直接铺出最后答案。'],clarify:['07 表达不清','先澄清指代，不按错误答案处理；没有固定轮次上限。'],scroll:['08 上滑查看旧板书','手动上滑不抢回视口。固定问题和输入区保持可用，回到当前讲解仅定位，不提交或推进。'],draft:['09 当前问题与输入草稿','当前问题在输入区上方直接呈现，一次只问一个明确的问题；必要信息结合板书呈现，不设展开或收起弹窗，输入区与草稿保留原位。'],paused:['10 打断暂停','文字板书和语音同时停止，已呈现内容保留。继续从稳定位置衔接。'],restart:['11 重讲意图确认','只有上下文不能确定范围才弹窗。取消保留板书和输入，保持暂停或等待，不自动恢复。'],corrected:['12 模型自动纠错','根据清晰原题和上下文纠正提取错误，同步纠正相关计算。原信息正确则解释依据，无法确认则停止。'],loading:['准备① 解析题目信息','参照平板端四阶段准备。只保留题目预览与四阶段进程，删除顶部介绍和底部返回按钮；退出使用页面左上角返回。当前阶段突出、完成项打勾、未开始项弱化；无百分比。正式进度依赖真实事件，浏览器自动演示以定时器模拟，不表示已接入模型。'],prepKnowledge:['准备② 定位相关知识点','解析完成，关联本题知识；尚不输出板书、语音或整题方案。'],prepLogic:['准备③ 梳理讲解逻辑','组织分段讲解和互动提问；不提前展示答案。'],prepReady:['准备④ 准备板书与语音','首段板书与语音就绪后直接进入1对1，从已知与所求开始，不等整题生成、不再点击开始。'],prepDemo:['准备进程 · 自动演示','四阶段以950ms间隔模拟，用于评审；正式产品不得用定时器虚报进度或强制用户等待。'],prepNetwork:['准备失败 · 网络异常','保留已完成阶段，失败阶段不打勾；用户主动重试，返回会使旧请求失效。'],prepTimeout:['准备失败 · 超时','等待真实结果期间超时，不进入空白讲解页。用户主动重试或返回。'],prepPaused:['准备期间切到后台','停止准备演示与启动语音；回来保留当前阶段，点击继续准备后衔接，不在后台突然开始讲题。'],unclear:['14 题目不清晰／不完整','不输出讲解或猜测条件。只查看原题／返回，无补题、重拍或绕过检查的重试。'],unsupported:['15 不支持题型','明确提示暂不支持，可查看原题或返回，不扩大为全部主观题不支持。'],unable:['16 无法可靠求解','说明当前题无法可靠讲解，不伪造解答。'],speech:['17 语音失败','输入区上方仅显示语音播放失败和重试；保留板书，输入区不被遮挡，仍可按住说话或切换键盘。重试成功从稳定位置恢复，不自动重试。'],mic:['18 麦克风未授权','不发送空回答。支持重试录音或键盘输入，当前题和板书保留。'],emptyVoice:['19 未识别到内容','不提交空白，允许重试录音或键盘输入。'],asr:['20 识别失败','不把失败音频当作学生答案，也不重复提交。'],network:['21 网络中断','保留本次会话已有内容；用户主动重试或返回，不无限自动重试。'],timeout:['22 生成超时','不虚报完成，允许重试或返回。'],saved:['已加入错题本','主动添加后展示已加入状态，同一来源不重复建卡；本页模拟平板保存成功。'],cancelled:['已取消加入','取消成功恢复可添加状态，同步取消同一孩子、同一来源平板条目，不影响其他来源。'],speechTyping:['语音失败时键盘输入','失败提示只显示语音播放失败和重试，输入区始终可用且不被遮挡。可切换键盘继续表达。'],saveFailure:['23 添加错题失败','展示保存到平板失败；加入状态未变，允许重试，不改原作业判定。'],cancelFailure:['24 取消同步失败','仍保留已加入状态；允许重试，不误报两端已取消，不影响其他来源。'],access:['25 访问权限失效','停止所有输出、隐藏无权题目与板书，仅返回有权访问的作业。'],version:['26 题目版本已变化','停止旧内容，返回最新题目重新开始，不沿用已失效上下文。'],done:['27 本次小结与推荐','保留本次讲题小结，两个推荐问题靠左、每条独占一行。底部仍是语音／键盘输入，不放返回原题或重讲、结束按钮。可直接追问，不保存历史，也不自动发起变式测验。']};
const params=new URLSearchParams(location.search);if(params.has('capture'))document.body.classList.add('capture');
const picker=document.getElementById('scenario');Object.entries(cases).forEach(([value,item])=>picker.add(new Option(item[0],value)));
function openReviewTutor(){homeworkTutorUI.open({review:true,source:{accountId:'review',studentId:'demo-child',taskId:'apple-homework',itemId:'item-1',submissionVersion:1,question:{id:'apple',stem:'水果店把48个苹果平均装进6袋，卖出其中2袋，还剩多少个苹果？',answer:'32个',state:'released'}},label:'数学 · 第1题',images:[]},{render:()=>{document.getElementById('surface').innerHTML=homeworkTutorUI.html();},valid:()=>true,leave:()=>{document.getElementById('surface').innerHTML='<div class="tv-blocked"><h2>已返回原题</h2><p>本次会话已结束，不保存讲题历史。</p><button class="tv-button primary" onclick="window.openReviewTutor()">AI 解题</button></div>';}});}
function select(value){picker.value=value;const info=cases[value];document.getElementById('stateTitle').textContent=info[0];document.getElementById('notes').textContent=info[1];homeworkTutorUI.reviewState(value);speech();}
function speech(){const snap=homeworkTutorUI.inspect();document.getElementById('advance').textContent=snap?.phase==='loading'?'推进当前阶段':'完成本段播报';document.getElementById('speech').textContent=snap?.phase==='waiting'?document.querySelector('.tv-current-question')?.textContent||'':snap?.feedback||snap?.narration||'本状态不继续讲解。';}
document.getElementById('cue-correct').onclick=()=>{select('correct');homeworkTutorUI.previewFeedback('correct');};document.getElementById('cue-incorrect').onclick=()=>{select('wrong');homeworkTutorUI.previewFeedback('incorrect');};picker.onchange=()=>select(picker.value);document.getElementById('advance').onclick=()=>{homeworkTutorUI.next();speech();};document.getElementById('new').onclick=()=>{openReviewTutor();select('prepDemo');};window.addEventListener('tutor-render',speech);openReviewTutor();select(cases[params.get('state')]?params.get('state'):'boardStructured');
</script></html>
