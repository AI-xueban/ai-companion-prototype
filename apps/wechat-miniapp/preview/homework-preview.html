})();

  const evidenceOverlay = result => {

    function confirm(){shell('确认学生信息','请确认学生基础信息。提交后由学校审核，审核通过前无法查看学习数据。',`<span class="group-label">待绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div><div class="cell"><span class="cell-title">学生编号</span><span class="cell-extra">${enteredCode.slice(0,3)}****${enteredCode.slice(-2)}</span></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('pending')">确认并提交申请</button><button class="secondary" onclick="go('code')">返回修改</button></footer>`)}
    function pending(){shell('绑定申请','学校审核通过后，将为当前微信建立与该学生的家长绑定关系。',`<section class="result"><div class="result-icon">✓</div><h1>绑定申请已提交</h1><p>请等待学校审核。审核通过后，<br>你可查看该学生的学习情况。</p></section><span class="group-label">申请信息</span><section class="cells"><div class="cell"><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('home')">完成</button></footer>`)}
    function approved(){shell('孩子学习','当前页面仅在绑定审核通过后展示。',`<span class="group-label">已绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div><span class="arrow">›</span></div></section><span class="group-label">学习情况</span><section class="cells"><div class="cell"><span class="cell-title">今日任务</span><span class="cell-extra">2 项待完成</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">本周学习</span><span class="cell-extra">4.6 小时</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">知识掌握</span><span class="cell-extra">82%</span><span class="arrow">›</span></div></section>`,`<footer class="bottom-actions"><button class="secondary" onclick="go('home')">返回身份选择</button></footer>`)}
    function teacherPhoneLogin(){const field=teacherLoginMode==='sms'?`<span class="teacher-field-label">短信验证码</span><div class="teacher-auth-code"><input id="teacher-code" class="teacher-field-input" inputmode="numeric" maxlength="6" placeholder="请输入验证码" oninput="clearTeacherError()"><button id="teacher-send-code" class="teacher-send-code" type="button" onclick="sendTeacherCode()">获取验证码</button></div><p class="teacher-demo-credential">演示验证码：123456</p>`:`<div class="teacher-password-wrap"><label for="teacher-password" class="teacher-field-label">登录密码</label><input id="teacher-password" class="teacher-field-input" type="password" placeholder="请输入登录密码" oninput="clearTeacherError()"><button type="button" class="teacher-password-toggle" aria-controls="teacher-password" aria-label="显示密码" aria-pressed="false" onclick="toggleTeacherPassword(this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 21 21 3"/></svg></button></div><p class="teacher-demo-credential">演示密码：123456</p>`;const hint=teacherPhoneFromWechat&&teacherLoginMode==='sms'?'已填入微信绑定的手机号，请获取短信验证码。':'使用教师账号的手机号登录。';app.innerHTML=`<main class="screen teacher-screen">${header('教师登录',true,true)}<section class="teacher-main"><div class="teacher-hero"><img class="teacher-art" src="assets/teacher-login-illustration.png" alt=""><div class="teacher-mark">师</div><h1>验证教师账号</h1><p>${hint}</p></div><div class="teacher-auth-card"><div class="teacher-auth-modes"><button class="teacher-auth-mode ${teacherLoginMode==='sms'?'active':''}" onclick="switchTeacherLoginMode('sms')">短信验证码</button><button class="teacher-auth-mode ${teacherLoginMode==='password'?'active':''}" onclick="switchTeacherLoginMode('password')">账号密码</button></div><label><span class="teacher-field-label">登录手机号</span><input id="teacher-phone" class="teacher-field-input" inputmode="numeric" maxlength="11" value="${teacherPhoneDraft}" placeholder="请输入教师账号手机号" oninput="changeTeacherPhone()"></label>${field}<div id="teacher-error" class="teacher-auth-error">${teacherBranchMessages[teacherBranch]||teacherFlowOutcome}</div></div><div class="teacher-actions"><button class="teacher-primary" onclick="verifyTeacher()">${teacherLoginMode==='password'&&teacherFirstSmsRequired()?'验证账号并继续':'验证并登录'}</button>${demoTeacherWechatBound?'<button class="teacher-wechat-entry" onclick="teacherWechatQuickLogin()">使用已绑定微信登录</button>':''}</div></section></main>`;syncReview();updateTeacherCodeButton()}
    function toggleTeacherPassword(button){const input=document.getElementById('teacher-password');if(!input)return;const visible=input.type==='password';input.type=visible?'text':'password';button.setAttribute('aria-label',visible?'隐藏密码':'显示密码');button.setAttribute('aria-pressed',String(visible))}
    function changeTeacherPhone(){teacherCodeSent=false;resetTeacherCodeCountdown();clearTeacherError()}
    function teacherPhoneSheet(){return `<div class='teacher-phone-shade' onclick='denyTeacherPhone()'></div><section class='teacher-phone-sheet' role='dialog' aria-modal='true' aria-label='选择微信绑定手机号'><div class='teacher-phone-app'><span class='teacher-phone-app-mark'>师</span><span>通晤纪AI伴学</span><span class='teacher-phone-info'>i</span></div><h2>使用微信绑定的手机号</h2><p>继续验证教师账号</p><button class='teacher-phone-number' onclick='approveTeacherPhone()'><strong>138****8000</strong><span>微信绑定的手机号</span></button><button class='teacher-phone-deny' onclick='denyTeacherPhone()'>不允许</button><button class='teacher-phone-other' onclick='openTeacherOtherPhone()'>使用其他手机号登录</button></section>`}
    function teacherLogin(){const bound=demoTeacherWechatBound&&!teacherReplacePending;app.innerHTML=`<main class='screen teacher-screen'>${header('教师登录',true,true)}<section class='teacher-main'><div class='teacher-hero teacher-login-hero'><img class='teacher-art' src='assets/teacher-login-illustration.png' alt=''><div class='teacher-mark'>师</div><h1>班级工作台</h1><p>登录后查看学情、处理作业。</p></div><div class='teacher-actions'><button class='teacher-primary' onclick='${bound?'teacherWechatQuickLogin()':'openTeacherPhoneSheet()'}'>微信登录</button><button class='teacher-wechat-entry' onclick='openTeacherPasswordLogin()'>账号密码登录</button>${teacherQuickNotice?`<p class='teacher-auth-error'>${teacherQuickNotice}</p>`:''}</div></section>${teacherPhoneSheetOpen?teacherPhoneSheet():''}</main>`;syncReview()}
    function openTeacherPhoneSheet(){teacherQuickNotice='';teacherPhoneSheetOpen=true;teacherLogin()}
    function denyTeacherPhone(){teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherLogin()}
    function openTeacherOtherPhone(){teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherPhoneFromWechat=false;go('teacherPhone')}
    function openTeacherPasswordLogin(){teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherPhoneFromWechat=false;teacherLoginMode='password';teacherCodeSent=false;go('teacherPhone')}
    function approveTeacherPhone(){teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherPhoneFromWechat=true;teacherPhoneDraft='13800138000';teacherLoginMode='sms';teacherCodeSent=false;go('teacherPhone')}
    function teacherFirstSmsRequired(){return !demoTeacherWechatBound&&!teacherReplacePending&&!teacherFirstSmsVerified}
    function switchTeacherLoginMode(mode){if(mode===teacherLoginMode)return;teacherPhoneDraft=(document.getElementById('teacher-phone')?.value||'').replace(/\D/g,'').slice(0,11);teacherLoginMode=mode;teacherBranch='normal';teacherFlowOutcome='';teacherPhoneLogin();updateTeacherCodeButton()}
    function clearTeacherError(){const error=document.getElementById('teacher-error');if(error)error.textContent=''}
    function sendTeacherCode(){if(teacherCodeRemaining())return;const phone=document.getElementById('teacher-phone').value.trim(),error=document.getElementById('teacher-error');if(!/^1\d{10}$/.test(phone)){error.textContent='请输入有效的 11 位手机号';return}if(teacherBranch==='accountMissing'||phone!=='13800138000'){error.textContent=teacherBranchMessages.accountMissing;syncReview();return}teacherCodeSent=true;startTeacherCodeCountdown();error.textContent='验证码已发送';error.style.color='#328865';syncReview()}
    function verifyTeacher(){const phone=document.getElementById('teacher-phone').value.trim(),error=document.getElementById('teacher-error');error.style.color='#fa5151';if(!/^1\d{10}$/.test(phone)){error.textContent='请输入有效的 11 位手机号';return}if(teacherLoginMode==='sms'&&!teacherCodeSent){error.textContent='请先获取验证码';return}if(teacherBranch!=='normal'){error.textContent=teacherBranchMessages[teacherBranch]||'当前登录失败，请重试';syncReview();return}if(phone!=='13800138000'){error.textContent='未找到该手机号对应的教师账号';return}if(teacherLoginMode==='sms'){if(document.getElementById('teacher-code').value.trim()!=='123456'){error.textContent='验证码错误或已过期';return}teacherFirstSmsVerified=true}else{if(document.getElementById('teacher-password').value!=='123456'){error.textContent='账号或密码错误';return}if(teacherFirstSmsRequired()){teacherPhoneDraft=phone;teacherLoginMode='sms';teacherCodeSent=false;teacherFlowOutcome='首次登录还需短信验证，请获取验证码。';teacherPhoneLogin();return}}teacherFlowOutcome='';if(teacherFlow==='first'||teacherFlow==='replace')teacherFlowStep=1;if(demoTeacherWechatBound){saveDemoTeacherSession();localStorage.removeItem(teacherManualLogoutKey);go('teacherDesk')}else go('teacherBind')}
    function teacherWechatQuickLogin(){const error=document.getElementById('teacher-error');if(!demoTeacherWechatBound){if(error)error.textContent='当前微信尚未绑定，请先验证教师账号。';return}if(teacherFlow==='otherDevice'&&!teacherOtherDeviceConfirmed){teacherFlowStep=2;go('teacherDeviceConfirm');return}saveDemoTeacherSession();localStorage.removeItem(teacherManualLogoutKey);go('teacherDesk')}
    function teacherDeviceConfirm(){app.innerHTML=`<main class="screen teacher-screen">${header('确认登录',false,true)}<section class="teacher-main"><div class="teacher-hero"><div class="teacher-mark">师</div><h1>此账号正在另一设备使用</h1><p>继续登录后，原设备将退出登录。</p></div><div class="teacher-actions"><button class="teacher-primary" onclick="confirmTeacherDeviceLogin()">继续登录</button><button class="teacher-wechat-entry" onclick="cancelTeacherDeviceLogin()">取消</button></div></section></main>`;syncReview()}
    function confirmTeacherDeviceLogin(){if(teacherFlow!=='otherDevice')return;teacherOtherDeviceConfirmed=true;teacherFlowStep=3;saveDemoTeacherSession();go('teacherDesk')}
    function cancelTeacherDeviceLogin(){if(teacherFlow!=='otherDevice')return;teacherOtherDeviceConfirmed=false;localStorage.removeItem(teacherDemoSessionKey);go('teacherLogin')}
    function teacherDeviceKicked(){app.innerHTML=`<main class="screen teacher-screen">${header('登录已退出',false,true)}<section class="teacher-main"><div class="teacher-hero"><div class="teacher-mark">师</div><h1>账号已在另一设备登录</h1><p>本设备已退出登录。重新登录后，另一设备也将退出。</p></div><div class="teacher-actions"><button class="teacher-primary" onclick="retryTeacherAfterKick()">重新登录</button></div></section></main>`;syncReview()}
    function showTeacherOriginalDevice(){if(teacherFlow!=='otherDevice'||stage!=='teacherDesk')return;teacherOriginalDeviceKicked=true;teacherOtherDeviceConfirmed=false;teacherFlowStep=4;go('teacherDeviceKicked')}
    function retryTeacherAfterKick(){teacherOriginalDeviceKicked=false;teacherOtherDeviceConfirmed=false;go('teacherLogin')}
    function teacherBind(){const conflict=teacherBranch==='conflict';const title=conflict?'微信绑定受限':teacherReplacePending?'更换绑定微信':'绑定当前微信';const copy=conflict?'当前微信已绑定其他教师账号。请先由原账号持有人解绑，或联系学校管理员。':teacherReplacePending?'确认后，旧微信将不能再快捷登录此教师账号。':'将教师账号 138****8000 绑定到当前微信？';app.innerHTML=`<main class="screen teacher-screen">${header(title,true,true)}<section class="teacher-main"><div class="teacher-hero teacher-bind-hero"><img class="teacher-art" src="assets/teacher-login-illustration.png" alt=""><div class="teacher-mark">师</div><h1>${title}</h1><p>${conflict?'请先处理当前微信的绑定关系。':teacherReplacePending?'请再次验证教师账号。':'绑定后，下次可用当前微信快捷进入。'}</p></div><div class="teacher-auth-card teacher-bind-card"><div class="teacher-bind-title">教师账号</div><div class="teacher-bind-account">138****8000</div><p class="teacher-bind-copy">${copy}</p>${teacherReplacePending&&!conflict?'<input id="teacher-replace-password" class="teacher-field-input" type="password" placeholder="请输入登录密码完成二次验证">':''}<div id="teacher-bind-error" class="teacher-security-error">${teacherBranchMessages[teacherBranch]||''}</div></div><div class="teacher-actions">${conflict?'':`<button class="teacher-primary" onclick="confirmTeacherBind()">${teacherReplacePending?'验证并确认换绑':'绑定并进入'}</button>`}<button class="teacher-wechat-entry" onclick="cancelTeacherBind()">取消，返回登录</button></div></section></main>`;syncReview()}
    function confirmTeacherBind(){if(teacherBranch==='conflict')return;if(teacherBranch==='bindFailed'||teacherBranch==='secondFactorFailed'){document.getElementById('teacher-bind-error').textContent=teacherBranchMessages[teacherBranch];syncReview();return}if(teacherReplacePending&&document.getElementById('teacher-replace-password').value!=='123456'){document.getElementById('teacher-bind-error').textContent='二次验证失败，请检查登录密码';return}localStorage.setItem('ai_companion_demo_teacher_wechat_binding','teacher-demo-001');demoTeacherWechatBound=true;teacherReplacePending=false;teacherBranch='normal';saveDemoTeacherSession();if(teacherFlow==='first'||teacherFlow==='replace')teacherFlowStep=2;go('teacherDesk')}
    function cancelTeacherBind(){teacherBranch='normal';teacherFlowOutcome='';teacherFirstSmsVerified=false;teacherCodeSent=false;localStorage.removeItem(teacherDemoSessionKey);go('teacherPhone')}
    function teacherSecurity(){app.innerHTML=`<main class="screen teacher-screen">${header('账号与安全',true,true)}<section class="teacher-main"><h1 class="teacher-security-title">账号与安全</h1><div class="teacher-security-card"><div class="teacher-security-row"><span>登录账号</span><span>138****8000</span></div><div class="teacher-security-row"><span>微信绑定状态</span><span>${demoTeacherWechatBound?'已绑定':'未绑定'}</span></div></div>${demoTeacherWechatBound?`<div class="teacher-security-card teacher-security-section"><div class="teacher-security-heading">解绑当前微信</div><p class="teacher-security-copy">解绑后需使用教师账号登录。为确认是你本人操作，请再次输入登录密码。</p><input id="teacher-reauth" class="teacher-field-input" type="password" placeholder="请输入登录密码完成二次验证"><div id="teacher-security-error" class="teacher-security-error"></div><button class="teacher-wechat-entry" onclick="unbindTeacherWechat()">验证并解绑</button></div>`:''}${teacherSecurityNotice?`<p class="teacher-security-copy">${teacherSecurityNotice}</p>`:''}</section></main>`;syncReview()}
    function unbindTeacherWechat(){const error=document.getElementById('teacher-security-error');if(document.getElementById('teacher-reauth').value!=='123456'){error.textContent='二次验证失败，请检查登录密码';return}localStorage.removeItem('ai_companion_demo_teacher_wechat_binding');localStorage.removeItem(teacherDemoSessionKey);demoTeacherWechatBound=false;teacherFirstSmsVerified=false;teacherQuickNotice='已解绑当前微信，请重新登录并绑定微信。';go('teacherLogin')}
    let teacherTab=['learning','homework','mine'].includes(params.get('tab'))?params.get('tab'):'learning';
    function teacherTabBar(){const tabs=[['learning','学情','M4 19V11M10 19V5M16 19v-9M3 21h18'],['homework','作业','M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h5'],['control','管控','M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M9 12l2 2 4-4'],['mine','我的','M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2']];return '<nav class="teacher-tabbar" role="tablist" aria-label="教师端导航">'+tabs.map(([id,label,path])=>`<button role="tab" aria-selected="${teacherTab===id}" aria-controls="teacher-tab-panel" onclick="switchTeacherTab('${id}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg><span>${label}</span></button>`).join('')+'</nav>'}
    function switchTeacherTab(tab){if(tab==='control'){const target=new URL('control-prototype.html',location.href);target.searchParams.set('page','teacherDesk');target.searchParams.set('tab','control');if(params.get('review')==='1')target.searchParams.set('review','1');location.assign(target.href);return}teacherTab=tab;teacherDesk()}
    function startHomeworkPublishDemo(){workbenchPrototype.demoIdentity('subject');teacherTab='homework';go('teacherDesk');homeworkPrototype.compose()}
    function showHomeworkParentDemo(){parentPrototype.scenario('twoChildren');parentPrototype.tab('homework')}
    function showHomeworkTeacherDemo(){workbenchPrototype.demoIdentity('subject');teacherTab='homework';homeworkPrototype.toTeacherListWithoutRefresh();go('teacherDesk')}
    function switchToParentRole(){if(!parentPrototype.hasGuardianAccess())return;parentPrototype.switchRole()}

    function switchToTeacherRole(){if(!canSwitchToTeacherRole())return;teacherTab='learning';let session=null;try{session=JSON.parse(localStorage.getItem(teacherDemoSessionKey)||'null')}catch(_){}if(session?.userId==='teacher-demo-001'&&session.expiresAt>Date.now()&&!localStorage.getItem(teacherManualLogoutKey))go('teacherDesk');else go('teacherLogin')}
    function teacherMine(){
      const granted=workbenchPrototype.getGrantedViews();
      const roleNames={school:'学校管理员',homeroom:'班主任',subject:'任课老师'};
      const duties=[];
      if(granted.includes('homeroom'))duties.push(['班主任班级','七年级(2)班']);

      duties.push(['登录账号','138****8000']);
      app.innerHTML=`<main class="screen">${header('我的',false)}<section class="teacher-desk teacher-mine" id="teacher-tab-panel" role="tabpanel"><div class="teacher-profile-card"><div class="teacher-profile-head"><span class="teacher-profile-avatar" aria-hidden="true">陈</span><div class="teacher-profile-info"><h1 class="teacher-profile-name">陈老师</h1><p class="teacher-profile-meta">罗湖实验学校</p></div>${parentPrototype.hasGuardianAccess()?'<button class="teacher-profile-switch" aria-label="切换到家长端" onclick="switchToParentRole()">切换家长端 ›</button>':''}</div><div class="teacher-profile-roles">${granted.map(role=>`<span class="teacher-profile-role">${roleNames[role]}</span>`).join('')}</div><div class="teacher-profile-details">${duties.map(([label,value])=>`<div class="teacher-profile-detail"><span>${label}</span><strong>${value}</strong></div>`).join('')}</div></div><h2 class="teacher-mine-heading">账号设置</h2><div class="teacher-mine-list"><button class="teacher-mine-item" onclick="go('teacherSecurity')"><span class="teacher-mine-icon" aria-hidden="true">◎</span><span>账号与安全</span><span class="teacher-mine-arrow" aria-hidden="true">›</span></button></div><button class="teacher-mine-logout" onclick="logoutTeacher()">退出登录</button></section>${teacherTabBar()}</main>`;syncReview()}
    function teacherDesk(){if(teacherTab==='learning'){app.innerHTML=`<main class="screen">${header('学情',false)}<section class="teacher-desk" id="teacher-tab-panel" role="tabpanel">${workbenchPrototype.renderLearning()}</section>${teacherTabBar()}</main>`;syncReview();return}if(teacherTab==='mine'){teacherMine();return}if(teacherTab==='homework'){app.innerHTML=`<main class="screen">${header('作业',false)}<section class="teacher-desk" id="teacher-tab-panel" role="tabpanel">${workbenchPrototype.renderHomework()}</section>${teacherTabBar()}</main>`;syncReview();return}if(teacherTab==='control'){app.innerHTML=`<main class="screen">${header('管控',false)}<section class="teacher-desk" id="teacher-tab-panel" role="tabpanel"><div class="teacher-greeting"><h1>${workbenchPrototype.getScope().view==='school'?'学校管控':'班级管控'}</h1><p>${workbenchPrototype.getScope().view==='school'?'查看全校答案开放状态。':'按任教班级查看和设置答案开放状态。'}</p></div><div class="teacher-section">${workbenchPrototype.getScope().view==='school'?'全校':selectedTeacherClass}</div><div class="teacher-modules"><button class="teacher-module" onclick="showTeacherModule('答案管控')"><b>答案管控</b><span>${workbenchPrototype.getScope().view==='school'?'查看各班开放状态':'设置答案开放'}</span></button></div></section>${teacherTabBar()}</main>`;syncReview();return}app.innerHTML=`<main class="screen">${header(teacherTab==='learning'?'学情':teacherTab==='control'?'管控':'我的',false)}<section class="teacher-desk" id="teacher-tab-panel" role="tabpanel"><div class="teacher-greeting"><h1>陈老师，你好</h1><p>罗湖实验学校 · 教职员工</p><button class="teacher-security-link" onclick="go('teacherSecurity')">账号与安全 ›</button><button class="teacher-security-link" onclick="logoutTeacher()">退出登录</button></div>${teacherTab==='mine'?'':`<div class="teacher-section">我的任教班级</div><div class="teacher-classes"><button class="teacher-class ${selectedTeacherClass==='七年级(2)班'?'active':''}" onclick="selectTeacherClass('七年级(2)班')"><span class="teacher-tag">班主任</span><strong>七年级(2)班</strong><small>数学 · 30 名学生</small></button><button class="teacher-class ${selectedTeacherClass==='七年级(4)班'?'active':''}" onclick="selectTeacherClass('七年级(4)班')"><strong>七年级(4)班</strong><small>数学 · 28 名学生</small></button></div><div class="teacher-section">${selectedTeacherClass} · 数学</div>`}<div class="teacher-modules">${(teacherTab==='learning'?[['班级学情','学习概况与趋势'],['学生学情','查看班内学生'],['错题分析','定位共性问题'],['学习时长','查看学习投入']]:teacherTab==='control'?[['答案管控','设置答案开放']]:[]).map(([name,desc])=>`<button class="teacher-module" onclick="showTeacherModule('${name}')"><b>${name}</b><span>${desc}</span></button>`).join('')}</div></section>${teacherTabBar()}</main>`;syncReview()}
    function selectTeacherClass(name){selectedTeacherClass=name;teacherDesk()}
    function showTeacherModule(name){alert(`${name}页面待接入。`)}    function go(next){if(['auth','code','confirm','pending','approved'].includes(next))next='parent';stage=next;history.replaceState(null,'',location.pathname+(params.get('review')==='1'?'?review=1&page=':'?page=')+next);({home,parent:parentPrototype.render,teacherLaunch,teacherLogin,teacherPhone:teacherPhoneLogin,teacherBind,teacherDeviceConfirm,teacherDeviceKicked,teacherDesk,teacherSecurity}[next]||home)()}
    function saveDemoTeacherSession(){localStorage.setItem(teacherDemoSessionKey,JSON.stringify({userId:'teacher-demo-001',expiresAt:Date.now()+30*60*1000}))}
    function setExpiredDemoTeacherSession(){localStorage.setItem(teacherDemoSessionKey,JSON.stringify({userId:'teacher-demo-001',expiresAt:Date.now()-1000}))}
    const teacherFlowSteps={first:['验证教师账号与手机号','确认微信绑定','教师工作台'],returning:['打开小程序','确认登录状态','教师工作台'],otherDevice:['新设备打开小程序','发现原设备已有登录','确认继续登录','新设备进入，原设备退出','原设备看到下线提示'],expired:['打开小程序','登录状态已过期','尝试用微信恢复登录','进入工作台或重新登录'],replace:['验证教师账号','验证并确认换绑','教师工作台']};
    const teacherFlowTitles={first:'首次登录并绑定微信',returning:'有效会话再次进入',otherDevice:'同一微信在另一设备登录',expired:'token 过期后恢复',replace:'同账号更换微信'};
    let teacherScenario='';
    function teacherReviewProgress(){return {steps:teacherFlowSteps[teacherFlow]||[],current:teacherFlowStep}}
    const teacherBranchMessages={accountMissing:'未找到该手机号对应的教师账号',codeExpired:'验证码错误或已过期',passwordWrong:'账号或密码错误',network:'网络异常，请稍后重试',recoverFail:'当前微信无法恢复登录，请使用教师账号登录',accountDisabled:'教师账号不可用，请联系学校管理员',conflict:'当前微信已绑定其他教师账号，不能直接绑定',bindFailed:'绑定失败，请稍后重试',secondFactorFailed:'二次验证失败，请检查登录密码',revoked:'账号权限已撤销，无法继续查看教学数据'};
    function teacherLaunch(){const messages=teacherFlow==='returning'?['正在打开小程序','正在确认登录状态','即将进入教师工作台']:['正在打开小程序','正在确认登录状态','正在恢复登录','请稍候'];const error=teacherBranchMessages[teacherBranch];app.innerHTML=`<main class="screen teacher-screen">${header('教师登录',false,true)}<section class="teacher-main"><div class="teacher-launch ${error?'teacher-state-error':''}"><div class="teacher-mark">师</div><h1>${error?'登录遇到问题':messages[teacherFlowStep]}</h1><p>${error||'请稍候，正在确认你的教师账号。'}</p></div></section></main>`;syncReview()}
    function startTeacherFlow(name){if(!teacherFlowSteps[name])return;resetTeacherCodeCountdown();teacherScenario=name;teacherFlow=name;teacherFlowStep=0;teacherBranch='normal';teacherFlowOutcome='';teacherReplacePending=name==='replace';teacherSecurityNotice='';teacherCodeSent=false;teacherPhoneDraft='';teacherPhoneFromWechat=false;teacherFirstSmsVerified=false;teacherOtherDeviceConfirmed=false;teacherOriginalDeviceKicked=false;teacherLoginMode='sms';teacherPhoneSheetOpen=false;teacherQuickNotice='';localStorage.removeItem(teacherDemoSessionKey);localStorage.removeItem(teacherManualLogoutKey);demoTeacherWechatBound=name==='returning'||name==='otherDevice'||name==='expired';if(demoTeacherWechatBound)localStorage.setItem('ai_companion_demo_teacher_wechat_binding','teacher-demo-001');else localStorage.removeItem('ai_companion_demo_teacher_wechat_binding');if(name==='returning')saveDemoTeacherSession();if(name==='expired')setExpiredDemoTeacherSession();go(['returning','otherDevice','expired'].includes(name)?'teacherLaunch':'teacherLogin')}
    function advanceTeacherSystemStep(){if(stage!=='teacherLaunch')return;if(teacherFlow==='otherDevice'){teacherFlowStep++;if(teacherFlowStep>=2)go('teacherDeviceConfirm');else teacherLaunch()}else if(teacherFlow==='returning'){teacherFlowStep++;if(teacherFlowStep>=2){saveDemoTeacherSession();go('teacherDesk')}else teacherLaunch()}else if(teacherFlow==='expired'){if(teacherFlowStep===2&&teacherBranch!=='normal'){teacherFlowOutcome=teacherBranchMessages[teacherBranch];teacherBranch='normal';teacherFlowStep=3;localStorage.removeItem(teacherDemoSessionKey);go('teacherLogin');return}teacherFlowStep++;if(teacherFlowStep>=3){saveDemoTeacherSession();go('teacherDesk')}else teacherLaunch()}}
    function setTeacherBranch(branch){teacherBranch=branch;teacherFlowOutcome='';({teacherLaunch,teacherPhone:teacherPhoneLogin,teacherBind,teacherDesk}[stage]||syncReview)()}
    function currentTeacherBranchOptions(){if(stage==='teacherPhone')return [['normal','正常'],['accountMissing','账号不存在'],[teacherLoginMode==='sms'?'codeExpired':'passwordWrong',teacherLoginMode==='sms'?'验证码过期':'密码错误'],['network','网络异常']];if(stage==='teacherBind')return [['normal','正常'],['conflict','当前微信已绑定其他账号'],['bindFailed','绑定失败'],...(teacherReplacePending?[['secondFactorFailed','二次验证失败']]:[])];if(stage==='teacherLaunch'&&teacherFlow==='expired'&&teacherFlowStep===2)return [['normal','恢复成功'],['recoverFail','恢复失败'],['accountDisabled','账号不可用']];return []}
    let pendingLogoutAction=null;
    function showLogoutConfirm(onConfirm){if(document.querySelector('.logout-confirm-shade'))return;pendingLogoutAction=onConfirm;const screen=app.querySelector('.screen');if(!screen)return;screen.insertAdjacentHTML('beforeend','<div class="logout-confirm-shade" onclick="cancelLogoutConfirm(event)"><section class="logout-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="logout-confirm-title" onclick="event.stopPropagation()"><h2 id="logout-confirm-title">确认退出登录？</h2><p>退出后需要重新登录。</p><div class="logout-confirm-actions"><button type="button" onclick="cancelLogoutConfirm()">取消</button><button type="button" class="logout-confirm-accept" onclick="confirmLogoutAction()">退出登录</button></div></section></div>');screen.querySelector('.logout-confirm-actions button')?.focus()}
    function cancelLogoutConfirm(event){if(event&&event.target!==event.currentTarget)return;document.querySelector('.logout-confirm-shade')?.remove();pendingLogoutAction=null}
    function confirmLogoutAction(){const action=pendingLogoutAction;pendingLogoutAction=null;document.querySelector('.logout-confirm-shade')?.remove();action?.()}
    function logoutTeacher(){showLogoutConfirm(()=>{localStorage.removeItem(teacherDemoSessionKey);localStorage.setItem(teacherManualLogoutKey,'1');teacherFirstSmsVerified=false;teacherPhoneFromWechat=false;go('teacherLogin')})}
    function restoreDemoTeacherOnLaunch(){if(stage!=='home')return;if(localStorage.getItem(teacherManualLogoutKey)==='1'){stage='teacherLogin';history.replaceState(null,'',location.pathname+'?page='+stage);return}let session;try{session=JSON.parse(localStorage.getItem(teacherDemoSessionKey)||'null')}catch{session=null}if(session?.userId==='teacher-demo-001'&&session.expiresAt>Date.now()){stage='teacherDesk'}else if(demoTeacherWechatBound){saveDemoTeacherSession();stage='teacherDesk'}else if(session){localStorage.removeItem(teacherDemoSessionKey);stage='teacherLogin'}if(stage!=='home')history.replaceState(null,'',location.pathname+'?page='+stage)}
    function verify(){const input=document.getElementById('code'),error=document.getElementById('error');enteredCode=input.value.trim();if(!enteredCode){error.textContent='请输入学生编号';return}if(!/^\d{6,20}$/.test(enteredCode)){error.textContent='学生编号应为 6–20 位数字';return}go('confirm')}
    function clearError(){document.getElementById('error').textContent=''}
    function toggleTeacherExceptionMenu(){const menu=document.getElementById('teacher-page-exception-menu');if(menu)menu.hidden=!menu.hidden}
    function injectTeacherExceptionPanel(){if(params.get('review')!=='1'||stage==='parent')return;const screen=app.querySelector('.screen');if(!screen||screen.querySelector('.demo-exception-panel'))return;const options=currentTeacherBranchOptions().filter(([key])=>key!=='normal');if(!options.length)return;const panel=document.createElement('div');panel.className='demo-exception-panel';panel.innerHTML='<button class="demo-exception-trigger" onclick="toggleTeacherExceptionMenu()">异常场景 ▾</button><div class="demo-exception-menu" id="teacher-page-exception-menu" hidden><strong>当前页面异常</strong><button onclick="setTeacherBranch(\'normal\')">恢复正常</button>'+options.map(([key,label])=>'<button onclick="setTeacherBranch(\''+key+'\')">'+label+'</button>').join('')+'</div>';screen.appendChild(panel)}
    function syncReview(){
      const domain=stage==='parent'?'parent':'teacher';
      document.body.classList.toggle('demo-domain-parent',domain==='parent');
      document.body.classList.toggle('demo-domain-teacher',domain==='teacher');
      document.querySelectorAll('[data-demo-domain]').forEach(b=>b.classList.toggle('active',b.dataset.demoDomain===domain));
      document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.classList.toggle('active',b.dataset.teacherFlow===teacherScenario));
      const steps=document.getElementById('teacher-review-steps'),action=document.getElementById('teacher-review-action'),detail=document.getElementById('teacher-review-detail');
      if(!steps||!action||!detail)return;
      const progress=teacherReviewProgress();
      steps.innerHTML=progress.steps.map((label,i)=>'<li class="'+(i===progress.current?'current':i<progress.current?'done':'')+'">'+(i+1)+'. '+label+'</li>').join('');
      action.innerHTML=stage==='teacherLaunch'?'<button class="review-next" onclick="advanceTeacherSystemStep()">'+(teacherFlow==='expired'&&teacherFlowStep===2?'查看恢复结果':'推进系统判断')+' →</button>':teacherScenario==='otherDevice'&&stage==='teacherDesk'?'<button class="review-next" onclick="showTeacherOriginalDevice()">查看原设备的下线提示 →</button>':'';
      const pageName={teacherLaunch:'启动与会话校验',teacherLogin:'快捷登录',teacherPhone:'教师账号登录',teacherBind:'微信绑定',teacherDeviceConfirm:'确认登录',teacherDeviceKicked:'原设备下线提示',teacherDesk:'教师工作台',teacherSecurity:'账号与安全'}[stage]||'身份选择';
      detail.innerHTML=teacherScenario?'<strong>'+teacherFlowTitles[teacherScenario]+'</strong> · '+pageName+(teacherScenario==='otherDevice'?'<br>同一微信登录新设备后，原设备会话失效。':''):'选择一条完整流程，从入口开始。';
      injectTeacherExceptionPanel();
    }
    function toggleDemoConsole(){const open=document.body.classList.toggle('demo-console-open');const button=document.getElementById('demo-console-toggle');button.setAttribute('aria-expanded',String(open));button.querySelector('.demo-console-toggle-label').textContent=open?'收起控制台':'演示控制台'}
    function chooseDemoDomain(domain){if(domain==='parent')startParentScenario('first');else if(domain==='teacher')startTeacherFlow('first')}
    function startParentScenario(name){parentPrototype.scenario(name)}
    function restartTeacherScenario(){startTeacherFlow(teacherScenario||'first')}
    function clearDemoCacheAndRestart(){['ai_companion_demo_parent_v2',teacherDemoSessionKey,teacherManualLogoutKey,'ai_companion_demo_teacher_wechat_binding'].forEach(key=>localStorage.removeItem(key));if(stage==='parent')parentPrototype.restart();else restartTeacherScenario()}
    document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.addEventListener('click',()=>startTeacherFlow(b.dataset.teacherFlow)));if(['auth','code','confirm','pending','approved'].includes(stage))stage='parent';restoreDemoTeacherOnLaunch();if(stage==='teacherLaunch'&&!teacherScenario)startTeacherFlow('first');else ({home,parent:parentPrototype.render,teacherLaunch,teacherLogin,teacherPhone:teacherPhoneLogin,teacherBind,teacherDeviceConfirm,teacherDeviceKicked,teacherDesk,teacherSecurity}[stage]||home)();
  </script>
