  <script data-offline-source="homework-prototype.js">
/* 教师发布—家长逐项提交—教师统计的浏览器演示。数据只保存在当前浏览器。 */
window.homeworkPrototype = (() => {
  const KEY = 'ai_companion_homework_preview_v1';
  const DRAFT_KEY = 'ai_companion_teacher_homework_preview_draft_v1:';
  const materialUrls = new Map(), materialLoads = new Set();
  let materialDb;
  const openMaterialDb = () => materialDb ||= new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') { reject(new Error('附件存储不可用')); return; }
    const request = indexedDB.open('homework-preview-attachments', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('files');
    request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error);
  });
  const storeMaterialFile = async (id, file) => { const db = await openMaterialDb(); await new Promise((resolve, reject) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(file, id); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error); }); };
  const refreshMaterialView = () => { if (typeof stage === 'undefined') teacherRefresh(); else if (stage === 'parent') parentRefresh(); else if (stage === 'teacherDesk' && typeof teacherTab !== 'undefined' && teacherTab === 'homework') teacherRefresh(); };
  const materialAttachments = value => Array.isArray(value.attachments) && value.attachments.length ? value.attachments : value.photo ? [{ id: `legacy-${value.id || 'draft'}`, type: 'image', name: value.photoName || '题目图片', path: value.photo, size: 0, source: value.photoSource || '' }] : [];
  const restoreMaterialFile = async file => {
    if (materialUrls.has(file.id)) { file.path = materialUrls.get(file.id); file.unavailable = false; return; }
    if (!file.path?.startsWith('blob:') || materialLoads.has(file.id)) return;
    materialLoads.add(file.id);
    try {
      const db = await openMaterialDb();
      const data = await new Promise((resolve, reject) => { const request = db.transaction('files', 'readonly').objectStore('files').get(file.id); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); });
      if (!data) throw new Error('附件已失效');
      file.path = URL.createObjectURL(data); materialUrls.set(file.id, file.path); file.unavailable = false;
    } catch { file.unavailable = true; }
    refreshMaterialView();
  };
  const materialSize = bytes => !bytes ? '' : bytes >= 1024 * 1024 ? `${(bytes / 1024 / 1024).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;
  const renderMaterialAttachments = (value, removable = false) => {
    const files = materialAttachments(value);
    return files.length ? `<div class="hp-attachment-list">${files.map(file => { restoreMaterialFile(file); return `<div class="hp-attachment-row"><button type="button" class="hp-attachment-main" onclick="homeworkPrototype.previewMaterialAttachment('${file.id}')" ${file.unavailable ? 'disabled' : ''}>${file.type === 'image' && !file.unavailable ? `<img src="${escape(file.path)}" alt="${escape(file.name)}">` : `<span class="hp-attachment-icon ${file.type}">${file.type === 'video' ? '▷' : '文档'}</span>`}<span class="hp-attachment-info"><strong>${escape(file.name)}</strong><small>${file.unavailable ? '附件已失效，请重新添加' : `${file.type === 'image' ? '图片' : file.type === 'video' ? '视频' : '文件'}${file.size ? ' · ' + materialSize(file.size) : ''}${file.sessionOnly ? ' · 本次预览可用' : ''}`}</small></span>${removable ? '' : '<b>›</b>'}</button>${removable ? `<button type="button" class="hp-attachment-remove" aria-label="移除附件 ${escape(file.name)}" onclick="homeworkPrototype.removeMaterialAttachment('${file.id}')">×</button>` : ''}</div>`; }).join('')}</div>` : '';
  };
  const renderMaterialPreview = () => !materialPreview ? '' : `<div class="hp-source-mask" onclick="homeworkPrototype.closeMaterialPreview()"><section class="hp-material-preview-sheet" role="dialog" aria-modal="true" aria-label="附件预览" onclick="event.stopPropagation()"><header><strong>${escape(materialPreview.name)}</strong><button type="button" aria-label="关闭附件预览" onclick="homeworkPrototype.closeMaterialPreview()">×</button></header>${materialPreview.type === 'image' ? `<img src="${escape(materialPreview.path)}" alt="${escape(materialPreview.name)}">` : materialPreview.type === 'video' ? `<video src="${escape(materialPreview.path)}" controls playsinline></video>` : `<div class="hp-attachment-document">${escape(materialPreview.name)}<a href="${escape(materialPreview.path)}" ${/\.pdf$/i.test(materialPreview.name) ? 'target="_blank" rel="noopener"' : `download="${escape(materialPreview.name)}"`}>${/\.pdf$/i.test(materialPreview.name) ? '打开文件' : '下载文件'}</a></div>`}</section></div>`;
  const classes = schoolDemoRoster.DEMO_CLASSES.filter(row => row.id === 'c1' || row.id === 'c2');
  const students = schoolDemoRoster.DEMO_STUDENTS.filter(row => classes.some(classRow => classRow.id === row.classId));
  let guardianId = schoolDemoRoster.GUARDIAN_STUDENT_ID;
  const types = { file: '文件', photo: '图片', video: '视频', audio: '录音', none: '线下完成' };
  const publishTypes = ['file', 'photo', 'video', 'none'];
  const accept = { file: '.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt', photo: 'image/*', video: 'video/*', audio: 'audio/*' };
  const fileLimits = {
    file: { bytes: 50 * 1024 * 1024, label: '50MB' },
    photo: { bytes: 20 * 1024 * 1024, label: '20MB' },
    video: { bytes: 200 * 1024 * 1024, seconds: 5 * 60, label: '200MB、5分钟' },

  };
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
  const toDate = value => new Date(String(value || '').replace(' ', 'T'));
  const formatDate = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  const addDays = (value, days) => { const date = toDate(value); date.setDate(date.getDate() + days); return formatDate(date); };
  const currentRows = rows => [...rows].sort((a, b) => (a.version || 1) - (b.version || 1) || (a.submittedAt || '').localeCompare(b.submittedAt || '')).reduce((latest, row) => { latest.set(`${row.taskId}:${row.studentId}:${row.itemId}`, row); return latest; }, new Map()).values();
  const latestRows = rows => [...currentRows(rows)];
  const targetIds = task => task.targetSnapshotIds ? [...task.targetSnapshotIds] : students.filter(student => task.classIds.includes(student.classId) && (!task.targetStudentIds || task.targetStudentIds.includes(student.id))).map(student => student.id);
  const seedQuestions = (task, item, studentId) => {
    if (task.kind !== 'homework' || item.type !== 'photo') return [];

    cardError() { const foreign = state.card === 'foreign'; const invalid = state.card === 'invalid'; const title = foreign ? '无法识别这个二维码' : invalid ? '二维码无法使用' : '暂无法关联孩子'; const detail = foreign ? '这不是通晤纪AI伴学的学生二维码。请扫描学校发给家庭的二维码。' : invalid ? '二维码可能已作废，请联系学校重新获取。' : '这位学生的账号当前无法关联，请联系学校确认。'; return `${hero(title, detail)}${actions(button('重新扫码', 'retryScan'), button('返回', 'cancelScan', 'secondary'))}`; }
  };
  const flowNames = { first: '首位家长绑定', returning: '已绑定家长再次进入', duplicateScan:'已绑定家长重复扫码', twoChildren: '两个孩子的学情与作业', otherDevice: '同一微信在另一设备登录', second: '第二位家长申请', third:'第三位家长申请', fourth:'第四位家长申请', fifth:'第五位家长申请', sixth:'第六位家长申请', seventh:'第七位家长申请（人数已满）', familyManage:'主管理家长管理', ordinary:'普通家长权限', wrong: '解除孩子关联', lostWechat: '原微信丢失后找回', lostPhone: '原手机号丢失后更换', bothLost: '微信和手机号均丢失' };
  const flowSteps = {
    first: ['微信登录（手机号授权可跳过）', '扫描并核对孩子', '绑定手机号（可跳过）', '关联成功并查看学情'],
    duplicateScan: ['已绑定孩子，再次扫码','识别已有绑定，不重复申请','直接进入孩子首页'],
    returning: ['已有孩子关联', '当前微信快捷进入', '查看家长首页'],
    twoChildren: ['两个孩子均已关联', '切换孩子查看学情', '保留当前孩子查看作业'],
    otherDevice: ['新设备发现账号已在另一设备登录', '确认继续登录', '新设备进入，原设备退出', '原设备看到下线提示'],
    second: ['打开邀请卡片', '填写本人信息（手机号可跳过）', '等待主管理家长审核', '主管理家长同意或拒绝', '申请方查看结果'],
    third: ['打开邀请卡片','填写本人信息（手机号可跳过）','等待主管理家长审核','主管理家长同意或拒绝','申请方查看结果'],
    fifth: ['打开邀请卡片','填写本人信息（手机号可跳过）','等待主管理家长审核','主管理家长同意或拒绝','申请方查看结果'],
    sixth: ['打开邀请卡片','填写本人信息（手机号可跳过）','等待主管理家长审核','主管理家长同意或拒绝','申请方查看结果'],
    seventh: ['孩子已绑定 6 位家长','第七位家长无法申请绑定','联系主管理家长释放名额后重试'],
    fourth: ['打开邀请卡片','填写本人信息（手机号可跳过）','等待主管理家长审核','主管理家长同意或拒绝','申请方查看结果'],
    familyManage: ['查看家长名单','审核或邀请家长','解除误绑定或转交身份'],
    ordinary: ['查看家长名单','仅可解除自己的绑定'],
    wrong: ['进入已关联账号', '打开绑定管理', '确认解除关联', '返回未关联状态'],
    lostWechat: ['从新微信发起找回', '验证原手机号', '确认改绑', '查看原孩子关联'],
    lostPhone: ['原微信进入账号', '打开更换手机号', '验证新手机号'],
    bothLost: ['发起找回', '查看无法自助接管提示']
  };
  function reviewStep() {
    const view = state.view, flow = state.flow;
    if (['second','third','fourth','fifth','sixth'].includes(flow)) {
      if (state.request === 'approved' || state.request === 'rejected' || state.request === 'full') return 4;
      if (view === 'needInvite') return 4;
      if (state.actor === 'inviter') return 3;
      return ({ entry: 0, inviteLanding:0, requestForm:1, phone: 1, pending: 2, familyManage:3, inviter:3, capReached: 4 })[view] ?? 0;
    }
    if(flow==='seventh')return view==='capReached'?1:0;
    const maps = {
      familyManage: { familyManage:0, invite:1, shareInvite:1, inviter:1, removeConfirm:2, transfer:2 }, ordinary:{familyManage:0,unbindConfirm:1,entry:1},
      first: { entry: 0, scan: 1, scanning: 1, cardError: 1, confirm: 1, phone: 2, bindSuccess: 3, home: 3 },
      duplicateScan: { scan:0, scanning:0, confirm:1, alreadyBound:1, home:2 },
      returning: { home: 2, entry: 0 }, twoChildren: { home: 1, entry: 0 },
      otherDevice: { entry: 0, deviceConfirm: 1, home: 2, deviceKicked: 3 },
      wrong: { home: 1, manage: 2, unbindConfirm: 2, entry: state.boundStudents.length ? 0 : 3 },
      lostWechat: { entry: 0, phone: 1, newWechat: 2, home: 3 },
      lostPhone: { entry: 0, home: state.verifiedPhone === '13800138000' ? 1 : 2, phone: 2 },
      bothLost: { entry: 0, blocked: 1 }
    };
    return maps[flow]?.[view] ?? 0;
  }
  function syncParentReview() {
    document.querySelectorAll('[data-parent-scenario]').forEach(b => b.classList.toggle('active', b.dataset.parentScenario === state.flow));
    const context = document.getElementById('parent-review-context');
    const steps = document.getElementById('parent-review-steps');
    const actions = document.getElementById('parent-review-actions');
    const detail = document.getElementById('parent-review-detail');
    if (!context || !steps || !actions || !detail) return;
    const count = guardianCount();
    const actor = state.actor === 'inviter' ? '邀请方家长' : ['second','third','fourth','fifth','sixth','seventh'].includes(state.flow) ? '申请方家长' : '当前家长';
    context.innerHTML = `<strong>${esc(flowNames[state.flow])}</strong><br>${actor}${['second','seventh'].includes(state.flow) ? ` · ${esc(student.name)} · 已关联 ${count}/${MAX_GUARDIANS_PER_STUDENT} 位` : ''}`;
    const current = reviewStep();
    steps.innerHTML = (flowSteps[state.flow] || flowSteps.first).map((label, index) => `<li class="${index < current ? 'done' : index === current ? 'current' : ''}">${index + 1}. ${label}</li>`).join('');
    let available = '';
    if (family().application?.status === 'pending' && !isManager()) {
      available += '<button onclick="parentPrototype.familyReview(&quot;manager&quot;)">切换主管理家长审核 →</button>';
    }
    if(isManager() && state.view==='shareInvite') available += '<button onclick="parentPrototype.familyReview(&quot;newRecipient&quot;)">模拟家人打开微信邀请卡片 →</button>';
    if(isManager() && family().application) available += '<button onclick="parentPrototype.familyReview(&quot;recipient&quot;)">切换申请家长查看结果 →</button>';
    if(!isManager() && family().primaryId && family().application?.status!=='pending') available += '<button onclick="parentPrototype.familyReview(&quot;manager&quot;)">切换主管理家长 →</button>';
    if (state.view === 'wechatGuide') available += '<button onclick="parentPrototype.action(\'continueNewWechat\')">模拟从新微信继续换绑 →</button>';
    if (state.flow === 'otherDevice' && state.view === 'home') available += '<button onclick="parentPrototype.action(\'showOriginalDevice\')">查看原设备的下线提示 →</button>';
    actions.innerHTML = available || '<p class="parent-review-hint">请在手机画面继续操作，进度会自动更新。</p>';

    const params=new URLSearchParams(location.search);let stage=params.get('page')||'teacherDesk';let enteredCode=student.code;const app=document.getElementById('app');if(params.get('review')==='1')document.body.classList.add('review-mode');const previous={auth:'home',code:'auth',confirm:'code',pending:'confirm',approved:'pending',teacherLaunch:'home',teacherLogin:'home',teacherPhone:'teacherLogin',teacherBind:'teacherPhone',teacherDesk:'teacherLogin',teacherSecurity:'teacherDesk'};let teacherCodeSent=false;let teacherLoginMode='sms';let teacherPhoneDraft='';let teacherPhoneFromWechat=false;let teacherFirstSmsVerified=false;let teacherOtherDeviceConfirmed=false;let teacherOriginalDeviceKicked=false;let selectedTeacherClass='七年级(2)班';let demoTeacherWechatBound=localStorage.getItem('ai_companion_demo_teacher_wechat_binding')==='teacher-demo-001';let teacherSecurityNotice='';let teacherFlow='';let teacherFlowStep=0;let teacherBranch='normal';let teacherFlowOutcome='';let teacherReplacePending=false;let teacherPhoneSheetOpen=false;let teacherQuickNotice='';const teacherDemoSessionKey='ai_companion_demo_teacher_session';const teacherManualLogoutKey='ai_companion_demo_teacher_manual_logout';
    let teacherCodeCountdownUntil=0;let teacherCodeCountdownTimer=null;
    function teacherCodeRemaining(){return Math.max(0,Math.ceil((teacherCodeCountdownUntil-Date.now())/1000))}
    function updateTeacherCodeButton(){const button=document.getElementById('teacher-send-code');const remaining=teacherCodeRemaining();if(button){button.disabled=remaining>0;button.textContent=remaining>0?`${remaining}s 后重发`:'获取验证码'}if(!remaining&&teacherCodeCountdownTimer){clearInterval(teacherCodeCountdownTimer);teacherCodeCountdownTimer=null}}
    function startTeacherCodeCountdown(){teacherCodeCountdownUntil=Date.now()+60000;updateTeacherCodeButton();if(teacherCodeCountdownTimer)clearInterval(teacherCodeCountdownTimer);teacherCodeCountdownTimer=setInterval(updateTeacherCodeButton,1000)}
    function resetTeacherCodeCountdown(){teacherCodeCountdownUntil=0;if(teacherCodeCountdownTimer)clearInterval(teacherCodeCountdownTimer);teacherCodeCountdownTimer=null;updateTeacherCodeButton()}
    function header(title,back=false,home=false,customBack='',moduleHome='',homeLabel='回到模块首页'){title=String(title).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const backAction=customBack||(stage==='teacherBind'?'cancelTeacherBind()':`go('${previous[stage]||'home'}')`);return `<header class="wx-header${home?' wx-header--home':''}"><div class="wx-status"><span>9:41</span><span class="wx-status-icons"><span class="wx-signal"><i></i><i></i><i></i><i></i></span><span class="wx-wifi"></span><span class="wx-battery"></span></span></div><div class="wx-nav">${back?`<div class="wx-nav-actions"><button class="wx-back" aria-label="返回上一级" onclick="${backAction}"><i></i></button>${moduleHome?`<button class="wx-home" aria-label="${homeLabel}" title="${homeLabel}" onclick="${moduleHome}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9v12h14V9M9 21v-7h6v7"/></svg></button>`:''}</div>`:'<span></span>'}<h2 class="wx-title">${title}</h2><span class="wx-menu"><span class="wx-dots">•••</span><span class="wx-divider"></span><span class="wx-circle"></span></span></div></header>`}
    function shell(title,desc,content,actions=''){app.innerHTML=`<main class="screen">${header(stage==='teacherLogin'?'教师登录':'绑定学生',true)}<section class="content"><div class="page-heading"><h1>${title}</h1><p>${desc}</p></div>${content}</section>${actions}</main>`;syncReview()}
    function home(){app.innerHTML=`<main class="screen">${header('通晤纪AI伴学',false,true)}<section class="home-content"><div class="home-hero"><h1>选择使用身份</h1><p>让每一次陪伴，恰到好处</p></div><button class="role-card role-teacher" onclick="go('teacherLogin')"><span class="role-line"><span class="role-icon">⌑</span><strong class="role-name">我是老师</strong><span class="role-arrow">›</span></span><span class="role-sub">查看班级学情与作业</span></button><button class="role-card role-parent" onclick="parentPrototype.start()"><span class="role-line"><span class="role-icon">♟</span><strong class="role-name">我是家长</strong><span class="role-arrow">›</span></span><span class="role-sub">查看孩子学情与作业</span></button></section></main>`;syncReview()}
    function auth(){shell('微信授权','用于确认当前家长身份。学生学习数据将在绑定申请审核通过后才会展示。',`<span class="group-label">授权说明</span><section class="cells"><div class="cell"><span class="check">✓</span><div class="cell-main"><div class="cell-title">身份确认</div><div class="cell-desc">仅用于登录和家长身份校验</div></div></div><div class="cell"><span class="check">✓</span><div class="cell-main"><div class="cell-title">学生数据保护</div><div class="cell-desc">审核通过前不会读取或展示学习数据</div></div></div></section><p class="note">继续即表示你已阅读并同意《隐私政策》与《家长监护说明》</p>`,`<footer class="bottom-actions"><button class="primary" onclick="go('code')">微信授权登录</button></footer>`)}
    function code(){shell('输入学生编号','学生编号是提交绑定申请的必填凭证，学校、班级和姓名不能单独查找学生。',`<span class="group-label">学生信息</span><section class="cells"><label class="cell"><span class="cell-title">学生编号</span><input id="code" class="form-input" inputmode="numeric" maxlength="20" value="${enteredCode}" placeholder="请输入" oninput="clearError()"></label><div id="error" class="error"></div></section><p class="note">编号校验通过后，仅展示学生的基础身份信息供你确认。</p>`,`<footer class="bottom-actions"><button class="primary" onclick="verify()">下一步</button></footer>`)}
    function confirm(){shell('确认学生信息','请确认学生基础信息。提交后由学校审核，审核通过前无法查看学习数据。',`<span class="group-label">待绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div><div class="cell"><span class="cell-title">学生编号</span><span class="cell-extra">${enteredCode.slice(0,3)}****${enteredCode.slice(-2)}</span></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('pending')">确认并提交申请</button><button class="secondary" onclick="go('code')">返回修改</button></footer>`)}
    function pending(){shell('绑定申请','学校审核通过后，将为当前微信建立与该学生的家长绑定关系。',`<section class="result"><div class="result-icon">✓</div><h1>绑定申请已提交</h1><p>请等待学校审核。审核通过后，<br>你可查看该学生的学习情况。</p></section><span class="group-label">申请信息</span><section class="cells"><div class="cell"><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div></div></section>`,`<footer class="bottom-actions"><button class="primary" onclick="go('home')">完成</button></footer>`)}
    function approved(){shell('孩子学习','当前页面仅在绑定审核通过后展示。',`<span class="group-label">已绑定学生</span><section class="cells"><div class="cell"><span class="student">${student.initial}</span><div class="cell-main"><div class="cell-title">${student.name}</div><div class="cell-desc">${student.school} · ${student.className}</div></div><span class="arrow">›</span></div></section><span class="group-label">学习情况</span><section class="cells"><div class="cell"><span class="cell-title">今日任务</span><span class="cell-extra">2 项待完成</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">本周学习</span><span class="cell-extra">4.6 小时</span><span class="arrow">›</span></div><div class="cell"><span class="cell-title">知识掌握</span><span class="cell-extra">82%</span><span class="arrow">›</span></div></section>`,`<footer class="bottom-actions"><button class="secondary" onclick="go('home')">返回身份选择</button></footer>`)}
    function teacherPhoneLogin(){const field=teacherLoginMode==='sms'?`<span class="teacher-field-label">短信验证码</span><div class="teacher-auth-code"><input id="teacher-code" class="teacher-field-input" inputmode="numeric" maxlength="6" placeholder="请输入验证码" oninput="clearTeacherError()"><button id="teacher-send-code" class="teacher-send-code" type="button" onclick="sendTeacherCode()">获取验证码</button></div><p class="teacher-demo-credential">演示验证码：123456</p>`:`<div class="teacher-password-wrap"><label for="teacher-password" class="teacher-field-label">登录密码</label><input id="teacher-password" class="teacher-field-input" type="password" placeholder="请输入登录密码" oninput="clearTeacherError()"><button type="button" class="teacher-password-toggle" aria-controls="teacher-password" aria-label="显示密码" aria-pressed="false" onclick="toggleTeacherPassword(this)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 21 21 3"/></svg></button></div><p class="teacher-demo-credential">演示密码：123456</p>`;const hint=teacherPhoneFromWechat&&teacherLoginMode==='sms'?'已填入微信绑定的手机号，请获取短信验证码。':'使用教师账号的手机号登录。';app.innerHTML=`<main class="screen teacher-screen">${header('教师登录',true,true)}<section class="teacher-main"><div class="teacher-hero"><img class="teacher-art" src="assets/teacher-login-illustration.png" alt=""><div class="teacher-mark">师</div><h1>验证教师账号</h1><p>${hint}</p></div><div class="teacher-auth-card"><div class="teacher-auth-modes"><button class="teacher-auth-mode ${teacherLoginMode==='sms'?'active':''}" onclick="switchTeacherLoginMode('sms')">短信验证码</button><button class="teacher-auth-mode ${teacherLoginMode==='password'?'active':''}" onclick="switchTeacherLoginMode('password')">账号密码</button></div><label><span class="teacher-field-label">登录手机号</span><input id="teacher-phone" class="teacher-field-input" inputmode="numeric" maxlength="11" value="${teacherPhoneDraft}" placeholder="请输入教师账号手机号" oninput="changeTeacherPhone()"></label>${field}<div id="teacher-error" class="teacher-auth-error">${teacherBranchMessages[teacherBranch]||teacherFlowOutcome}</div></div><div class="teacher-actions"><button class="teacher-primary" onclick="verifyTeacher()">${teacherLoginMode==='password'&&teacherFirstSmsRequired()?'验证账号并继续':'验证并登录'}</button>${demoTeacherWechatBound?'<button class="teacher-wechat-entry" onclick="teacherWechatQuickLogin()">使用已绑定微信登录</button>':''}${teacherAgreementRow()}</div></section></main>`;syncReview();updateTeacherCodeButton()}
    function toggleTeacherPassword(button){const input=document.getElementById('teacher-password');if(!input)return;const visible=input.type==='password';input.type=visible?'text':'password';button.setAttribute('aria-label',visible?'隐藏密码':'显示密码');button.setAttribute('aria-pressed',String(visible))}
    function changeTeacherPhone(){teacherCodeSent=false;resetTeacherCodeCountdown();clearTeacherError()}
    function teacherPhoneSheet(){return `<div class='teacher-phone-shade' onclick='denyTeacherPhone()'></div><section class='teacher-phone-sheet' role='dialog' aria-modal='true' aria-label='选择微信绑定手机号'><div class='teacher-phone-app'><span class='teacher-phone-app-mark'>师</span><span>通晤纪AI伴学</span><span class='teacher-phone-info'>i</span></div><h2>使用微信绑定的手机号</h2><p>继续验证教师账号</p><button class='teacher-phone-number' onclick='approveTeacherPhone()'><strong>138****8000</strong><span>微信绑定的手机号</span></button><button class='teacher-phone-deny' onclick='denyTeacherPhone()'>不允许</button><button class='teacher-phone-other' onclick='openTeacherOtherPhone()'>使用其他手机号登录</button></section>`}

    let teacherAgreementAccepted=false;
    const teacherAgreements={"service":{"title":"用户协议","sections":["协议内容示意","本页用于演示协议阅读交互，正式协议正文待接入。","账号与权限","请使用学校分配的教师账号登录，按任教范围处理班级任务，并妥善保管账号。","服务使用","可在已授权范围内查看学情、布置作业与处理学生提交。具体服务规则以正式协议为准。"]},"privacy":{"title":"隐私政策","sections":["政策内容示意","本页用于演示隐私政策阅读交互，正式政策正文待接入。","信息与用途","登录涉及账号身份验证；班级、学生及作业信息用于已授权的教学工作。","权限与管理","图片、视频和文件仅在主动选择附件时读取。个人信息处理范围、保存期限、联系及权利申请方式以正式政策为准。"]}};
    function teacherAgreementRow(){return `<div class="teacher-agreement-row"><label><input type="checkbox" aria-label="同意用户协议和隐私政策" ${teacherAgreementAccepted?'checked':''} onchange="teacherAgreementAccepted=this.checked">我已阅读并同意</label><button type="button" onclick="openTeacherAgreement('service')">《用户协议》</button><span>和</span><button type="button" onclick="openTeacherAgreement('privacy')">《隐私政策》</button></div>`}
    function requireTeacherAgreement(){if(teacherAgreementAccepted)return true;const error=document.getElementById('teacher-error');if(error)error.textContent='请先阅读并勾选同意协议';else{teacherQuickNotice='请先阅读并勾选同意协议';teacherLogin()}return false}
    function openTeacherAgreement(kind){const doc=teacherAgreements[kind];if(!doc)return;document.getElementById('teacher-agreement-detail')?.remove();app.insertAdjacentHTML('beforeend',`<div id="teacher-agreement-detail" class="teacher-agreement-mask" role="dialog" aria-modal="true" aria-label="${doc.title}"><section class="teacher-agreement-detail"><header><strong>${doc.title}</strong><button type="button" onclick="closeTeacherAgreement()">关闭</button></header><div class="teacher-agreement-body">${doc.sections.map((text,index)=>index%2===0?'<h3>'+text+'</h3>':'<p>'+text+'</p>').join('')}</div><button type="button" class="teacher-primary" onclick="closeTeacherAgreement()">返回登录</button></section></div>`)}
    function closeTeacherAgreement(){document.getElementById('teacher-agreement-detail')?.remove()}
    function teacherLogin(){const bound=demoTeacherWechatBound&&!teacherReplacePending;app.innerHTML=`<main class='screen teacher-screen'>${header('教师登录',true,true)}<section class='teacher-main'><div class='teacher-hero teacher-login-hero'><img class='teacher-art' src='assets/teacher-login-illustration.png' alt=''><div class='teacher-mark'>师</div><h1>班级工作台</h1><p>登录后查看学情、处理作业。</p></div><div class='teacher-actions'><button class='teacher-primary' onclick='${bound?'teacherWechatQuickLogin()':'openTeacherPhoneSheet()'}'>微信登录</button><button class='teacher-wechat-entry' onclick='openTeacherPasswordLogin()'>账号密码登录</button>${teacherQuickNotice?`<p class='teacher-auth-error'>${teacherQuickNotice}</p>`:''}${teacherAgreementRow()}</div></section>${teacherPhoneSheetOpen?teacherPhoneSheet():''}</main>`;syncReview()}
    function openTeacherPhoneSheet(){if(!requireTeacherAgreement())return;teacherQuickNotice='';teacherPhoneSheetOpen=true;teacherLogin()}
    function denyTeacherPhone(){teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherLogin()}
    function openTeacherOtherPhone(){teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherPhoneFromWechat=false;go('teacherPhone')}
    function openTeacherPasswordLogin(){if(!requireTeacherAgreement())return;teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherPhoneFromWechat=false;teacherLoginMode='password';teacherCodeSent=false;go('teacherPhone')}
    function approveTeacherPhone(){teacherPhoneSheetOpen=false;teacherQuickNotice='';teacherPhoneFromWechat=true;teacherPhoneDraft='13800138000';teacherLoginMode='sms';teacherCodeSent=false;go('teacherPhone')}
    function teacherFirstSmsRequired(){return !demoTeacherWechatBound&&!teacherReplacePending&&!teacherFirstSmsVerified}
    function switchTeacherLoginMode(mode){if(mode===teacherLoginMode)return;teacherPhoneDraft=(document.getElementById('teacher-phone')?.value||'').replace(/\D/g,'').slice(0,11);teacherLoginMode=mode;teacherBranch='normal';teacherFlowOutcome='';teacherPhoneLogin();updateTeacherCodeButton()}
    function clearTeacherError(){const error=document.getElementById('teacher-error');if(error)error.textContent=''}
    function sendTeacherCode(){if(teacherCodeRemaining())return;const phone=document.getElementById('teacher-phone').value.trim(),error=document.getElementById('teacher-error');if(!/^1\d{10}$/.test(phone)){error.textContent='请输入有效的 11 位手机号';return}if(teacherBranch==='accountMissing'||phone!=='13800138000'){error.textContent=teacherBranchMessages.accountMissing;syncReview();return}teacherCodeSent=true;startTeacherCodeCountdown();error.textContent='验证码已发送';error.style.color='#328865';syncReview()}
    function verifyTeacher(){if(!requireTeacherAgreement())return;if(teacherAvailability==='deleted'){showTeacherAccountUnavailable();return}const phone=document.getElementById('teacher-phone').value.trim(),error=document.getElementById('teacher-error');error.style.color='#fa5151';if(!/^1\d{10}$/.test(phone)){error.textContent='请输入有效的 11 位手机号';return}if(teacherLoginMode==='sms'&&!teacherCodeSent){error.textContent='请先获取验证码';return}if(teacherBranch!=='normal'){error.textContent=teacherBranchMessages[teacherBranch]||'当前登录失败，请重试';syncReview();return}if(phone!=='13800138000'){error.textContent='未找到该手机号对应的教师账号';return}if(teacherLoginMode==='sms'){if(document.getElementById('teacher-code').value.trim()!=='123456'){error.textContent='验证码错误或已过期';return}teacherFirstSmsVerified=true}else{if(document.getElementById('teacher-password').value!=='123456'){error.textContent='账号或密码错误';return}if(teacherFirstSmsRequired()){teacherPhoneDraft=phone;teacherLoginMode='sms';teacherCodeSent=false;teacherFlowOutcome='首次登录还需短信验证，请获取验证码。';teacherPhoneLogin();return}}teacherFlowOutcome='';if(teacherFlow==='first'||teacherFlow==='replace')teacherFlowStep=1;if(demoTeacherWechatBound){saveDemoTeacherSession();localStorage.removeItem(teacherManualLogoutKey);go('teacherDesk')}else go('teacherBind')}
    function teacherWechatQuickLogin(){if(!requireTeacherAgreement())return;if(teacherAvailability==='deleted'){showTeacherAccountUnavailable();return}const error=document.getElementById('teacher-error');if(!demoTeacherWechatBound){if(error)error.textContent='当前微信尚未绑定，请先验证教师账号。';return}if(teacherFlow==='otherDevice'&&!teacherOtherDeviceConfirmed){teacherFlowStep=2;go('teacherDeviceConfirm');return}saveDemoTeacherSession();localStorage.removeItem(teacherManualLogoutKey);go('teacherDesk')}
    function teacherDeviceConfirm(){app.innerHTML=`<main class="screen teacher-screen">${header('确认登录',false,true)}<section class="teacher-main"><div class="teacher-hero"><div class="teacher-mark">师</div><h1>此账号正在另一设备使用</h1><p>继续登录后，原设备将退出登录。</p></div><div class="teacher-actions"><button class="teacher-primary" onclick="confirmTeacherDeviceLogin()">继续登录</button><button class="teacher-wechat-entry" onclick="cancelTeacherDeviceLogin()">取消</button></div></section></main>`;syncReview()}
    function confirmTeacherDeviceLogin(){if(teacherFlow!=='otherDevice')return;teacherOtherDeviceConfirmed=true;teacherFlowStep=3;saveDemoTeacherSession();go('teacherDesk')}
    function cancelTeacherDeviceLogin(){if(teacherFlow!=='otherDevice')return;teacherOtherDeviceConfirmed=false;localStorage.removeItem(teacherDemoSessionKey);go('teacherLogin')}
    function teacherDeviceKicked(){app.innerHTML=`<main class="screen teacher-screen">${header('登录已退出',false,true)}<section class="teacher-main"><div class="teacher-hero"><div class="teacher-mark">师</div><h1>账号已在另一设备登录</h1><p>本设备已退出登录。重新登录后，另一设备也将退出。</p></div><div class="teacher-actions"><button class="teacher-primary" onclick="retryTeacherAfterKick()">重新登录</button></div></section></main>`;syncReview()}
    function showTeacherOriginalDevice(){if(teacherFlow!=='otherDevice'||stage!=='teacherDesk')return;teacherOriginalDeviceKicked=true;teacherOtherDeviceConfirmed=false;teacherFlowStep=4;go('teacherDeviceKicked')}
    function retryTeacherAfterKick(){teacherOriginalDeviceKicked=false;teacherOtherDeviceConfirmed=false;go('teacherLogin')}
    function teacherBind(){const conflict=teacherBranch==='conflict';const title=conflict?'微信绑定受限':teacherReplacePending?'更换绑定微信':'绑定当前微信';const copy=conflict?'当前微信已绑定其他教师账号。请先由原账号持有人解绑，或联系学校管理员。':teacherReplacePending?'确认后，旧微信将不能再快捷登录此教师账号。':'将教师账号 138****8000 绑定到当前微信？';app.innerHTML=`<main class="screen teacher-screen">${header(title,true,true)}<section class="teacher-main"><div class="teacher-hero teacher-bind-hero"><img class="teacher-art" src="assets/teacher-login-illustration.png" alt=""><div class="teacher-mark">师</div><h1>${title}</h1><p>${conflict?'请先处理当前微信的绑定关系。':teacherReplacePending?'请再次验证教师账号。':'绑定后，下次可用当前微信快捷进入。'}</p></div><div class="teacher-auth-card teacher-bind-card"><div class="teacher-bind-title">教师账号</div><div class="teacher-bind-account">138****8000</div><p class="teacher-bind-copy">${copy}</p>${teacherReplacePending&&!conflict?'<input id="teacher-replace-password" class="teacher-field-input" type="password" placeholder="请输入登录密码完成二次验证">':''}<div id="teacher-bind-error" class="teacher-security-error">${teacherBranchMessages[teacherBranch]||''}</div></div><div class="teacher-actions">${conflict?'':`<button class="teacher-primary" onclick="confirmTeacherBind()">${teacherReplacePending?'验证并确认换绑':'绑定并进入'}</button>`}<button class="teacher-wechat-entry" onclick="cancelTeacherBind()">取消，返回登录</button></div></section></main>`;syncReview()}

    function clearError(){document.getElementById('error').textContent=''}
    function toggleTeacherExceptionMenu(){const menu=document.getElementById('teacher-page-exception-menu');if(menu)menu.hidden=!menu.hidden}
    function injectTeacherExceptionPanel(){if(params.get('review')!=='1'||stage==='parent')return;const screen=app.querySelector('.screen');if(!screen||screen.querySelector('.demo-exception-panel'))return;const options=currentTeacherBranchOptions().filter(([key])=>key!=='normal');if(!options.length)return;const panel=document.createElement('div');panel.className='demo-exception-panel';panel.innerHTML='<button class="demo-exception-trigger" onclick="toggleTeacherExceptionMenu()">异常场景 ▾</button><div class="demo-exception-menu" id="teacher-page-exception-menu" hidden><strong>当前页面异常</strong><button onclick="setTeacherBranch(\'normal\')">恢复正常</button>'+options.map(([key,label])=>'<button onclick="setTeacherBranch(\''+key+'\')">'+label+'</button>').join('')+'</div>';screen.appendChild(panel)}
    function syncReview(){
      const domain=stage==='parent'?'parent':'teacher';
      document.body.classList.toggle('demo-domain-parent',domain==='parent');
      document.body.classList.toggle('demo-domain-teacher',domain==='teacher');
      document.querySelectorAll('[data-demo-domain]').forEach(b=>b.classList.toggle('active',b.dataset.demoDomain===domain));
      document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.classList.toggle('active',b.dataset.teacherFlow===teacherScenario));
      const steps=document.getElementById('teacher-review-steps'),action=document.getElementById('teacher-review-action'),detail=document.getElementById('teacher-review-detail');
      if(!steps||!action||!detail)return;
      const progress=teacherReviewProgress();
      steps.innerHTML=progress.steps.map((label,i)=>'<li class="'+(i===progress.current?'current':i<progress.current?'done':'')+'">'+(i+1)+'. '+label+'</li>').join('');
      action.innerHTML=stage==='teacherLaunch'?'<button class="review-next" onclick="advanceTeacherSystemStep()">'+(teacherFlow==='expired'&&teacherFlowStep===2?'查看恢复结果':'推进系统判断')+' →</button>':teacherScenario==='otherDevice'&&stage==='teacherDesk'?'<button class="review-next" onclick="showTeacherOriginalDevice()">查看原设备的下线提示 →</button>':'';
      const pageName={teacherLaunch:'启动与会话校验',teacherLogin:'快捷登录',teacherPhone:'教师账号登录',teacherBind:'微信绑定',teacherDeviceConfirm:'确认登录',teacherDeviceKicked:'原设备下线提示',teacherDesk:'教师工作台',teacherSecurity:'账号与安全'}[stage]||'身份选择';
      detail.innerHTML=teacherScenario?'<strong>'+teacherFlowTitles[teacherScenario]+'</strong> · '+pageName+(teacherScenario==='otherDevice'?'<br>同一微信登录新设备后，原设备会话失效。':''):'选择一条完整流程，从入口开始。';
      injectTeacherExceptionPanel();
    }
    function toggleDemoConsole(){const open=document.body.classList.toggle('demo-console-open');const button=document.getElementById('demo-console-toggle');button.setAttribute('aria-expanded',String(open));button.querySelector('.demo-console-toggle-label').textContent=open?'收起控制台':'演示控制台'}
    function chooseDemoDomain(domain){if(domain==='parent')startParentScenario('first');else if(domain==='teacher')startTeacherFlow('first')}
    function startParentScenario(name){parentPrototype.scenario(name)}
    function restartTeacherScenario(){startTeacherFlow(teacherScenario||'first')}
    function clearDemoCacheAndRestart(){['ai_companion_demo_parent_v2',teacherDemoSessionKey,teacherManualLogoutKey,'ai_companion_demo_teacher_wechat_binding'].forEach(key=>localStorage.removeItem(key));if(stage==='parent')parentPrototype.restart();else restartTeacherScenario()}
    if(params.has('workView')){workbenchPrototype.demoIdentity('all');workbenchPrototype.view(params.get('workView'));if(params.get('classId'))workbenchPrototype.class(params.get('classId'));if(['learning','homework','mine'].includes(params.get('tab')))teacherTab=params.get('tab');}
    document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.addEventListener('click',()=>startTeacherFlow(b.dataset.teacherFlow)));if(['auth','code','confirm','pending','approved'].includes(stage))stage='parent';restoreDemoTeacherOnLaunch();if(stage==='teacherLaunch'&&!teacherScenario)startTeacherFlow('first');else if(stage==='parent'){if(params.get('scenario'))parentPrototype.scenario(params.get('scenario'));else parentPrototype.start();}else ({home,parent:parentPrototype.render,teacherLaunch,teacherLogin,teacherPhone:teacherPhoneLogin,teacherBind,teacherDeviceConfirm,teacherDeviceKicked,teacherDesk,teacherSecurity,teacherUnavailable:showTeacherAccountUnavailable}[stage]||home)();
  </script>
</body>
</html>
