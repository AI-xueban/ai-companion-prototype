'done' && s.phase !== 'unsupported') {\n        s.returnPhase = s.phase;\n        s.phase = 'paused';\n        s.epoch++;\n    } };\n    switch (event.type) {\n        case 'pause':\n            if (!event.input)\n                s.hold = true;\n            pause();\n            break;\n        case 'draft':\n            s.draft = event.text.slice(0, 500);\n            break;\n        case 'resume':\n            if (s.phase === 'paused' || s.phase === 'resume') {\n                s.hold = false;\n                s.phase = s.returnPhase === 'aside' ? 'aside' : s.returnPhase === 'done' ? 'done' : s.returnPhase;\n                s.epoch++;\n            }\n            break;\n        case 'tick':\n            if (s.phase === 'playing') {\n                if (a.prompt && !s.direct && !s.parentMode)\n                    s.phase = 'waiting';\n                else\n                    next();\n            }\n            else if (s.phase === 'feedback')\n                next();\n            else if (s.phase === 'remedial') {\n                s.phase = 'waiting';\n                s.feedback = '请再试着说明当前关系；提示后的回答会保留帮助记录。';\n            }\n            break;\n        case 'skip':\n            if (s.phase === 'transfer' || s.phase === 'paused' && s.returnPhase === 'transfer') {\n                s.phase = 'done';\n                s.transferStatus = s.transferStatus || '迁移未验证';\n                s.epoch++;\n                s.feedback = '';\n                break;\n            }\n            if (s.phase === 'waiting' || s.phase === 'choice' || s.phase === 'remedial' || s.phase === 'paused' && s.returnPhase === 'waiting') {\n                if (!s.evidence.some(e => e.objective === a.id))\n                    saveEvidence('未验证');\n                next();\n            }\n            break;\n        case 'hint':\n            if (s.phase === 'transfer' || s.phase === 'paused' && s.returnPhase === 'transfer') {\n                s.transferHelped = true;\n                s.transferStatus = '迁移仍需帮助';\n                s.feedback = tutorTransfer(plan).explanation;\n                s.epoch++;\n                break;\n            }\n            if (s.phase === 'done' || s.phase === 'unsupported')\n                break;\n            s.helped = true;\n            s.epoch++;\n            if (s.phase !== 'waiting' && !(s.phase === 'paused' && s.returnPhase === 'waiting')) {\n                s.asideReturn = s.phase === 'aside' ? s.asideReturn : s.phase;\n                s.detail = a.explanation || a.hint || a.speech;\n                s.phase = 'aside';\n            }\n            else {\n                s.rounds++;\n                s.feedback = s.rounds === 1 ? (a.hint || a.explanation || a.speech) : (a.explanation || a.speech);\n                s.phase = s.rounds > 2 ? 'choice' : 'remedial';\n                if (s.rounds > 2)\n                    s.feedback = '我们已经用提示和补讲尝试了两轮。你可以换方式查看、先继续讲，或返回原题。';\n            }\n            break;\n        case 'answer': {\n            if (s.phase === 'transfer' || s.phase === 'paused' && s.returnPhase === 'transfer') {\n                const quiz = tutorTransfer(plan);\n                s.epoch++;\n                s.draft = event.text.slice(0, 500);\n                if (clean(event.text) === clean(quiz.answer)) {\n                    s.transferStatus = s.transferHelped ? '变式在帮助下完成' : '本次变式判断符合';\n                    s.phase = 'done';\n                    s.feedback = '';\n                }\n                else if (quiz.options.some(v => clean(v) === clean(event.text))) {\n                    s.transferHelped = true;\n                    s.transferStatus = '迁移仍需帮助';\n                    s.feedback = quiz.explanation + ' 可以再选一次，或结束变式。';\n                }\n                else\n                    s.feedback = '这段表达暂时不能可靠判断。请选择一个选项或跳过变式，不把你判错。';\n                break;\n            }\n            if (!(s.phase === 'waiting' || s.phase === 'paused' && s.returnPhase === 'waiting'))\n                break;\n            const text = clean(event.text);\n            if (!text) {\n                s.feedback = '还没有收到回答，请填写或选择一个选项。';\n                break;\n            }\n            s.draft = event.text.slice(0, 500);\n            s.epoch++;\n            const accepted = (a.accepted || []).some(v => clean(v) === text), wrong = (a.rejected || []).some(v => clean(v) === text);\n            if (accepted) {\n                saveEvidence(s.helped ? '有帮助完成' : '本次回答符合判据');\n                s.feedback = '你找对了当前关系。' + (s.helped ? '这次是在帮助下完成，我们接着看下一步。' : '我们继续用它完成下一步。');\n                s.phase = 'feedback';\n            }\n            else if (wrong) {\n                saveEvidence('仍需巩固');\n                s.helped = true;\n                s.rounds++;\n                s.feedback = s.rounds > 2 ? '这一步仍需巩固。你可以换个方式、先继续讲或返回原题。' : (a.explanation || '我们把当前关系拆开看。');\n                s.phase = s.rounds > 2 ? 'choice' : 'remedial';\n            }\n            else {\n                s.clarifications++;\n                s.feedback = s.clarifications >= 2 ? '当前演示暂时无法可靠判断这段表达。可选择一个选项、看提示或先继续；不会把你判错。' : '这段表达还不能可靠对应当前判据。请用题目里的量简短说明，也可以选择一个选项。';\n                s.phase = s.clarifications >= 2 ? 'choice' : 'waiting';\n            }\n            break;\n        }\n        case 'ask': {\n            if (!event.text.trim()) {\n                s.feedback = '先写下你想问的问题。';\n                break;\n            }\n            const text = event.text;\n            if (/^(先继续|继续讲|跳过)$/.test(text.trim()))\n                return tutorReduce(s, plan, { type: 'skip' });\n            if (/直接讲|讲完/.test(text))\n                return tutorReduce(s, plan, { type: 'direct' });\n            if (/回原题|不用讲这个/.test(text) && s.phase === 'aside')\n                return tutorReduce(s, plan, { type: 'back' });\n            s.asideReturn = s.phase === 'aside' ? s.asideReturn : s.phase === 'paused' && !s.hold ? s.returnPhase : s.phase;\n            s.epoch++;\n            s.draft = '';\n            if (s.asideReturn === 'transfer') {\n                s.transferHelped = true;\n                s.transferStatus = '迁移仍需帮助';\n                s.detail = tutorTransfer(plan).explanation;\n            }\n            else\n                s.detail = /这一步|这步|分母|分子|整体|绿色|蓝紫色|通分|相加|横|份|方程|合计|路程/.test(text) ? (a.explanation || a.speech) + '\\n' + (a.followup || '可以回到当前步骤，再试着完成其中一个小动作。') : '这条自由追问尚未接入真实AI服务，当前演示无法可靠回答。可查看“当前步骤怎么理解”，或回到原流程继续。';\n            s.phase = 'aside';\n            break;\n        }\n        case 'back':\n            if (s.phase === 'aside') {\n                s.phase = s.asideReturn || 'paused';\n                s.detail = '';\n                s.draft = '';\n                s.epoch++;\n            }\n            break;\n        case 'restart':\n            s.cursor = 0;\n            s.phase = 'playing';\n            s.returnPhase = 'playing';\n            s.epoch++;\n            s.draft = '';\n            s.feedback = '';\n            s.detail = '';\n            s.helped = false;\n            s.rounds = 0;\n            s.clarifications = 0;\n            s.hold = false;\n            break;\n        case 'direct':\n            s.direct = !s.direct;\n            s.epoch++;\n            if (s.direct && ['waiting', 'choice', 'remedial'].includes(s.phase)) {\n                if (!s.evidence.some(e => e.objective === a.id))\n                    saveEvidence('未验证');\n                next();\n            }\n            break;\n        case 'parent':\n            s.parentMode = !s.parentMode;\n            s.direct = s.parentMode;\n            s.epoch++;\n            if (s.parentMode && ['waiting', 'choice', 'remedial'].includes(s.phase))\n                next();\n            break;\n        case 'original':\n            s.hold = true;\n            pause();\n            s.originalOpen = true;\n            break;\n        case 'closeOriginal':\n            s.originalOpen = false;\n            break;\n        case 'transfer':\n            if (s.phase === 'done') {\n                s.phase = 'transfer';\n   <script data-offline-source="learning-prototype.js">
/* 家长学习报告 UI 预览，读取现有学情与任务演示数据。 */
window.learningPrototype = (() => {
  const data = window.learningData;
  const roster = window.schoolDemoRoster;
  const state = { period: 'day', activityId: '', showAllTimeline: false, featureOpen: false };
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const button = (label, value) => `<button class="lp-chip${state.period === value ? ' active' : ''}" aria-pressed="${state.period === value}" onclick="learningPrototype.period('${value}')">${label}</button>`;
  const heading = (title, note = '') => `<div class="pr-section-heading"><h3>${title}</h3>${note ? `<small>${note}</small>` : ''}</div>`;
  const empty = text => `<div class="pr-empty">${text}</div>`;
  const evidenceSheet = report => {
    const item = state.activityId && data.activityEvidence(report, state.activityId);
    if (!item) return '';
    return `<div class="lp-evidence-mask" onclick="learningPrototype.activity('')"><section class="lp-evidence-sheet" role="dialog" aria-modal="true" aria-label="学习活动详情" onclick="event.stopPropagation()"><button class="lp-evidence-close" onclick="learningPrototype.activity('')">关闭 ×</button><h3>${esc(item.activity.feature)} · 活动详情</h3><p>${item.date} ${item.activity.start} · ${esc(item.activity.title)} · ${item.activity.minutes} 分钟 · ${esc(item.activity.status)}</p><h4>原题与作答</h4>${item.questions.length ? item.questions.map(q => `<div class="lp-evidence-question"><strong>${esc(q.stem)}</strong><p>${q.kind}作答：${esc(q.answer)} · ${q.result}</p><p>参考答案：${esc(q.reference)} · ${esc(q.scoring)} · ${esc(q.version)}</p></div>`).join('') : '<p>本次活动没有关联逐题作答。</p>'}</section></div>`;
  };
  const renderParent = index => {
    const child = roster.getDemoStudent(roster.DEMO_GUARDIAN_CHILD_IDS[index] || roster.GUARDIAN_STUDENT_ID);
    const full = data.queryLearning(state.period === '30d' ? '30d' : '7d', child.classId, 'all', child.id);
    const report = state.period === 'day' ? data.learningOnDay(full, 0) : full;
    const summary = data.getStudentLearning(report, child.id);
    const subjects = data.subjectRows(report);
    const rows = data.timelineRows(report);
    const first = report.answers.filter(row => row.kind === '首次');
    const wrong = first.filter(row => !row.correct);
    const corrections = report.answers.filter(row => row.kind === '订正');
    const corrected = corrections.filter(row => row.correct).length;
    const features = data.featureRows(report);
    const chat = features.find(row => row.name === '小晤问答');
    const solve = features.find(row => row.name === 'AI解题');
    const tasks = window.homeworkPrototype?.getParentTaskSummary(index) || { pending: 0, dueSoon: 0, overdue: 0 };
    const periodLabel = state.period === 'day' ? '今日' : state.period === '7d' ? '近 7 天' : '近 30 天';
    const knowledge = new Map();
    wrong.forEach(row => { const key = `${row.subject}:${row.knowledge}`; const entry = knowledge.get(key) || { subject: row.subject, title: row.knowledge || '练习内容', count: 0, activityId: row.activityId }; entry.count++; knowledge.set(key, entry); });
    const focus = [...knowledge.values()].sort((a,b) => b.count - a.count);
    const brief = summary.learned ? `${periodLabel}学习了${subjects.map(row => row.subject).join('、')}，有 ${rows.length} 条学习活动。${first.length ? `首次作答 ${first.length} 题次，答对 ${first.length - wrong.length} 题次。` : '本期暂无练习作答记录。'}` : summary.used ? `${periodLabel}有学伴使用记录，暂未记录到学习活动。` : `${periodLabel}暂无学伴学习记录。可切换时间范围，查看近期学习情况。`;
    const taskText = tasks.dueSoon ? `${tasks.pending} 项待完成，其中 ${tasks.dueSoon} 项将在 24 小时内截止` : tasks.overdue ? `${tasks.pending} 项待完成，其中 ${tasks.overdue} 项仍可补交` : `${tasks.pending} 项作业与打卡待完成`;
    const taskAttention = `<button class="pr-attention-row" onclick="learningPrototype.openTasks()"><span class="pr-attention-mark">${tasks.pending ? tasks.dueSoon ? '临期' : '待办' : '任务'}</span><span><strong>${tasks.pending ? taskText : '当前暂无待完成任务'}</strong><small>当前任务状态 · 进入作业与打卡处理</small></span><b>›</b></button>`;
    const wrongAttention = wrong.length ? `<button class="pr-attention-row" onclick="learningPrototype.activity('${esc(focus[0].activityId)}')"><span class="pr-attention-mark practice">练习</span><span><strong>${wrong.length} 题次首次答错，值得一起回看</strong><small>${esc(focus.slice(0,2).map(row => row.title).join('、'))} · 点击查看作答依据</small></span><b>›</b></button>` : `<div class="pr-attention-row"><span class="pr-attention-mark neutral">练习</span><span><strong>${first.length ? '本期首次作答未出现答错记录' : '本期暂无练习作答，暂不判断掌握情况'}</strong><small>${first.length ? '可结合后续练习继续观察' : '学习情况以已记录的活动为准'}</small></span></div>`;
    return `<div class="lp-page pl-page pr-report">
      <div class="lp-hero pl-hero"><div class="pl-inline-periods"><div class="lp-switch">${button('今日','day')}${button('近 7 天','7d')}${button('近 30 天','30d')}</div></div></div>

      <p class="pr-footnote">仅展示学伴内已记录的学习；时长不含小晤问答。未记录到活动，不代表孩子没有学习。</p>${evidenceSheet(report)}</div>`;
  };
  return {
    getDemoContext:()=>({...state}),
    renderParent,
    openTasks() { window.homeworkPrototype?.resetParentView(); window.homeworkPrototype?.changeParentTaskTab('pending'); window.parentPrototype?.tab('homework'); },
    period(value) { if(!['day','7d','30d'].includes(value)) return; state.period=value; state.activityId=''; state.showAllTimeline=false; window.parentPrototype?.render(); },

  };
})();

/* 教职员工统一工作台：演示常见的双重职责，菜单只列出当前账号获授权的视角。 */

  const scopeName = () => state.classId !== 'all' ? roster.getDemoClass(state.classId)?.name || '' : state.grade === 'all' ? roster.SCHOOL_NAME : `${state.grade}年级`;

    return `<div class="lp-page wb-page${domain === 'homework' ? ' wb-homework-page' : ''}">${overviewHeader}${controls}`;
  };

  const evidenceOverlay = result => {
    if (state.activityId && state.studentId) {

      return evidence ? `<div class="lp-evidence-mask" onclick="workbenchPrototype.activity('')"><section class="lp-evidence-sheet" onclick="event.stopPropagation()"><button class="lp-evidence-close" onclick="workbenchPrototype.activity('')">关闭 ×</button><h3>${esc(evidence.activity.feature)} · 活动详情</h3><p>${evidence.date} ${evidence.activity.start} · ${esc(evidence.activity.title)} · ${evidence.activity.minutes} 分钟 · ${esc(evidence.activity.status)}</p><h4>原题与作答</h4>${evidence.questions.length ? evidence.questions.map(item => `<div class="lp-evidence-question"><strong>${esc(item.stem)}</strong><p>${item.kind}作答：${esc(item.answer)} · ${item.result}</p><p>参考答案：${esc(item.reference)} · ${esc(item.scoring)} · ${esc(item.version)}</p></div>`).join('') : '<p>本次活动没有关联逐题作答。</p>'}</section></div>` : '';

        const classRows = state.classId === 'all' ? classes().map(item => { const classReport = learning.queryLearning(state.period,item.id,'all'); return { ...item, learned: classReport.learnedIds.size, enrolled: classReport.roster.length, coverage: learning.pct(classReport.learnedIds.size,classReport.roster.length) }; }).sort((a,b) => a.coverage-b.coverage) : [];
        const focus = state.view === 'school' ? focusPanel('校级优先看', '班级覆盖差异',classRows.map((item,index)=>`<button class="lp-list-button" onclick="workbenchPrototype.class('${item.id}')"><span><strong><i>${index+1}</i>${esc(item.name)}</strong><small>${item.learned} / ${item.enrolled} 人发生学习</small></span><b>${item.coverage}% ›</b></button>`).join('') || empty('当前已选具体班级，可查看学生明细。')) : state.view === 'homeroom' ? focusPanel('班主任优先看', '需要核对的学生',students.filter(item=>!item.learned).slice(0,4).map(item=>`<button class="lp-list-button" onclick="workbenchPrototype.student('${item.id}')"><span><strong>${esc(item.name)}</strong><small>${item.used?'仅有使用记录':'暂无使用记录'}</small></span><b>查看 ›</b></button>`).join('') || empty('本期本班学生均有学伴学习活动。')) : focusPanel('任课老师优先看', '错误集中的知识点',knowledge.map(item=>`<button class="lp-list-button" onclick="workbenchPrototype.focusKnowledge('${item.key}')"><span><strong>${esc(item.knowledge)}</strong><small>${item.students} 人练过 · ${item.questions} 道题</small></span><b>${item.wrongPeople} 人首次答错 ›</b></button>`).join('') || empty('当前范围暂无逐题作答。'));

    else{left=bounds.right-width;top=bounds.bottom+gap+height<=innerHeight-gap?bounds.bottom+gap:bounds.top-gap-height;}

    panel.style.top=Math.max(gap,Math.min(top,innerHeight-height-gap))+'px';

  function close(){menuOpen=false;sync();(document.getElementById('dw-state-toggle')||document.querySelector('#page-demo-tools-host .parent-demo-open'))?.focus({preventScroll:true});}
  function select(id){const c=getContext();if(!c?.choices.some(choice=>choice.id===id))return;changingState=Boolean(window.demoWorkspace?.enabled);if(!changingState)menuOpen=false;try{if(c.kind==='homework')window.homeworkPrototype.applyPageDemo(id,c.role);else if(c.kind==='parent')window.parentPrototype.exception(id);else if(c.kind==='learning')window.learningPageDemo.select(id);else setTeacherBranch(id);sync();}finally{changingState=false;}}

  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&menuOpen)close();});

    function teacherLogin(){const bound=demoTeacherWechatBound&&!teacherReplacePending;app.innerHTML=`<main class='screen teacher-screen'>${header('教师登录',true,true)}<section class='teacher-main'><div class='teacher-hero teacher-login-hero'><img class='teacher-art' src='assets/teacher-login-illustration.png' alt=''><div class='teacher-mark'>师</div><h1>班级工作台</h1><p>登录后查看学情、处理作业。</p></div><div class='teacher-actions'><button class='teacher-primary' onclick='${bound?'teacherWechatQuickLogin()':'openTeacherPhoneSheet()'}'>微信登录</button><button class='teacher-wechat-entry' onclick='openTeacherPasswordLogin()'>账号密码登录</button>${teacherQuickNotice?`<p class='teacher-auth-error'>${teacherQuickNotice}</p>`:''}${teacherAgreementRow()}</div></section>${teacherPhoneSheetOpen?teacherPhoneSheet():''}</main>`;syncReview()}

    function toggleHomeworkReminder(id){const t=homeworkTask(id);if(t.remindAllDone){t.remindAllDone=false;openTeacherHomeworkDetail(id);return}if(homeworkMessageEnabled){t.remindAllDone=true;openTeacherHomeworkDetail(id);controlToast('已开启全部完成提醒');return}controlOverlay('开启消息通知','<p class="control-confirm-copy">收到“作业全部完成”提醒前，需要先打开小程序消息通知。正式小程序会在这里请求微信订阅消息授权。</p>','<button class="control-secondary" onclick="closeControlOverlay()">暂不开启</button><button class="control-primary" onclick="enableHomeworkMessages('+id+')">打开消息通知</button>')}
    function enableHomeworkMessages(id){homeworkMessageEnabled=true;const t=homeworkTask(id);t.remindAllDone=true;openTeacherHomeworkDetail(id);controlToast('已开启全部完成提醒（原型演示）')}
    function approved(){renderParentHomework()}
    function homeworkSubmissionState(t){if(t.parentSubmitted)return 'done';const end=new Date(t.deadlineInput||homeworkDateTime(t.deadline)).getTime();return Number.isFinite(end)?Date.now()>end+(t.allowLate?86400000:0)?'expired':'todo':t.status==='expired'?'expired':'todo'}
    function renderParentHomework(){const tasks=homeworkTasks.filter(t=>t.status!=='draft'&&t.classes.includes(student.className)&&homeworkSubmissionState(t)===parentHomeworkFilter);app.innerHTML='<main class="screen hw-screen">'+header('孩子作业',false)+'<div class="parent-hw-head"><div class="parent-hw-child"><b>'+student.name+'</b><span>'+student.school+' · '+student.className+'</span></div></div><div class="parent-hw-tabs"><div class="hw-tabs" role="tablist">'+[['todo','未完成'],['done','已完成'],['expired','已过期']].map(([id,label])=>'<button role="tab" aria-selected="'+(parentHomeworkFilter===id)+'" onclick="parentHomeworkFilter=\''+id+'\';renderParentHomework()">'+label+'</button>').join('')+'</div></div><section class="hw-content" style="padding-top:0">'+(tasks.length?tasks.map(renderParentHomeworkCard).join(''):'<div class="control-empty">这里暂时没有作业</div>')+'</section><footer class="bottom-actions"><button class="secondary" onclick="go(\'home\')">返回身份选择</button></footer><div id="control-overlay"></div><div id="control-toast" role="status"></div></main>';syncReview()}
    function renderParentHomeworkCard(t){const state=homeworkSubmissionState(t);return '<button type="button" class="hw-card parent-hw-card" style="width:100%;text-align:left" onclick="openParentHomeworkDetail('+t.id+')"><div class="hw-card-head"><h3>'+t.subject+'作业'+(t.fresh?'<span class="hw-new-mark">新</span>':'')+'</h3><span class="hw-badge '+(state==='todo'?'':state)+'">'+({todo:'待完成',done:'已完成',expired:'已过期'}[state])+'</span></div><p class="hw-meta">'+t.title+'<br>截止：'+t.deadline+'</p><p class="hw-requirement">'+t.requirement+'</p><div class="hw-card-foot"><span>'+t.method+'</span><strong>查看详情 ›</strong></div></button>'}
    function openParentHomeworkDetail(id){const t=homeworkTask(id),state=homeworkSubmissionState(t);t.fresh=false;controlOverlay(t.subject+'作业','<p class="control-scope">'+student.name+' · '+t.deadline+' 截止'+(t.allowLate?' · 可补交 24 小时':'')+'</p><div class="hw-detail-section"><h4>老师要求</h4><p>'+t.requirement+'</p></div>'+(t.attachments.length?'<div class="hw-detail-section"><h4>作业附件</h4>'+t.attachments.map(a=>'<div class="hw-attachment"><span>'+a+'</span><b>下载</b></div>').join('')+'</div>':'')+(state==='todo'?'<div class="hw-detail-section"><h4>完成材料</h4><p>孩子线下完成后，请按“'+t.method+'”上传材料。</p><div id="parent-photo-grid" class="hw-photo-grid"></div><button type="button" class="control-add-period" onclick="simulateParentPhotos()">＋ 拍照或从相册选择</button></div>':'<p class="control-confirm-copy">'+(state==='done'?'这份作业已提交':'已超过提交时间')+'</p>'),state==='todo'?'<button class="control-primary" onclick="submitParentHomework('+t.id+')">提交作业</button>':'<button class="control-primary" onclick="closeControlOverlay()">知道了</button>')}
    function simulateParentPhotos(){document.getElementById('parent-photo-grid').innerHTML='<div class="hw-photo">作业照片 1</div><div class="hw-photo">作业照片 2</div>'}
    function submitParentHomework(id){const t=homeworkTask(id),grid=document.getElementById('parent-photo-grid');if(homeworkSubmissionState(t)!=='todo'){controlToast(t.parentSubmitted?'这份作业已提交':'已超过作业提交时间');return}if(!grid||!grid.children.length){controlToast('请先上传完成材料');return}t.parentSubmitted=true;t.done=Math.min(t.total,t.done+1);closeControlOverlay();parentHomeworkFilter='done';renderParentHomework();controlToast('作业已提交'+(t.remindAllDone&&t.done===t.total?' · 老师将收到全部完成提醒':''))}
    function renderHomeworkDrafts(){const drafts=homeworkTasks.filter(t=>t.status==='draft'),top=header('作业草稿',false).replace('<span></span><h2','<button class="wx-back" aria-label="返回作业首页" onclick="renderTeacherHomework()"><i></i></button><h2');app.innerHTML='<main class="screen hw-screen">'+top+'<section class="hw-content">'+(drafts.length?drafts.map(t=>'<article class="hw-draft-card"><button type="button" class="hw-draft-main" onclick="openHomeworkCreator('+t.id+')"><div class="hw-card-head"><h3>'+t.title+'</h3><span class="hw-badge draft">草稿</span></div><p class="hw-meta">'+t.classes.join('、')+' · '+t.subject+' · '+t.method+'<br>计划截止：'+t.deadline+'</p></button><div class="hw-draft-actions"><button type="button" class="hw-draft-delete" onclick="confirmDeleteHomeworkDraft('+t.id+')">删除</button><button type="button" class="hw-draft-edit" onclick="openHomeworkCreator('+t.id+')">继续编辑</button></div></article>').join(''):'<div class="control-empty">暂无作业草稿</div>')+'</section><div id="control-overlay"></div><div id="control-toast" role="status"></div></main>';syncReview()}
    function confirmDeleteHomeworkDraft(id){const draft=homeworkTasks.find(t=>t.id===id&&t.status==='draft');if(!draft)return;controlOverlay('删除草稿？','<p class="control-scope">'+draft.title+'</p><p class="control-confirm-copy">删除后将无法继续编辑这份草稿。</p>','<button class="control-secondary" onclick="closeControlOverlay()">取消</button><button class="control-primary" style="background:#db6065" onclick="deleteHomeworkDraft('+id+')">确认删除</button>')}
    function deleteHomeworkDraft(id){homeworkTasks=homeworkTasks.filter(t=>t.id!==id);renderHomeworkDrafts();controlToast('草稿已删除')}
    function selectTeacherClass(name){selectedTeacherClass=name;teacherDesk()}
    function showTeacherModule(name){alert(`${name}页面待接入。`)}    function go(next){if(['auth','code','confirm','pending','approved'].includes(next))next='parent';stage=next;history.replaceState(null,'',location.pathname+(params.get('review')==='1'?'?review=1&page=':'?page=')+next);({home,parent:parentPrototype.render,teacherLaunch,teacherLogin,teacherPhone:teacherPhoneLogin,teacherBind,teacherDeviceConfirm,teacherDeviceKicked,teacherDesk,teacherSecurity,teacherUnavailable:showTeacherAccountUnavailable}[next]||home)()}
    function saveDemoTeacherSession(){localStorage.setItem(teacherDemoSessionKey,JSON.stringify({userId:'teacher-demo-001',expiresAt:Date.now()+30*60*1000}))}
    function setExpiredDemoTeacherSession(){localStorage.setItem(teacherDemoSessionKey,JSON.stringify({userId:'teacher-demo-001',expiresAt:Date.now()-1000}))}
    const teacherFlowSteps={first:['验证教师账号与手机号','确认微信绑定','教师工作台'],returning:['打开小程序','确认登录状态','教师工作台'],otherDevice:['新设备打开小程序','发现原设备已有登录','确认继续登录','新设备进入，原设备退出','原设备看到下线提示'],expired:['打开小程序','登录状态已过期','尝试用微信恢复登录','进入工作台或重新登录'],replace:['验证教师账号','验证并确认换绑','教师工作台']};
    const teacherFlowTitles={first:'首次登录并绑定微信',returning:'有效会话再次进入',otherDevice:'同一微信在另一设备登录',expired:'token 过期后恢复',replace:'同账号更换微信'};
    let teacherScenario='';
    function teacherReviewProgress(){return {steps:teacherFlowSteps[teacherFlow]||[],current:teacherFlowStep}}
    const teacherBranchMessages={accountMissing:'未找到该手机号对应的教师账号',codeExpired:'验证码错误或已过期',passwordWrong:'账号或密码错误',network:'网络异常，请稍后重试',recoverFail:'当前微信无法恢复登录，请使用教师账号登录',accountDisabled:'教师账号不可用，请联系学校管理员',conflict:'当前微信已绑定其他教师账号，不能直接绑定',bindFailed:'绑定失败，请稍后重试',secondFactorFailed:'二次验证失败，请检查登录密码',revoked:'账号权限已撤销，无法继续查看教学数据'};
    function teacherLaunch(){const messages=teacherFlow==='returning'?['正在打开小程序','正在确认登录状态','即将进入教师工作台']:['正在打开小程序','正在确认登录状态','正在恢复登录','请稍候'];const error=teacherBranchMessages[teacherBranch];app.innerHTML=`<main class="screen teacher-screen">${header('教师登录',false,true)}<section class="teacher-main"><div class="teacher-launch ${error?'teacher-state-error':''}"><div class="teacher-mark">师</div><h1>${error?'登录遇到问题':messages[teacherFlowStep]}</h1><p>${error||'请稍候，正在确认你的教师账号。'}</p></div></section></main>`;syncReview()}
    function startTeacherFlow(name){if(!teacherFlowSteps[name])return;teacherAvailability='normal';localStorage.removeItem('ai_companion_demo_teacher_deleted');resetTeacherCodeCountdown();teacherScenario=name;teacherFlow=name;teacherFlowStep=0;teacherBranch='normal';teacherFlowOutcome='';teacherReplacePending=name==='replace';teacherSecurityNotice='';teacherCodeSent=false;teacherPhoneDraft='';teacherPhoneFromWechat=false;teacherFirstSmsVerified=false;teacherOtherDeviceConfirmed=false;teacherOriginalDeviceKicked=false;teacherLoginMode='sms';teacherPhoneSheetOpen=false;teacherQuickNotice='';localStorage.removeItem(teacherDemoSessionKey);localStorage.removeItem(teacherManualLogoutKey);demoTeacherWechatBound=name==='returning'||name==='otherDevice'||name==='expired';if(demoTeacherWechatBound)localStorage.setItem('ai_companion_demo_teacher_wechat_binding','teacher-demo-001');else localStorage.removeItem('ai_companion_demo_teacher_wechat_binding');if(name==='returning')saveDemoTeacherSession();if(name==='expired')setExpiredDemoTeacherSession();go(['returning','otherDevice','expired'].includes(name)?'teacherLaunch':'teacherLogin')}
    function advanceTeacherSystemStep(){if(stage!=='teacherLaunch')return;if(teacherFlow==='otherDevice'){teacherFlowStep++;if(teacherFlowStep>=2)go('teacherDeviceConfirm');else teacherLaunch()}else if(teacherFlow==='returning'){teacherFlowStep++;if(teacherFlowStep>=2){saveDemoTeacherSession();go('teacherDesk')}else teacherLaunch()}else if(teacherFlow==='expired'){if(teacherFlowStep===2&&teacherBranch!=='normal'){teacherFlowOutcome=teacherBranchMessages[teacherBranch];teacherBranch='normal';teacherFlowStep=3;localStorage.removeItem(teacherDemoSessionKey);go('teacherLogin');return}teacherFlowStep++;if(teacherFlowStep>=3){saveDemoTeacherSession();go('teacherDesk')}else teacherLaunch()}}
    function setTeacherBranch(branch){teacherBranch=branch;teacherFlowOutcome='';({teacherLaunch,teacherPhone:teacherPhoneLogin,teacherBind,teacherDesk}[stage]||syncReview)()}
    function currentTeacherBranchOptions(){if(stage==='teacherPhone')return [['normal','正常'],['accountMissing','账号不存在'],[teacherLoginMode==='sms'?'codeExpired':'passwordWrong',teacherLoginMode==='sms'?'验证码过期':'密码错误'],['network','网络异常']];if(stage==='teacherBind')return [['normal','正常'],['conflict','当前微信已绑定其他账号'],['bindFailed','绑定失败'],...(teacherReplacePending?[['secondFactorFailed','二次验证失败']]:[])];if(stage==='teacherLaunch'&&teacherFlow==='expired'&&teacherFlowStep===2)return [['normal','恢复成功'],['recoverFail','恢复失败'],['accountDisabled','账号不可用']];return []}
    let pendingLogoutAction=null;
    function showLogoutConfirm(onConfirm){if(document.querySelector('.logout-confirm-shade'))return;pendingLogoutAction=onConfirm;const screen=app.querySelector('.screen');if(!screen)return;screen.insertAdjacentHTML('beforeend','<div class="logout-confirm-shade" onclick="cancelLogoutConfirm(event)"><section class="logout-confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="logout-confirm-title" onclick="event.stopPropagation()"><h2 id="logout-confirm-title">确认退出登录？</h2><p>退出后需要重新登录。</p><div class="logout-confirm-actions"><button type="button" onclick="cancelLogoutConfirm()">取消</button><button type="button" class="logout-confirm-accept" onclick="confirmLogoutAction()">退出登录</button></div></section></div>');screen.querySelector('.logout-confirm-actions button')?.focus()}
    function cancelLogoutConfirm(event){if(event&&event.target!==event.currentTarget)return;document.querySelector('.logout-confirm-shade')?.remove();pendingLogoutAction=null}
    function confirmLogoutAction(){const action=pendingLogoutAction;pendingLogoutAction=null;document.querySelector('.logout-confirm-shade')?.remove();action?.()}
    function logoutTeacher(){showLogoutConfirm(()=>{teacherAgreementAccepted=false;localStorage.removeItem(teacherDemoSessionKey);localStorage.setItem(teacherManualLogoutKey,'1');teacherFirstSmsVerified=false;teacherPhoneFromWechat=false;go('teacherLogin')})}
    function restoreDemoTeacherOnLaunch(){if(teacherAvailability==='deleted'&&stage==='home'){stage='teacherUnavailable';return}if(stage!=='home')return;if(localStorage.getItem(teacherManualLogoutKey)==='1'){stage='teacherLogin';history.replaceState(null,'',location.pathname+'?page='+stage);return}let session;try{session=JSON.parse(localStorage.getItem(teacherDemoSessionKey)||'null')}catch{session=null}if(session?.userId==='teacher-demo-001'&&session.expiresAt>Date.now()){stage='teacherDesk'}else if(demoTeacherWechatBound){saveDemoTeacherSession();stage='teacherDesk'}else if(session){localStorage.removeItem(teacherDemoSessionKey);stage='teacherLogin'}if(stage!=='home')history.replaceState(null,'',location.pathname+'?page='+stage)}
    function verify(){const input=document.getElementById('code'),error=document.getElementById('error');enteredCode=input.value.trim();if(!enteredCode){error.textContent='请输入学生编号';return}if(!/^\d{6,20}$/.test(enteredCode)){error.textContent='学生编号应为 6–20 位数字';return}go('confirm')}
    function clearError(){document.getElementById('error').textContent=''}
    function toggleTeacherExceptionMenu(){const menu=document.getElementById('teacher-page-exception-menu');if(menu)menu.hidden=!menu.hidden}
    function injectTeacherExceptionPanel(){window.pageDemoTools?.sync();}
    function syncReview(){
      window.homeworkDemoConsole?.sync();
      const domain=stage==='parent'?'parent':'teacher';
      document.body.classList.toggle('demo-domain-parent',domain==='parent');
      document.body.classList.toggle('demo-domain-teacher',domain==='teacher');
      document.querySelectorAll('[data-demo-domain]').forEach(b=>b.classList.toggle('active',b.dataset.demoDomain===domain));
      document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.classList.toggle('active',b.dataset.teacherFlow===teacherScenario));
      const steps=document.getElementById('teacher-review-steps'),action=document.getElementById('teacher-review-action'),detail=document.getElementById('teacher-review-detail');
      if(!steps||!action||!detail)return;
      const progress=teacherReviewProgress();
      steps.innerHTML=progress.steps.map((label,i)=>'<li class="'+(i===progress.current?'current':i<progress.current?'done':'')+'">'+(i+1)+'. '+label+'</li>').join('');
      action.innerHTML=stage==='teacherLaunch'?'<button class="review-next" onclick="advanceTeacherSystemStep()">'+(teacherFlow==='expired'&&teacherFlowStep===2?'查看恢复结果':'推进系统判断')+' →</button>':teacherScenario==='otherDevice'&&stage==='teacherDesk'?'<button class="review-next" onclick="showTeacherOriginalDevice()">查看原设备的下线提示 →</button>':'';
      const pageName={teacherLaunch:'启动与会话校验',teacherLogin:'快捷登录',teacherPhone:'教师账号登录',teacherBind:'微信绑定',teacherDeviceConfirm:'确认登录',teacherDeviceKicked:'原设备下线提示',teacherDesk:'教师工作台',teacherSecurity:'账号与安全'}[stage]||'身份选择';
      detail.innerHTML=teacherScenario?'<strong>'+teacherFlowTitles[teacherScenario]+'</strong> · '+pageName+(teacherScenario==='otherDevice'?'<br>同一微信登录新设备后，原设备会话失效。':''):'选择一条完整流程，从入口开始。';
      injectTeacherExceptionPanel();
    }
    function toggleDemoConsole(){const open=document.body.classList.toggle('demo-console-open');const button=document.getElementById('demo-console-toggle');button.setAttribute('aria-expanded',String(open));button.querySelector('.demo-console-toggle-label').textContent=open?'收起控制台':'演示控制台'}
    function chooseDemoDomain(domain){if(window.homeworkDemoConsole?.isActive()){window.homeworkDemoConsole.role(domain);return;}if(domain==='parent')startParentScenario('first');else if(domain==='teacher')startTeacherFlow('first')}
    function startParentScenario(name){parentPrototype.scenario(name)}
    function restartTeacherScenario(){startTeacherFlow(teacherScenario||'first')}
    function clearDemoCacheAndRestart(){['ai_companion_demo_parent_v2',teacherDemoSessionKey,teacherManualLogoutKey,'ai_companion_demo_teacher_wechat_binding'].forEach(key=>localStorage.removeItem(key));if(stage==='parent')parentPrototype.restart();else restartTeacherScenario()}
    if(params.has('workView')){workbenchPrototype.demoIdentity(params.get('identity')||'subject');workbenchPrototype.view(params.get('workView'));if(params.get('classId'))workbenchPrototype.class(params.get('classId'));if(['learning','homework','mine'].includes(params.get('tab')))teacherTab=params.get('tab');}
    document.querySelectorAll('[data-teacher-flow]').forEach(b=>b.addEventListener('click',()=>startTeacherFlow(b.dataset.teacherFlow)));if(['auth','code','confirm','pending','approved'].includes(stage))stage='parent';restoreDemoTeacherOnLaunch();if(stage==='teacherLaunch'&&!teacherScenario)startTeacherFlow('first');else if(stage==='parent'){if(params.get('scenario'))parentPrototype.scenario(params.get('scenario'));else parentPrototype.start();}else ({home,parent:parentPrototype.render,teacherLaunch,teacherLogin,teacherPhone:teacherPhoneLogin,teacherBind,teacherDeviceConfirm,teacherDeviceKicked,teacherDesk,teacherSecurity,teacherUnavailable:showTeacherAccountUnavailable}[stage]||home)();
  </script>
